[build]
  command = "npm run fix:strict-live && npm run fix:duplicates && npm run integrate:unified-design && node scripts/inject-design-refinements.mjs && npm test && npm run test:archive-hu && npm run test:copy && npm run test:coverage"
  publish = "."

[build.environment]
  NODE_VERSION = "22"
  BANHALMI_RELEASE = "2026-07-29-design-audit-v1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
