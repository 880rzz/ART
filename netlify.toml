[build]
  command = "npm run fix:strict-live && npm run fix:duplicates && npm run integrate:unified-design && npm test && npm run test:archive-hu && npm run test:copy && npm run test:coverage"
  publish = "."

[build.environment]
  NODE_VERSION = "22"
  BANHALMI_RELEASE = "2026-07-27-apple-design-system-v1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/css/archive-system.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"