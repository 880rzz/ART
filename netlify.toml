[build]
  command = "npm run fix:strict-live && node scripts/apply-unified-design.mjs && node tests/audit-unified-design.mjs && npm test && npm run test:archive-hu && npm run test:copy && npm run test:coverage"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
