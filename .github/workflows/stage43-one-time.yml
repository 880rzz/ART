name: Stage 43 ART llms agent index migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage43-one-time.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded ART llms migration
        run: node tools/stage43-llms-agent-index.mjs
      - name: Verify migrated AI contracts
        run: python3 tools/audit_geo_gdpr_llm.py && node tests/audit-pagespeed-accessibility-stage31.mjs && node tests/audit-ai-clarity-stage32.mjs
      - name: Remove one-time tooling
        run: rm -f .github/workflows/stage43-one-time.yml tools/stage43-llms-agent-index.mjs
      - name: Commit verified migration
        run: |
          git config user.name "BANHALMI ART Stage 43 Bot"
          git config user.email "107166660+880rzz@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(ai): standardize ART llms agent entry index"
          git push origin main
# final pass after canonical evidence wording was aligned
