name: Repair Stage92 scope
on:
  push:
    branches:
      - fix/mobile-typography-audit-20260810
    paths:
      - .github/workflows/repair-stage92-scope.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-typography-audit-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scope service CTA selectors and refresh digest
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const cssPath='assets/css/homepage-two-tone-authority.css';
          let css=await readFile(cssPath,'utf8');
          const old='.btn,.svc-cta,.actions a';
          const next='.btn,main .svc-cta,#menu .svc-cta,.actions a';
          const count=css.split(old).length-1;
          if(count!==2) throw new Error(`Expected exactly 2 unscoped Stage92 CTA occurrences, found ${count}`);
          css=css.split(old).join(next);
          await writeFile(cssPath,css);
          const designPath='data/design-release.json';
          const design=JSON.parse(await readFile(designPath,'utf8'));
          const hash=createHash('sha256');
          for(const dir of ['assets/css','assets/js']) for(const name of (await readdir(dir)).filter(f=>/\.(?:css|js)$/.test(f)).sort()) hash.update(await readFile(path.join(dir,name)));
          for(const name of (await readdir('assets/video')).filter(f=>f.endsWith('.mp4')).sort()) hash.update(await readFile(path.join('assets/video',name)));
          design.assetDigest=hash.digest('hex').slice(0,16);
          await writeFile(designPath,JSON.stringify(design,null,2)+'\n');
          NODE
      - name: Run Stage92 audit
        run: node tests/audit-mobile-typography-stage92.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/homepage-two-tone-authority.css data/design-release.json
          git commit -m "fix: scope Stage92 service CTA typography"
          git push origin HEAD:fix/mobile-typography-audit-20260810
