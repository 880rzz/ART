name: One-time ART quiet-line rhythm
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: node tools/apply-quiet-line-rhythm.mjs
      - name: Create clean local candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-quiet-line-rhythm.yml
          git add -A
          git commit -m "Reduce ART decorative separators and footer rules"
      - name: Audit committed candidate
        run: npm test
      - name: Push audited candidate
        run: git push origin HEAD:main
