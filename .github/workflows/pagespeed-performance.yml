name: PageSpeed performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  bootstrap-hero-cta:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/home-hero-gallery-size-20260823'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply canonical CSS fix and self-clean workflow scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/css/site.css')
          css = path.read_text(encoding='utf-8')
          start = '/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */'
          if start not in css:
              block = '''\n/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */
/* Homepage-only desktop CTA geometry. Mobile <=640px remains governed by the existing two-column/narrow-viewport authority. */
@media (min-width:641px){
  html body.apple-archive[data-archive-page="index"] header.hero .hero-cta .btn{
    box-sizing:border-box!important;
    inline-size:10.5rem!important;
    min-inline-size:10.5rem!important;
    max-inline-size:10.5rem!important;
  }
}
/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */\n'''
              anchor = '/* APPLE-RESPONSIVE-CONTRACT-V1:END */'
              if anchor not in css:
                  raise SystemExit('canonical CSS authority end marker missing')
              path.write_text(css.replace(anchor, block + '\n' + anchor, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/apply-home-hero-cta-size-fix.yml .audit-trigger-hero-cta
          git fetch origin main
          git checkout origin/main -- .github/workflows/audit.yml .github/workflows/pagespeed-performance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Equalize homepage hero CTA desktop geometry'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  lighthouse-mobile:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare production-like Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.3.0'
          python scripts/generate-responsive-gallery.py _site
          node scripts/optimize-pages-artifact.mjs _site
      - name: Run mobile Lighthouse 100/100/100/100 gates
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-mobile-${{ github.sha }}
          path: artifacts/lighthouse
          if-no-files-found: warn
          retention-days: 14

  psi-crux-field:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check live mobile PSI and CrUX field data
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: node tools/audit-pagespeed-field.mjs
