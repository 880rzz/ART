name: One-time ART footer release finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-footer-release-once.yml'

permissions:
  contents: write

jobs:
  finalize-footer-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align runtime asset URLs and recalculate release digest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const configPath = 'data/design-release.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const oldToken = '20260812-art-motionless-v137';

          for (const dir of ['assets/css', 'assets/js']) {
            for (const name of fs.readdirSync(dir).sort()) {
              if (!(name.endsWith('.css') || name.endsWith('.js'))) continue;
              const file = path.join(dir, name);
              const original = fs.readFileSync(file, 'utf8');
              const updated = original.split(oldToken).join(config.release);
              if (updated !== original) fs.writeFileSync(file, updated);
            }
          }

          const hash = crypto.createHash('sha256');
          for (const name of fs.readdirSync('assets/css').filter(n => n.endsWith('.css')).sort()) {
            hash.update(fs.readFileSync(path.join('assets/css', name)));
          }
          for (const name of fs.readdirSync('assets/js').filter(n => n.endsWith('.js')).sort()) {
            hash.update(fs.readFileSync(path.join('assets/js', name)));
          }
          for (const name of fs.readdirSync('assets/video').filter(n => n.endsWith('.mp4')).sort()) {
            hash.update(fs.readFileSync(path.join('assets/video', name)));
          }
          config.assetDigest = hash.digest('hex').slice(0, 16);
          config.updated = '2026-08-13';
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          console.log(`Final release ${config.release} digest: ${config.assetDigest}`);
          NODE
      - name: Commit finalized release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css assets/js data/design-release.json
          if git diff --cached --quiet; then
            echo 'Release assets were already finalized.'
            exit 0
          fi
          git commit -m 'Finalize ART footer release runtime cache keys'
          git push origin HEAD:main
