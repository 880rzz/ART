name: ART footer release finalizer
on: push
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/footer-ecosystem-layout-20260813
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align nested CSS token and design digest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/footer-elegant.css')
          s=p.read_text()
          s=s.replace("palette-blue-final.css?v=20260813-art-footer-v138", "palette-blue-final.css?v=20260813-art-footer-v139")
          p.write_text(s)
          PY
          node --input-type=module <<'NODE'
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const hash=createHash('sha256');
          for(const f of (await readdir('assets/css')).filter(x=>x.endsWith('.css')).sort()) hash.update(await readFile('assets/css/'+f));
          for(const f of (await readdir('assets/js')).filter(x=>x.endsWith('.js')).sort()) hash.update(await readFile('assets/js/'+f));
          for(const f of (await readdir('assets/video')).filter(x=>x.endsWith('.mp4')).sort()) hash.update(await readFile('assets/video/'+f));
          const digest=hash.digest('hex').slice(0,16);
          const cfg=JSON.parse(await readFile('data/design-release.json','utf8'));
          cfg.assetDigest=digest;
          await writeFile('data/design-release.json', JSON.stringify(cfg,null,2)+'\n');
          console.log('design digest',digest);
          NODE
          npm run bump:release
      - name: Commit final release and remove helper
        shell: bash
        run: |
          git rm .github/workflows/footer-release-finalize-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize footer design cache release'
          git push origin HEAD:agent/footer-ecosystem-layout-20260813
