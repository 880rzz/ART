name: Temporary Stage 75 record design migration

on:
  push:
    paths:
      - '.github/workflows/temp-stage75-record-design.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire record design, release token and digest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          js = Path('assets/js/responsive-header-system.js')
          text = js.read_text()
          needle = "  const cleanPath = window.location.pathname.replace(/\\/+$/, '');\n"
          insert = """  const cleanPath = window.location.pathname.replace(/\\/+$/, '');\n\n  /* Stage 75: exhibition and book record pages share one catalogue design\n     without rewriting their archival HTML. The canonical path is sufficient\n     to classify the record family in all three language trees. */\n  const isExhibitionRecord = /\\/exhibitions\\/[^/]+\\.html$/i.test(cleanPath);\n  const isBookRecord = /\\/books\\/[^/]+\\.html$/i.test(cleanPath);\n  if (isExhibitionRecord) body.dataset.recordType = 'exhibition';\n  else if (isBookRecord) body.dataset.recordType = 'book';\n\n  if ((isExhibitionRecord || isBookRecord) && !document.querySelector('link[data-art-record-editorial]')) {\n    const recordEditorial = document.createElement('link');\n    recordEditorial.rel = 'stylesheet';\n    recordEditorial.href = '/assets/css/record-editorial-system.css?v=20260810-record-editorial-v75';\n    recordEditorial.dataset.artRecordEditorial = 'true';\n    document.head.appendChild(recordEditorial);\n  }\n"""
          if 'data.recordType' not in text and "dataset.recordType" not in text:
              if needle not in text:
                  raise SystemExit('cleanPath insertion point not found')
              text = text.replace(needle, insert, 1)
          text = text.replace('20260810-content-flow-v74', '20260810-record-editorial-v75')
          js.write_text(text)

          cfg_path = Path('data/design-release.json')
          cfg = json.loads(cfg_path.read_text())
          cfg['release'] = '20260810-record-editorial-v75'
          cfg['note'] = ('Stage 75 record editorial refinement: exhibition and book pages now use a shared museum-catalogue hierarchy, strict dark/light blue block alternation, quieter factual rows, image-first exhibition galleries, artefact-led book layouts, and restrained disclosure/source areas while preserving all archival, SEO, GEO, LLM and schema content.')
          if 'record-editorial-system.css' not in cfg['stylesheets']:
              cfg['stylesheets'].append('record-editorial-system.css')
          cfg['assetDigest'] = 'PENDING'
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          PY

          npm run bump:release

          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const hash = crypto.createHash('sha256');
          for (const f of fs.readdirSync('assets/css').filter(f=>f.endsWith('.css')).sort()) hash.update(fs.readFileSync(path.join('assets/css',f)));
          for (const f of fs.readdirSync('assets/js').filter(f=>f.endsWith('.js')).sort()) hash.update(fs.readFileSync(path.join('assets/js',f)));
          for (const f of fs.readdirSync('assets/video').filter(f=>f.endsWith('.mp4')).sort()) hash.update(fs.readFileSync(path.join('assets/video',f)));
          const digest = hash.digest('hex').slice(0,16);
          const p='data/design-release.json';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.assetDigest=digest;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          console.log('Stage75 digest',digest);
          NODE

          rm .github/workflows/temp-stage75-record-design.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply ART exhibition and book editorial system"
          git push origin HEAD:main
