name: One-shot ART complete remediation

on:
  workflow_dispatch:
  push:
    branches:
      - audit/full-remediation-20260814
    paths:
      - .github/workflows/one-shot-browser-layout-remediation.yml

permissions:
  contents: write

concurrency:
  group: art-full-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-remediation-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove obsolete single-location GEO metadata
        run: node tools/remove-legacy-geo-meta-20260814.mjs
      - name: Remove redundant homepage period narrative
        run: node tools/remove-redundant-presence-periods-20260814.mjs
      - name: Simplify homepage to an archive orientation layer
        run: node tools/simplify-homepage-orientation-20260814.mjs
      - name: Normalize embedded Person and Organization location references
        run: node tools/normalize-embedded-entity-locations-20260814.mjs
      - name: Normalize archive social site name
        run: node tools/normalize-og-site-name-20260814.mjs
      - name: Consolidate Press presentation into the single CSS authority
        run: node tools/migrate-press-inline-css-20260814.mjs
      - name: Apply Press footer and responsive browser-layout remediation
        run: node tools/remediate-browser-layout-20260814.mjs
      - name: Run complete source audits
        run: npm test
      - name: Verify first-principles post-migration state
        run: node tools/audit-postmigration-first-principles-20260814.mjs
      - name: Commit ART remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+880rzz@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Simplify ART orientation and fix audited archive UI defects'
          git push origin HEAD:audit/full-remediation-20260814

# remediation trigger 2026-08-14-2
