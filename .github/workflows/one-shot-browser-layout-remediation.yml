name: One-shot ART browser layout remediation

on:
  push:
    branches: [audit/full-remediation-20260814]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-remediation-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted browser-layout remediation
        run: node tools/remediate-browser-layout-20260814.mjs
      - name: Run source audits
        run: npm test
      - name: Commit site.css remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          if git diff --cached --quiet; then
            echo 'No CSS changes to commit.'
            exit 0
          fi
          git commit -m 'Fix ART intro alignment and consent touch targets'
          git push origin HEAD:audit/full-remediation-20260814
