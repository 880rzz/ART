name: One-shot ART browser layout remediation

on:
  push:
    branches: [audit/full-remediation-20260814]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-remediation-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consolidate Press CSS into the single authority
        run: node tools/migrate-press-inline-css-20260814.mjs
      - name: Apply first-principles browser-layout remediation
        run: node tools/remediate-browser-layout-20260814.mjs
      - name: Run source audits
        run: npm test
      - name: Commit ART presentation remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+880rzz@users.noreply.github.com'
          git add assets/css/site.css press.html hu/press.html de-at/press.html
          if git diff --cached --quiet; then
            echo 'No presentation changes to commit.'
            exit 0
          fi
          git commit -m 'Consolidate ART Press CSS and fix layout density'
          git push origin HEAD:audit/full-remediation-20260814
