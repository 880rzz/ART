name: One-time stage37 design ownership analysis
on:
  push:
    branches: [main]
    paths:
      - 'tools/analyze-design-ownership-stage37.mjs'
      - '.github/workflows/one-time-stage37-design-ownership.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/analyze-design-ownership-stage37.mjs
