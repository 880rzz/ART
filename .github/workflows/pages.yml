name: Deploy production archive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run complete archive audit
        run: npm test

      - name: Prepare immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/

          # Pillow is pinned so the deployment image transform is reproducible.
          # Responsive derivatives exist only in the Pages artifact; the archive
          # master photographs in git are never recompressed or overwritten.
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.3.0'
          python scripts/generate-responsive-gallery.py _site

          # Keep the source repository modular and auditable, but ship a lean
          # production artifact: local CSS files are bundled per page shape,
          # homepage LCP discovery is explicit, and below-fold gallery plates
          # receive responsive candidates instead of oversized master files.
          node scripts/optimize-pages-artifact.mjs _site

          rm -rf \
            _site/.github \
            _site/tests \
            _site/tools \
            _site/scripts \
            _site/docs \
            _site/node_modules
          rm -f \
            _site/.gitignore \
            _site/.DS_Store \
            _site/package.json \
            _site/package-lock.json \
            _site/README.md
          find _site -maxdepth 1 -type f -name 'AUDIT*.md' -delete
          printf '%s\n' "$GITHUB_SHA" > _site/deployment-sha.txt

          if find _site -type l -print -quit | grep -q .; then
            echo '::error::The Pages artifact must not contain symbolic links.'
            exit 1
          fi

          required_files=(
            index.html
            hu/index.html
            de-at/index.html
            404.html
            CNAME
            .nojekyll
            sitemap.xml
            robots.txt
            _redirects
            ai.txt
            llms.txt
            archive-record-registry.json
            artistic-presence-context.json
            assets/css/museum-editorial.css
            deployment-sha.txt
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "_site/$file" ]]; then
              echo "::error::Required production file missing from artifact: $file"
              exit 1
            fi
          done

          if ! find _site/assets/css/bundles -type f -name 'art-*.css' -print -quit | grep -q .; then
            echo '::error::Production CSS bundle was not generated.'
            exit 1
          fi

          responsive_640_count="$(find _site/assets/img/best-of/responsive -type f -name 'best-of-*-640.webp' | wc -l | tr -d ' ')"
          if (( responsive_640_count < 10 )); then
            echo "::error::Too few useful 640px homepage gallery derivatives were generated: $responsive_640_count"
            exit 1
          fi

          responsive_384_count="$(find _site/assets/img/best-of/responsive -type f -name 'best-of-*-384.webp' | wc -l | tr -d ' ')"
          if (( responsive_384_count < 10 )); then
            echo "::error::Too few useful 384px homepage gallery derivatives were generated: $responsive_384_count"
            exit 1
          fi

          for page in index.html hu/index.html de-at/index.html; do
            stylesheet_count="$(grep -Eo '<link rel="stylesheet" href="/assets/css/[^\"]+"' "_site/$page" | wc -l | tr -d ' ')"
            if [[ "$stylesheet_count" != '1' ]]; then
              echo "::error::$page should load exactly one local production stylesheet, found $stylesheet_count."
              exit 1
            fi
            grep -Fq '<link rel="preload" as="image" href="/assets/img/hero.webp" fetchpriority="high">' "_site/$page"
            if grep -Eq 'best-of-01\.webp[^>]+loading="eager"|best-of-01\.webp[^>]+fetchpriority="high"' "_site/$page"; then
              echo "::error::$page still gives the below-fold first gallery plate eager/high priority."
              exit 1
            fi
            responsive_srcset_count="$(grep -Eo 'srcset="/assets/img/best-of/responsive/best-of-[0-9]{2}-384\.webp' "_site/$page" | wc -l | tr -d ' ')"
            if (( responsive_srcset_count < 10 )); then
              echo "::error::$page has too few responsive first-batch gallery srcsets: $responsive_srcset_count"
              exit 1
            fi
          done

          if ! grep -Fxq 'www.banhalmi.art' _site/CNAME; then
            echo '::error::CNAME does not contain the canonical archive domain.'
            exit 1
          fi

          for forbidden in .github tests tools scripts docs node_modules package.json package-lock.json README.md .DS_Store; do
            if [[ -e "_site/$forbidden" ]]; then
              echo "::error::Repository-only path leaked into Pages artifact: $forbidden"
              exit 1
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment client
        uses: actions/checkout@v4

      - name: Deploy archive through Pages API without automatic cancellation
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGES_POLL_INTERVAL_MS: '10000'
          PAGES_POLL_TIMEOUT_MS: '2700000'
        run: node tools/deploy-pages-api.mjs

      - name: Verify exact archive commit is live
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --max-time 20 'https://www.banhalmi.art/deployment-sha.txt' || true)"
            if [ "$actual" = "$expected" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Expected live SHA $expected but received ${actual:-nothing}." >&2
              exit 1
            fi
            sleep 10
          done

          curl -fsSL --max-time 20 -o /tmp/art-live-en.html "https://www.banhalmi.art/?deploy=$expected"
          grep -q 'Official Art Archive' /tmp/art-live-en.html
          grep -Fq '<link rel="preload" as="image" href="/assets/img/hero.webp" fetchpriority="high">' /tmp/art-live-en.html
          grep -Eq '<link rel="stylesheet" href="/assets/css/bundles/art-[a-f0-9]{16}\.css">' /tmp/art-live-en.html
          grep -Fq '/assets/img/best-of/responsive/best-of-01-640.webp 640w' /tmp/art-live-en.html
          live_bundle="$(grep -Eo '/assets/css/bundles/art-[a-f0-9]{16}\.css' /tmp/art-live-en.html | head -n1)"
          curl -fsSL --max-time 20 -o /tmp/art-live-bundle.css "https://www.banhalmi.art${live_bundle}?deploy=$expected"
          test -s /tmp/art-live-bundle.css
          curl -fsSL --max-time 20 -o /tmp/art-live-responsive.webp "https://www.banhalmi.art/assets/img/best-of/responsive/best-of-01-640.webp?deploy=$expected"
          test -s /tmp/art-live-responsive.webp

          curl -fsSL --max-time 20 -o /tmp/art-live-hu.html "https://www.banhalmi.art/hu/?deploy=$expected"
          grep -q 'Bánhalmi Norbert fotóművész | BANHALMI ART' /tmp/art-live-hu.html
          grep -Fq '/assets/img/best-of/responsive/best-of-01-640.webp 640w' /tmp/art-live-hu.html
          curl -fsSL --max-time 20 -o /tmp/art-live-de.html "https://www.banhalmi.art/de-at/?deploy=$expected"
          grep -q 'Norbert Bánhalmi Fotokünstler | BANHALMI ART' /tmp/art-live-de.html
          grep -Fq '/assets/img/best-of/responsive/best-of-01-640.webp 640w' /tmp/art-live-de.html
          curl -fsSL --max-time 20 -o /tmp/art-live-css.css "https://www.banhalmi.art/assets/css/museum-editorial.css?deploy=$expected"
          test -s /tmp/art-live-css.css

      - name: Verify live machine entry points
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (compatible; BANHALMI-Release-Audit/1.0)'

          curl -A "$ua" -H 'Cache-Control: no-cache' -fsSL --max-time 20 -o /tmp/art-robots.txt 'https://www.banhalmi.art/robots.txt'
          grep -Fq 'User-agent: *' /tmp/art-robots.txt
          grep -Fq 'Allow: /' /tmp/art-robots.txt
          grep -Fq 'Sitemap: https://www.banhalmi.art/sitemap.xml' /tmp/art-robots.txt
          if grep -Eq '^Disallow:[[:space:]]*/data/' /tmp/art-robots.txt; then
            echo 'Public /data/ evidence is unexpectedly blocked in live robots.txt' >&2
            exit 1
          fi
          grep -Eq '^Disallow:[[:space:]]*/reports/' /tmp/art-robots.txt
          curl -A "$ua" -H 'Cache-Control: no-cache' -fsSL --max-time 20 -o /tmp/art-image-kg.jsonld 'https://www.banhalmi.art/data/image-knowledge-graph.jsonld'
          test -s /tmp/art-image-kg.jsonld
          curl -A "$ua" -H 'Cache-Control: no-cache' -fsSL --max-time 20 -o /tmp/art-life-journey.json 'https://www.banhalmi.art/data/life-journey.json'
          test -s /tmp/art-life-journey.json

          curl -A "$ua" -H 'Cache-Control: no-cache' -fsSL --max-time 20 -o /tmp/art-sitemap.xml 'https://www.banhalmi.art/sitemap.xml'
          grep -Fq '<urlset' /tmp/art-sitemap.xml
          grep -Fq '<loc>https://www.banhalmi.art/' /tmp/art-sitemap.xml
          grep -Fq '<lastmod>' /tmp/art-sitemap.xml

          curl -A "$ua" -H 'Cache-Control: no-cache' -fsSL --max-time 20 -o /tmp/art-llms.txt 'https://www.banhalmi.art/llms.txt'
          grep -Fq '# BANHALMI ART' /tmp/art-llms.txt
          grep -Fq '## Identity' /tmp/art-llms.txt
          grep -Fq '## Evidence' /tmp/art-llms.txt
          grep -Fq '[AI reference](https://www.banhalmi.art/ai.txt)' /tmp/art-llms.txt
          grep -Fq 'https://www.norbertbanhalmi.com/' /tmp/art-llms.txt
          grep -Fq 'https://blog.banhalmi.art/' /tmp/art-llms.txt
          grep -Fq 'New York is not a studio, office, headquarters or operational base' /tmp/art-llms.txt

          curl -A "$ua" -H 'Cache-Control: no-cache' -fsSL --max-time 20 -o /tmp/art-ai.txt 'https://www.banhalmi.art/ai.txt'
          grep -Fq '## Canonical identity and archive answer contract' /tmp/art-ai.txt
          grep -Fq 'https://www.banhalmi.art/' /tmp/art-ai.txt
          grep -Fq 'https://www.norbertbanhalmi.com/' /tmp/art-ai.txt
          grep -Fq 'https://blog.banhalmi.art/' /tmp/art-ai.txt
          grep -Fq 'New York is not a studio, office, headquarters or operational base' /tmp/art-ai.txt

          blog_effective="$(curl -A "$ua" -H 'Cache-Control: no-cache' -sS -L --max-time 25 -o /dev/null -w '%{url_effective}' 'https://blog.banhalmi.art/blog')"
          case "$blog_effective" in
            https://blog.banhalmi.art/*) ;;
            *) echo "Unexpected live blog destination: $blog_effective" >&2; exit 1 ;;
          esac

      - name: Verify live legacy ecosystem routing
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (compatible; BANHALMI-Release-Audit/1.0)'

          check_stub() {
            local url="$1"
            local expected="$2"
            local out="$3"
            echo "Checking legacy stub: $url -> $expected"
            curl -A "$ua" -H 'Cache-Control: no-cache' -fsSL --max-time 20 -o "$out" "$url"
            if grep -Eqi '<meta[^>]+name="robots"[^>]+noindex|<meta[^>]+noindex[^>]+name="robots"' "$out"; then
              echo "Redirect source must not carry noindex: $url" >&2
              head -c 1200 "$out" >&2 || true
              exit 1
            fi
            if ! grep -Fq "rel=\"canonical\" href=\"$expected\"" "$out"; then
              echo "Wrong/missing canonical in $url; expected $expected" >&2
              grep -Eo '<link[^>]+rel="canonical"[^>]*>|<link[^>]+href="[^"]+"[^>]+rel="canonical"[^>]*>' "$out" >&2 || true
              exit 1
            fi
            if ! grep -Fq "url=$expected" "$out"; then
              echo "Wrong/missing meta refresh in $url; expected $expected" >&2
              grep -Eo '<meta[^>]+http-equiv="refresh"[^>]*>' "$out" >&2 || true
              exit 1
            fi
          }

          check_target() {
            local url="$1"
            local code
            echo "Checking canonical target: $url"
            code="$(curl -A "$ua" -H 'Cache-Control: no-cache' -sS -L --max-time 25 -o /dev/null -w '%{http_code}' "$url")"
            case "$code" in
              2*|3*) ;;
              *) echo "Target is not live: $url returned $code" >&2; exit 1 ;;
            esac
          }

          check_stub 'https://www.banhalmi.art/kapcsolat/' 'https://www.norbertbanhalmi.com/hu/kapcsolat/' /tmp/legacy-contact.html
          check_stub 'https://www.banhalmi.art/ajanlatkeres/' 'https://www.norbertbanhalmi.com/hu/ajanlatkeres/' /tmp/legacy-quote.html
          check_stub 'https://www.banhalmi.art/fotokiallitasok/ebredes/' 'https://www.banhalmi.art/hu/exhibitions/ebredes.html' /tmp/legacy-awakening.html
          check_stub 'https://www.banhalmi.art/post/euforia/' 'https://www.banhalmi.art/hu/exhibitions/euforia.html' /tmp/legacy-euforia.html
          check_stub 'https://www.banhalmi.art/blog/' 'https://blog.banhalmi.art/blog' /tmp/legacy-blog.html
          check_stub 'https://www.banhalmi.art/post/60-perc/' 'https://blog.banhalmi.art/post/60-perc' /tmp/legacy-60.html

          check_target 'https://www.norbertbanhalmi.com/hu/kapcsolat/'
          check_target 'https://www.norbertbanhalmi.com/hu/ajanlatkeres/'
          check_target 'https://www.banhalmi.art/hu/exhibitions/ebredes.html'
          check_target 'https://www.banhalmi.art/hu/exhibitions/euforia.html'
          check_target 'https://blog.banhalmi.art/blog'
          check_target 'https://blog.banhalmi.art/post/60-perc'
