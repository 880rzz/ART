name: Temporary bump ART consent a11y release
on:
  push:
    branches:
      - fix/art-consent-link-a11y-20260809
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/art-consent-link-a11y-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set release metadata and propagate cache token
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='data/design-release.json';
          const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.release='20260809-consent-a11y-v68';
          c.note='Stage 68 accessibility release: consent and legal links use a persistent non-colour underline affordance so Lighthouse/WCAG link identification does not depend on colour alone across the multilingual ART archive.';
          c.assetDigest='d134d49a2a8ca01d';
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          npm run bump:release
      - name: Commit generated release propagation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/design-release.json '*.html' '**/*.html'
          git diff --cached --quiet && exit 0
          git commit -m 'ops: propagate ART consent accessibility release v68'
          git push origin HEAD:fix/art-consent-link-a11y-20260809
