name: Temporary ART mobile axis diagnostic

on:
  push:
    branches: [fix/layout-palette-gallery-audit-20260815]
    paths: ['.github/workflows/diag-stage147-axis.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/layout-palette-gallery-audit-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare production-like artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.3.0'
          python scripts/generate-responsive-gallery.py _site
          node scripts/optimize-pages-artifact.mjs _site
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose 390px exhibition axis
        run: |
          set -euo pipefail
          node tools/perf-static-server.mjs _site 4173 >/tmp/art-diag-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          AUDIT_BASE_URL=http://127.0.0.1:4173 node tools/diag-stage147-axis.mjs
