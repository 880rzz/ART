name: ART identity and fine-art remediation

on:
  push:
    branches:
      - fix/art-identity-fineart-20260915

permissions:
  contents: write

jobs:
  remediate-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/art-identity-fineart-20260915

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic remediation
        run: node tools/remediate-art-identity-fineart-20260915.mjs

      - name: Validate diff integrity
        run: git diff --check

      - name: Commit remediation locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes produced."
          else
            git commit -m "Fix ART identity projections and fine-art authority"
          fi

      - name: Run full source audit
        run: npm test

      - name: Push verified remediation
        shell: bash
        run: |
          if [ "$(git rev-list --count origin/fix/art-identity-fineart-20260915..HEAD)" -gt 0 ]; then
            git push origin HEAD:fix/art-identity-fineart-20260915
          else
            echo "Branch already up to date."
          fi
