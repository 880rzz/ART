name: One-time Hungarian human language editorial pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-humanize-hungarian.yml'

permissions:
  contents: write

jobs:
  humanize-hungarian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rewrite visible Hungarian copy
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          files = sorted(Path('hu').rglob('*.html'))

          global_replacements = {
            'A valóság hamis arcai / Az internet hazugságai': 'A valóság hamis arcai',
            'Hivatkozási réteg': 'Források',
            'Kurátori rekord': 'Kapcsolódás az életműhöz',
            'Jelenlétkutatási korszak': 'Az életmű korszaka',
            'Dokumentált nyilvános történet': 'Kapcsolódó források',
            'Archívumrekord': 'Kapcsolódó oldal',
            'Kanonikus rekord a Wikimedia Commonson': 'A kép adatlapja a Wikimedia Commonson',
            'Történeti archívumindex': 'Korábbi és jelenlegi oldalak jegyzéke',
            'Központi, géppel olvasható entitásazonosító': 'Géppel olvasható életrajzi adatlap',
            'A Bánhalmi Norbert-entitás központi azonosítója.': 'Bánhalmi Norbert géppel olvasható életrajzi adatlapja.',
            'A régi Wix-rekordok és a jelenlegi kanonikus oldalak térképe': 'A korábbi oldalak és a jelenlegi archívum közötti megfelelések',
            'A jelenlegi életrajzi rekordban hivatkozott érvényes források teljes, deduplikált listája.': 'Az életrajzban hivatkozott források rendezett, ismétlések nélküli listája.',
            'entity-first archívum': 'összekapcsolt digitális archívum',
            'Executive portré': 'vezetői portré',
            'executive portré': 'vezetői portré',
            'fine art munkát': 'művészeti munkát',
            'fine art szintre': 'önálló művészi képpé',
            'edukációval': 'oktatással',
            'edukáció': 'oktatás',
            'official brand ambassador, Hungary': 'hivatalos magyarországi márkanagykövet',
            'honorary member': 'tiszteletbeli tag',
            'professional member': 'szakmai tag',
            '(painting)': '(festészet)',
            '(digital painting)': '(digitális festészet)',
            'amiket másoknak kurátorkodtam': 'amelyeknek én voltam a kurátora',
            'A Tripont Problog és a MILC Club felületére írva.': 'A Tripont Problogon és a MILC Clubon megjelent írásaim.',
            'az Olympus — ma OM SYSTEM — a magyarországi nagykövetévé tett': 'az Olympus — ma OM SYSTEM — felkért magyarországi márkanagykövetnek',
            'Miklós Vámos': 'Vámos Miklós',
            'Éva Lénárt': 'Lénárt Éva',
            'Magdolna Dank': 'Dank Magdolna',
            'Imre Csernus': 'Csernus Imre',
            'Olga Kovács': 'Kovács Olga',
            'Péter Telekes': 'Telekes Péter',
            'Ismersz karizmatikus embert, aki ide tartozik? Írjon nekem:': 'Ismer olyan embert, akinek a története kapcsolódhat a sorozathoz? Írjon nekem:',
            'a kötet szöveges rétegét Vámos Miklós és Lénárt Éva közreműködése adja': 'a kötet szövegeiben Vámos Miklós és Lénárt Éva működött közre',
            'könyvformátumú dokumentuma': 'történetét és képeit megőrző könyve',
            'Tizenkét, nőgyógyászati daganatos betegségen átesett nő': 'Tizenkét nő, akik nőgyógyászati daganatos betegségen estek át',
            'az emlékezet felfeslésről': 'az emlékezet változásáról és töredezettségéről',
            'nem csak esztétikai': 'nemcsak esztétikai',
          }

          for path in files:
            text = path.read_text(encoding='utf-8')
            for old, new in global_replacements.items():
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')

          def replace_between(path, start, end, replacement):
            p = Path(path)
            text = p.read_text(encoding='utf-8')
            i = text.find(start)
            j = text.find(end, i + len(start)) if i >= 0 else -1
            if i < 0 or j < 0:
              raise SystemExit(f'Marker not found in {path}: {start[:50]} / {end[:50]}')
            text = text[:i] + replacement + text[j:]
            p.write_text(text, encoding='utf-8')

          # Homepage: stronger, simpler opening and exhibition summaries.
          p = Path('hu/index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
            '<p class="presence-copy">1999 óta fényképezek. A témák változtak — katonai dokumentáció, klubok hajnalig, daganatos betegség után újrainduló életek —, a kérdés nem: mikor hagyja abba valaki a szereplést, és mikor van tényleg jelen. A fényképek, a könyvek, a kiállítások és a közösségi munka ezen az oldalon együtt adják ki a választ.</p>',
            '<p class="presence-copy">1999 óta fényképezek. Dolgoztam katonai dokumentációban, éjszakai klubokban, kórházi történetek mellett, New York utcáin és vezetőkkel a kamera előtt. A témák változtak, de a kérdés ugyanaz maradt: mikor felejti el valaki, hogy fényképezik, és mikor mutat meg magából valami valódit? Ezt a történetet őrzik együtt a képek, a könyvek és a kiállítások.</p>'
          )
          t = t.replace(
            'Bánhalmi Norbert fotográfiai életműve · dokumentációból portré, portréból könyv, kiállítás és vizuális emlékezet',
            'Bánhalmi Norbert fotográfiai életműve · portrék, könyvek, kiállítások és emberi történetek 1999 óta'
          )
          exhibition_copy = {
            'Egy archetípus, amit mindenki ismerni vél. A bécsi alkotótársaimmal együtt elölről olvastuk — és sokkal érdekesebbet találtunk a kliséhez képest.': 'A femme fatale alakját a bécsi alkotótársaimmal nem kész klisékből, hanem személyes történetekből próbáltuk újraértelmezni.',
            'Mesterséges intelligenciával generáltam portrékat, és úgy akasztottam ki őket a falra, mintha igaziak lennének. Az emberek elhitték — <strong>és pontosan ez volt a lényeg.</strong>': 'Mesterséges intelligenciával készítettem portrékat, majd valódi fényképekként mutattam be őket. A kiállítás azt vizsgálta, mennyire könnyen fogadunk el hitelesnek egy meggyőző képet.',
            'A fotózásban töltött huszadik évemre valami enyhén perverz dolgot csináltam: nem nyomtattam ki semmit.': 'A fotózásban töltött huszadik évemre szándékosan nem nyomtattam ki egyetlen képet sem.',
            'A szívemhez legközelebb álló projekt, és a legnehezebb, amiről gombóc nélkül tudok beszélni a torkomban.': 'Ez áll a legközelebb hozzám, és erről a legnehezebb beszélnem.',
          }
          for old,new in exhibition_copy.items(): t=t.replace(old,new)
          p.write_text(t, encoding='utf-8')

          # Curatorial dossier: replace the inflated opening with clear, credible language.
          p = Path('hu/curators.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
            '<h2>A rövid változat</h2><p class="lead">A munkám valahol a radikális puritanizmus és a méltóságteljes dokumentarizmus között áll. Az ív a katonai fegyelem szigorú struktúráitól a tantrikus intimitás szakrális káoszáig tart — leírva abszurdul hangzik, de őszintén ez az út. Ezek nemcsak esztétikai tárgyak, hanem esettanulmányok az identitásról, az emlékezet változásáról és töredezettségéről és a testtel való viszonyunk helyreállításáról. Három projekt tartja az egészet: a Mérföldkövek ’56, az Ébredés és A Nő világa. A munka a New York–Bécs–Budapest tengelyen mozog, és nemzetközileg a Saatchi Arton is látható.</p>',
            '<h2>A rövid változat</h2><p class="lead">A munkáim középpontjában az ember és a róla őrzött történet áll. A katonai dokumentáció fegyelme, New York utcái, a betegségből felépülő nők portréi, az 1956-os emigráció emlékei és a vezetői portrék látszólag távoli témák. Mégis ugyanaz köt össze mindent: hogyan lehet valakit pontosan, méltósággal és a rá osztott szerepeken túl megmutatni. Ennek az életműnek három fontos pillére a Mérföldkövek ’56, az Ébredés és A Nő világa.</p>'
          )
          replacements = {
            'a célkeresztben ma az emberi lélek rezdülései állnak': 'ma az ember legapróbb, őszinte gesztusaira figyelek',
            'A fekete-fehér átirat és a szoborszerű fény a hegeket a túlélés kitüntetéseiként integrálja a test harmóniájába; Vincent &amp; Vincent versei érzelmi rezonátorként működnek.': 'A fekete-fehér képeken a hegek nem elrejtendő sérülésként, hanem az átélt történet részeként jelennek meg. Vincent &amp; Vincent versei önálló hangon kapcsolódnak a portrékhoz.',
            'vizuális lázadás a fiatal-vékony-tökéletes háromszög ellen': 'válasz arra a szűk képre, amely a nőket csak fiatalnak, vékonynak és hibátlannak mutatja',
            'a művészet kilépett a fehér kockából a társadalmi fórumba': 'a kiállítás beszélgetéssé és közös gondolkodássá tágult',
            'a tantra masszázs holisztikus gondoskodásként, nem tárgyiasított testként': 'a tantra masszázs figyelmes emberi kapcsolódásként, nem tárgyiasított testként',
          }
          for old,new in replacements.items(): t=t.replace(old,new)
          p.write_text(t, encoding='utf-8')

          # Community page: keep warmth, remove performative cleverness.
          p = Path('hu/community.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
            'Néha megkérdezik, miért töltök annyi időt olyasmivel, ami nem hoz pénzt. Sosincs kéznél jó válaszom. Az őszinte az, hogy a fényképezőgép önmagában magányos tárgy — akkor lesz érdekes, amikor embereket hoz egy térbe. Minden, ami itt következik, így kezdődött.',
            'A közösségi munkáim nem különülnek el a fotográfiától. A fényképezőgép önmagában csak eszköz; akkor válik igazán érdekessé, amikor embereket hoz össze, tudást ad tovább, vagy kézzelfogható segítséget teremt. Az itt bemutatott kezdeményezések mind ebből indultak.'
          )
          t = t.replace('Jótékonysági akciók, amik valódi dolgokat javítottak meg','Jótékonysági portréprogramok')
          p.write_text(t, encoding='utf-8')

          # Writing page: make it natural and fully Hungarian.
          p = Path('hu/writing.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
            'Ezt a részt senki nem teszi plakátra, és értem is, hogy miért. De ha tudni szeretné, hogy valaki komolyan veszi-e a fotózást, figyelje meg, el tudja-e magyarázni. Évek óta írok technikáról, fényről és kudarcról — általában azért, mert valaki feltett egy kérdést, amire nem tudtam egy mondatban válaszolni.',
            'A fotográfiáról nemcsak képekben gondolkodom. Évek óta írok technikáról, fényről, munkamódszerről és azokról a hibákról is, amelyekből a legtöbbet tanultam. Többnyire egy-egy kérdésből indulok ki, amelyre nem lehet egyetlen mondattal válaszolni.'
          )
          t = t.replace(
            'Ezt elmondhatnám én magam is, és teljes joggal vonna vállat.',
            'Ennek a munkának a külső visszaigazolása is fontos számomra.'
          )
          t = t.replace(
            'Ez a cikk az oka annak, hogy a nagykövetség tény, nem pedig állítás a saját weboldalamon — és egy magyar fotósnak nem kis dolog, hogy japán lap ír róla japán kontextusban.',
            'A cikk független forrásként mutatja be a márkanagyköveti munkát és annak magyarországi eredményeit.'
          )
          p.write_text(t, encoding='utf-8')

          # Book pages: remove duplicated institutional paragraphs and keep one human summary plus facts.
          book_blocks = {
            'hu/books/book-ebredes.html': (
              '<p class="lead">A kiállítás után maradt valami, amit a falak nem bírtak el: a nők saját szavai. Ezért lett belőle könyv. Tizenkét történet, ugyanazok a hegek, és szöveg ott, ahol a fénykép abbahagyja.</p>',
              '<p class="lead">A kiállítás után maradt valami, amit a falak nem tudtak megőrizni: a résztvevők saját szavai. Ezért született meg a könyv. Tizenkét nő történetét és tizenöt fényképet kapcsol össze, Dr. Dank Magdolna, Elek Erika és Dr. Csernus Imre közreműködésével. A betegségről, a gyógyulásról és az újrakezdésről személyesen, de közérthetően beszél.</p>'
            ),
            'hu/books/book-anovilaga.html': (
              '<p class="lead">A kiállítás kilenc átmenetet mutatott meg; a könyv azt is, ami közöttük történik. Vámos Miklós és Lénárt Éva szövegei nem képaláírások — külön hangon beszélnek ugyanarról.</p>',
              '<p class="lead">A könyv a női élet kilenc meghatározó átmenetét követi, és azt is megmutatja, mi történik ezek között. A portrék mellett Vámos Miklós és Lénárt Éva szövegei önálló hangon beszélnek az identitás, a test és az önkép változásáról.</p>'
            ),
            'hu/books/book-szosszenetek.html': (
              '<p class="lead">A vándorkiállítás minden városban újratalálta magát, ezért nem lehetett belőle katalógus. A könyv inkább szabály: a kép nem illusztrálhatta a verset, a vers nem lehetett képaláírás. Ami maradt, az a kettő közötti feszültség.</p>',
              '<p class="lead">A Szösszenetek költészetet, fotográfiát és előadást kapcsol össze. A képek nem illusztrálják a verseket, a versek pedig nem képaláírásként működnek. Vincent &amp; Vincent, Kovács Olga, Telekes Péter és én ugyanahhoz a gondolathoz különböző művészeti nyelveken kapcsolódtunk.</p>'
            )
          }
          for fn,(old,new) in book_blocks.items():
            p=Path(fn); t=p.read_text(encoding='utf-8'); t=t.replace(old,new)
            # remove repetitive following lead paragraphs up to metadata
            t=re.sub(r'(Archívumi összefoglaló</p>\s*'+re.escape(new)+r')(?:\s*<p class="lead">.*?</p>){1,4}(\s*<p class="meta">)', r'\1\2', t, count=1, flags=re.S)
            p.write_text(t,encoding='utf-8')

          # Correct A Nő világa ISBN in schema only where incorrect.
          p=Path('hu/books/book-anovilaga.html'); t=p.read_text(encoding='utf-8')
          t=t.replace('"isbn":"9786150000534"','"isbn":"9786150018294"')
          p.write_text(t,encoding='utf-8')

          # EUFÓRIA: replace self-mythologising criticism section with a restrained authorial account.
          p=Path('hu/exhibitions/euforia.html'); t=p.read_text(encoding='utf-8')
          start='  <h2>Hat kritika — röviden</h2>'
          end='  <p class="meta" style="margin-top:1.6rem">Letöltések és források:'
          i=t.find(start); j=t.find(end,i)
          if i>=0 and j>=0:
            replacement='''  <h2>Mit tanított a kép utóélete</h2>\n  <p class="lead">A szabad licenc miatt a portré gyorsan kikerült abból a közegből, amelyben elkészítettem. Megjelent Wikipédia-oldalakon, híroldalakon és közösségi felületeken, egymástól nagyon különböző politikai értelmezések mellett. Számomra ez az utóélet is a munka részévé vált: hogyan változik meg egy portré jelentése, amikor már nem én döntöm el, hol és milyen összefüggésben találkoznak vele.</p>\n  <p class="lead">A képet nem szeretném előre történelmi ikonnak nevezni. Az viszont dokumentálható, hogy széles körben használt, nemzetközileg hivatkozott portrévá vált. Az alábbi források ezt az utat követik végig.</p>\n'''
            t=t[:i]+replacement+t[j:]
          t=t.replace('A kép robban az X-en: negyedmillió megtekintés órák alatt; John Cleese így osztja meg: „Oh, please, Yes!!”','A kép rövid idő alatt széles körben terjed az X-en; John Cleese is megosztja.')
          t=t.replace('A választások reggelén Magyar Péter ezzel a képpel indítja a napot — ez a pillanat tette a fotót ikonikussá.','A választások reggelén Magyar Péter is ezt a képet használja nyilvános bejegyzésében.')
          p.write_text(t,encoding='utf-8')

          # Natural wording in repeated archive relationship blocks.
          for path in files:
            text=path.read_text(encoding='utf-8')
            text=text.replace('Hogyan illeszkedik ez a fejezet az életműbe','Helye az életműben')
            text=text.replace('A kiállítás a jelenlét kutatásának egyik fejezete. Az életműben elfoglalt helyét a felvetett kérdés, a bemutatott munkák és a nyilvános történetét dokumentáló források együtt határozzák meg.','Ez a kiállítás az életmű egy meghatározott korszakához kapcsolódik. A következő hivatkozások megmutatják a hozzá tartozó műveket, történeteket és forrásokat.')
            text=text.replace('Ezek a hivatkozások azt dokumentálják, hogyan jelent meg a projekt, a könyv vagy a kiállítás a nyilvánosságban. Nem általános sajtólistát adnak, hanem kizárólag az adott rekordhoz közvetlenül kapcsolódó forrásokat.','Itt azok a források szerepelnek, amelyek közvetlenül ehhez a projekthez, könyvhöz vagy kiállításhoz kapcsolódnak.')
            path.write_text(text,encoding='utf-8')

          # Update modified dates for Hungarian pages.
          for path in files:
            text=path.read_text(encoding='utf-8')
            text=re.sub(r'"dateModified":"\d{4}-\d{2}-\d{2}"','"dateModified":"2026-08-05"',text)
            path.write_text(text,encoding='utf-8')

          print(f'Human-language pass completed on {len(files)} Hungarian HTML files.')
          PY
      - name: Remove one-time workflow before audit
        run: rm .github/workflows/one-time-humanize-hungarian.yml
      - name: Install dependencies
        run: npm ci
      - name: Run full repository audit
        run: npm test
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hu .github/workflows/one-time-humanize-hungarian.yml
          git diff --cached --quiet && exit 0
          git commit -m "Humanize and unify Hungarian editorial voice"
          git push
