  }
  html body.apple-archive.apple-archive.apple-archive.apple-archive h1{font-size:clamp(2.25rem,11vw,3.25rem)!important;letter-spacing:-.045em!important}
  html body.apple-archive.apple-archive.apple-archive.apple-archive h2{font-size:clamp(1.75rem,8vw,2.4rem)!important;letter-spacing:-.035em!important;max-width:none}
  html body.apple-archive.apple-archive.apple-archive.apple-archive h3{font-size:clamp(1.28rem,5.8vw,1.55rem)!important}
  html body.apple-archive.apple-archive.apple-archive.apple-archive main :is(p,li){font-size:1rem!important;line-height:1.65!important}
  html body.apple-archive.apple-archive.apple-archive.apple-archive main :is(.lead,p.lead){font-size:1.08rem!important;line-height:1.58!important}
  html body.apple-archive.apple-archive.apple-archive.apple-archive main>section{padding-block:3.35rem!important}
  html body.apple-archive.apple-archive.apple-archive.apple-archive main :is(.timeline,.chronology,[data-chronology]) > :is(.t-item,.timeline-item,article,li){
    padding:1.3rem 1.1rem!important;
  }
  html body.apple-archive.apple-archive.apple-archive.apple-archive footer{padding:3.5rem 1.25rem 2.15rem!important}
  html body.apple-archive.apple-archive.apple-archive.apple-archive footer>.wrap{width:min(100%,34rem)!important}
  html body.apple-archive.apple-archive.apple-archive.apple-archive footer .socials.lang-switch{width:min(100%,30rem)!important}
}
/* STAGE95-APPLE-POLISH:END */
'''
              css.write_text(text+block)

          # Conservative, manually reviewed human-language corrections on the curatorial dossier.
          replacements={
          'hu/curators.html':[
          ('<h2>5 · A technológus művész</h2>','<h2>5 · A technológia mint alkotói eszköz</h2>'),
          ('A 2024-es Touch Bécs és Touch München a spiritualitás felé fordul: a tantra masszázs figyelmes emberi kapcsolódásként, nem tárgyiasított testként. A korábbi fekete-fehér átadja a helyét az arany tónusoknak és a gyertyafénynek. Olyan társadalmakban, ahol az érintéséhség népbetegséggé vált, az érintés rehabilitálása tűnt a leghasznosabbnak, amit a fotográfia tehet.','A 2024-es Touch Bécs és Touch München az érintést a figyelmes emberi kapcsolódás felől közelíti meg, nem a test tárgyiasításán keresztül. A korábbi fekete-fehér képi világ helyét arany tónusok és gyertyafény veszik át. A sorozatok azt vizsgálják, hogyan lehet az érintést ismét biztonságos, figyelmes és emberi kapcsolódásként megélni.'),
          ('<strong>Hiteles narratíva</strong> — Mélyen humanista művész katonai háttérrel — olyan történet, amit a művek alátámasztanak, nem csak díszítenek.','<strong>Hiteles alkotói ív</strong> — A katonai háttértől a humanista fotográfiáig vezető út nem önéletrajzi díszlet: a művek témáiban, módszerében és fegyelmében is követhető.'),
          ('<strong>Társadalmi beágyazottság</strong> — Nem l&#x27;art pour l&#x27;art: emigráció, betegség, női szerepek, történelmi emlékezet.','<strong>Társadalmi beágyazottság</strong> — A munkák nem önmagukért léteznek: emigrációról, betegségről, női szerepekről és történelmi emlékezetről beszélnek.'),
          ('<strong>Vizuális konzisztencia</strong> — A radikális puritanizmus és a fekete-fehér egységes, felismerhető arculatot ad az életműnek.','<strong>Vizuális következetesség</strong> — A fegyelmezett kompozíció és a visszatérő fekete-fehér képi nyelv felismerhető egységet ad az életműnek.'),
          ('<strong>Technikai innováció</strong> — Az NFT- és digitáliskiállítás-tapasztalat megszólítja a fiatalabb gyűjtőket és a technológiaorientált galériákat.','<strong>Technológiai kísérletezés</strong> — A digitális kiállítási és NFT-projektek azt mutatják, hogyan tágítható a fotográfia bemutatásának és gyűjtésének közege.')
          ],
          'curators.html':[
          ('<h2>5 · The technologist artist</h2>','<h2>5 · Technology as an artistic tool</h2>'),
          ('The 2024 Touch Vienna and Touch Munich projects turn toward spirituality: tantra massage as holistic care rather than objectified body. The earlier monochrome yields to gold tones and candlelight. In societies where skin hunger has become endemic, rehabilitating touch felt like the most useful thing photography could do.','The 2024 Touch Vienna and Touch Munich projects approach touch as attentive human connection rather than through the objectification of the body. The earlier monochrome language gives way to gold tones and candlelight. The series asks how touch can be experienced again as something safe, attentive and deeply human.'),
          ('<strong>Authentic narrative</strong> — A deeply humanist artist arriving from a military background — a story the works substantiate rather than decorate.','<strong>A credible artistic trajectory</strong> — The path from a military background to humanist photography is not biographical decoration; it is visible in the subjects, method and discipline of the work.'),
          ('<strong>Social embeddedness</strong> — Not l&#x27;art pour l&#x27;art: emigration, illness, female roles, historical memory.','<strong>Social grounding</strong> — The work is not art for art’s sake: it engages with emigration, illness, women’s roles and historical memory.'),
          ('<strong>Visual consistency</strong> — Radical purism and monochrome give the oeuvre a unified, recognisable identity.','<strong>Visual consistency</strong> — Disciplined composition and a recurring monochrome language give the oeuvre a recognisable coherence.'),
          ('<strong>Technical innovation</strong> — NFT and digital-exhibition experience speaks to younger collectors and technology-oriented galleries.','<strong>Technological experimentation</strong> — Digital exhibition and NFT projects explore how photography can move through new contexts of presentation and collecting.')
          ],
          'de-at/curators.html':[
          ('<h2>5 · Der Technologe als Künstler</h2>','<h2>5 · Technologie als künstlerisches Werkzeug</h2>'),
          ('Die Projekte Touch Wien und Touch München von 2024 wenden sich der Spiritualität zu: Tantra-Massage als ganzheitliche Fürsorge statt objektivierter Körper. Das frühere Schwarzweiß weicht Goldtönen und Kerzenlicht. In Gesellschaften, in denen Berührungshunger endemisch geworden ist, fühlte sich die Rehabilitierung der Berührung wie das Nützlichste an, was Fotografie tun kann.','Die Projekte Touch Wien und Touch München von 2024 betrachten Berührung als aufmerksame menschliche Verbindung und nicht über die Objektivierung des Körpers. Die frühere Schwarzweiß-Sprache weicht Goldtönen und Kerzenlicht. Die Serien fragen danach, wie Berührung wieder als sicher, aufmerksam und menschlich erlebt werden kann.'),
          ('<strong>Authentische Erzählung</strong> — Ein zutiefst humanistischer Künstler mit militärischer Herkunft — eine Geschichte, die die Werke belegen und nicht bloß schmücken.','<strong>Glaubwürdiger künstlerischer Weg</strong> — Der Weg vom militärischen Hintergrund zur humanistischen Fotografie ist keine biografische Dekoration; er zeigt sich in Themen, Methode und Disziplin der Arbeit.'),
          ('<strong>Gesellschaftliche Verankerung</strong> — Kein l&#x27;art pour l&#x27;art: Emigration, Krankheit, Frauenrollen, historische Erinnerung.','<strong>Gesellschaftliche Verankerung</strong> — Die Arbeiten sind kein Selbstzweck: Sie setzen sich mit Emigration, Krankheit, Frauenrollen und historischem Gedächtnis auseinander.'),
          ('<strong>Visuelle Konsistenz</strong> — Radikaler Purismus und Schwarzweiß geben dem Werk eine einheitliche, wiedererkennbare Identität.','<strong>Visuelle Konsistenz</strong> — Disziplinierte Komposition und eine wiederkehrende Schwarzweiß-Sprache geben dem Werk eine klar erkennbare Einheit.'),
          ('<strong>Technische Innovation</strong> — NFT- und Digitalausstellungs-Erfahrung spricht jüngere Sammler und technologieaffine Galerien an.','<strong>Technologisches Experimentieren</strong> — Digitale Ausstellungs- und NFT-Projekte erproben neue Kontexte für Präsentation und Sammlung von Fotografie.')
          ]}
          for rel,pairs in replacements.items():
              p=root/rel
              s=p.read_text()
              for old,new in pairs:
                  if old not in s:
                      raise SystemExit(f'Missing expected human-copy source in {rel}: {old[:70]}')
                  s=s.replace(old,new)
              p.write_text(s)

          # Permanent regression audit for the new visual authority and reviewed copy.
          audit=root/'tests/audit-apple-polish-stage95.mjs'
          audit.write_text(r'''import fs from 'node:fs';
const css=fs.readFileSync('assets/css/homepage-two-tone-authority.css','utf8');
const failures=[];
for(const token of ['STAGE95-APPLE-POLISH:START','--art-gutter:clamp(1.5rem,4.8vw,4.75rem)','--art-card-pad:clamp(1.35rem,2.8vw,2.4rem)','width:min(920px,100%)!important','padding:1.3rem 1.1rem!important']) if(!css.includes(token)) failures.push('missing design contract '+token);
const copies={
 'hu/curators.html':['A technológia mint alkotói eszköz','A munkák nem önmagukért léteznek','Technológiai kísérletezés'],
 'curators.html':['Technology as an artistic tool','The work is not art for art’s sake','Technological experimentation'],
 'de-at/curators.html':['Technologie als künstlerisches Werkzeug','Die Arbeiten sind kein Selbstzweck','Technologisches Experimentieren']
};
for(const [file,tokens] of Object.entries(copies)){const html=fs.readFileSync(file,'utf8');for(const t of tokens)if(!html.includes(t))failures.push(file+' missing reviewed copy: '+t)}
if(failures.length){console.error(failures.join('\n'));process.exit(1)}
console.log('Stage95 passed: Apple-like spacing/type/edge protection/footer polish and manually reviewed curatorial copy are present in HU/EN/DE.');''')

          pkg_path=root/'package.json'; pkg=json.loads(pkg_path.read_text())
          stage='node tests/audit-apple-polish-stage95.mjs'
          if stage not in pkg['scripts']['test']:
              pkg['scripts']['test'] += ' && '+stage
          pkg['scripts']['test:apple-polish']=stage
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')

          cfg_path=root/'data/design-release.json'; cfg=json.loads(cfg_path.read_text()); old=cfg['release']; new='20260810-apple-polish-v95'; cfg['release']=new; cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          # Keep internal cache keys/review markers aligned with the release.
          for base in [root/'assets/css',root/'assets/js',root/'data']:
              for p in base.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.css','.js','.json','.mjs','.txt'}:
                      try:s=p.read_text()
                      except UnicodeDecodeError:continue
                      if old in s:p.write_text(s.replace(old,new))
          # Compute the guarded asset digest exactly like audit-release-freshness.
          h=hashlib.sha256()
          for p in sorted((root/'assets/css').glob('*.css')): h.update(p.read_bytes())
          for p in sorted((root/'assets/js').glob('*.js')): h.update(p.read_bytes())
          for p in sorted((root/'assets/video').glob('*.mp4')): h.update(p.read_bytes())
          cfg=json.loads(cfg_path.read_text()); cfg['assetDigest']=h.hexdigest()[:16]; cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          PY
          npm run bump:release
          node tests/audit-apple-polish-stage95.mjs
      - name: Commit generated migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Stage95 Apple polish and human copy pass"
          git push origin HEAD:fix/apple-polish-human-copy-20260810
