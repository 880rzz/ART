name: Stage95 Apple polish one-shot

on:
  push:
    branches: [fix/apple-polish-human-copy-20260810]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apple-polish-human-copy-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: |
          python3 tools/apply-stage95.py
          npm run bump:release
          node tests/audit-apple-polish-stage95.mjs
      - name: Commit generated migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Stage95 Apple polish and human copy pass"
          git push origin HEAD:fix/apple-polish-human-copy-20260810
