  }
  html body.apple-archive.apple-archive.apple-archive.apple-archive h1{font-size:clamp(2.45rem,8vw,4.15rem)!important;line-height:1.03!important}
  html body.apple-archive.apple-archive.apple-archive.apple-archive h2{font-size:clamp(1.9rem,5.8vw,2.85rem)!important;line-height:1.09!important}
