name: Stage95 Apple polish one-shot
on:
  push:
    branches: [fix/apple-polish-human-copy-20260810]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apple-polish-human-copy-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Stage95 design and human-copy pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          root=Path('.')
          css=root/'assets/css/homepage-two-tone-authority.css'
          text=css.read_text()
          marker='/* STAGE95-APPLE-POLISH:START */'
          if marker not in text:
              block=r'''

/* STAGE95-APPLE-POLISH:START */
