  padding-top:1.1rem!important;
  border-top:1px solid rgba(175,196,217,.14)!important;
}
html body.apple-archive.apple-archive.apple-archive.apple-archive footer .fineprint a,
html body.apple-archive.apple-archive.apple-archive.apple-archive footer .consent-reset{
