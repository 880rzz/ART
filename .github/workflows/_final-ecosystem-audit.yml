name: Temporary final ecosystem remediation

on:
  push:
    branches:
      - agent/final-ecosystem-audit-20260802

permissions:
  contents: write

jobs:
  remediate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-ecosystem-audit-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final information architecture and design hardening
        run: node scripts/_apply-final-ecosystem-audit.mjs
      - name: Apply the release token to every page
        run: npm run bump:release
      - name: Run the complete SEO, GEO, schema, LLM, GDPR, link and design audit suite
        run: npm test
      - name: Remove the one-use remediation mechanism
        run: git rm scripts/_apply-final-ecosystem-audit.mjs .github/workflows/_final-ecosystem-audit.yml
      - name: Commit audited source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Harden archive IA, chronology and Person routing"
          git push
