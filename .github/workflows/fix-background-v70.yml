name: Generate ART background v70 hotfix

on:
  push:
    branches:
      - fix/art-background-runtime-v70-20260809

permissions:
  contents: write

jobs:
  repair-background-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/art-background-runtime-v70-20260809
          fetch-depth: 0

      - name: Apply deterministic background lock
        run: node scripts/apply-background-v70.mjs

      - name: Bump every versioned asset URL
        run: node scripts/bump-editorial-release-cache.mjs

      - name: Synchronize release digest
        run: node scripts/sync-design-release-digest.mjs

      - name: Remove one-off generator tooling before repository audit
        run: rm -f .github/workflows/fix-background-v70.yml scripts/apply-background-v70.mjs scripts/sync-design-release-digest.mjs

      - name: Run full ART audit on final tree
        run: npm test

      - name: Commit audited final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(design): lock ART blue backgrounds and bump v70 [background-v70-generated]"
          git push origin HEAD:fix/art-background-runtime-v70-20260809
