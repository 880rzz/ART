name: Isolated editorial source snapshot
on:
  push:
    branches: [audit/art-editorial-source-snapshot-20261006]
    paths: [.github/workflows/editorial-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5703c535881d893eb566edefd34e91b3bede0182
          persist-credentials: false
      - name: Read historical ART and candidate publication sources
        run: |
          mkdir -p /tmp/editorial-recovery
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,re,concurrent.futures,pathlib,datetime
          from html.parser import HTMLParser
          out=pathlib.Path('/tmp/editorial-recovery')
          archive=[
            'https://web.archive.org/web/20250418090703/https://www.banhalmi.art/mediamegjelenesek',
            'https://web.archive.org/web/20250120231238/https://www.banhalmi.art/bemutatkozas',
            'https://web.archive.org/web/20250120224757/https://www.banhalmi.art/konyveim',
            'https://web.archive.org/web/20250323083511/https://www.banhalmi.art/fotokiallitasok',
            'https://web.archive.org/web/20180621233214/http://www.tripont.hu/problog/3032/egy_kezdo_fotos_new_yorkban',
            'https://web.archive.org/web/20180217103411/http://www.tripont.hu/problog/2950/aktfozoas_otthon_a_furdoszobaban',
            'https://web.archive.org/web/20181107032149/http://www.tripont.hu/problog/3182/a_legkisebbel_a_nagyok_kozott'
          ]
          candidates=[
            'https://konyv.guru/nyero-paros-nok-kepekben-szavakban/',
            'https://www.femcafe.hu/cikkek/lifestyle/banhalmi-norbert-ebredes-betegseg-foto-kiallitas?page=1&read_more=1',
            'https://she.life.hu/herself/2018/05/a-retusalatlan-test-is-szep-portre-kotet-a-nokrol',
            'https://volksgruppen.orf.at/magyarok/stories/3228649/',
            'https://www.veol.hu/galeria/konya-peter-kiallitasa-a-tihanyi-rege-galeriaban/1',
            'https://likebalaton.hu/telepules/tihany/hireink/szabo-sipos-barnabas-szinesz-kepeibol-nyilt-kiallitas-tihanyban-197333/',
            'https://kultura.hu/az-ember-lelke-visszarazodik-ahhoz-ami-tenyleg-fontos-kiallitas-a-traumafeldolgozasrol-tihanyban/',
            'https://zarido.hu/the-frame-digitalis-fotomuveszeti-kiallitas-tihanyban/',
            'https://mindennapkonyv.hu/mindennapi/olvastuk/a-noi-let-kilenc-fordulopontja-banhalmi-norbert-a-no-vilaga',
            'https://www.tripont.hu/amikor-keznel-van-par-lume-cube-b602.html',
            'https://www.milcclub.com/post/amikor-csak-egy-t%C3%A1ncpartnered-van-eg%C3%A9sz-est%C3%A9re',
            'https://www.tripont.hu/rgb-fotozas-az-uj-trend--b1051.html',
            'https://www.magyariskola.at/zongora-projekt',
            'https://rolunk.at/aktualis/a-fiataloknak-ma-mar-bizonyitek-kell-egy-becsi-kreativ-kozosseg-uj-generaciot-epit/'
          ]
          class Reader(HTMLParser):
            def __init__(self):super().__init__(convert_charrefs=True);self.skip=0;self.out=[];self.links=[];self.current=None;self.title=False;self.title_text='';self.meta={}
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=='meta':self.meta[a.get('property') or a.get('name') or '']=a.get('content','')
              if t=='title':self.title=True
              if t in ('script','style','svg'):self.skip+=1
              if self.skip:return
              if t in ('p','li','div','section','article','br','h1','h2','h3','h4'):self.out.append('\n')
              if t=='a':self.current={'href':a.get('href',''),'text':''};self.links.append(self.current)
            def handle_endtag(self,t):
              if t=='title':self.title=False
              if t in ('script','style','svg') and self.skip:self.skip-=1;return
              if t=='a':self.current=None
              if not self.skip and t in ('p','li','div','h1','h2','h3','h4'):self.out.append('\n')
            def handle_data(self,d):
              if self.title:self.title_text+=d
              if not self.skip:
                self.out.append(d)
                if self.current is not None:self.current['text']+=d
          def fetch(item):
            i,url=item
            result={'url':url,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'semanticApproval':False}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BANHALMI-Source-Audit/1.0)'})
              with urllib.request.urlopen(req,timeout=30) as response:
                raw=response.read(6000000).decode('utf-8','replace');r=Reader();r.feed(raw)
                text=re.sub('\n{3,}','\n\n','\n'.join(re.sub('[ \t]+',' ',line).strip() for line in ''.join(r.out).splitlines()))
                for link in r.links:
                  link['originalDestination']=re.sub(r'^(?:https?://web.archive.org)?/web/[0-9]+[a-z_]*/','',link['href'])
                result.update({'status':response.status,'finalUrl':response.url,'title':r.title_text,'meta':r.meta,'text':text,'links':r.links})
            except Exception as e:result['error']=str(e)
            name=f'{i:02d}.json';(out/name).write_text(json.dumps(result,ensure_ascii=False,indent=2));return {'file':name,'url':url,'title':result.get('title'),'status':result.get('status'),'error':result.get('error'),'semanticApproval':False}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            results=list(pool.map(fetch,enumerate(archive+candidates)))
          (out/'index.json').write_text(json.dumps({'baseline':'5703c535881d893eb566edefd34e91b3bede0182','scope':'Read-only historical and candidate-source capture, not a publication or semantic approval','sources':results},ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: historical-art-source-recovery
          path: /tmp/editorial-recovery
          if-no-files-found: error
          retention-days: 7
