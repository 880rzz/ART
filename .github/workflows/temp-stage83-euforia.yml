name: Temporary Stage 83 EUFORIA simplification
on:
  push:
    branches: [fix/art-stage83-page-simplification]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-stage83-euforia-disclosure.mjs
      - run: rm .github/workflows/temp-stage83-euforia.yml tools/apply-stage83-euforia-disclosure.mjs
      - run: |
          git config user.name "BANHALMI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: simplify EUFORIA source presentation"
      - run: npm test
      - run: git push
