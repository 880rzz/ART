name: One-time canonical edge redirect architecture

on:
  push:
    paths:
      - '.github/workflows/one-time-edge-redirect-architecture.yml'
      - 'tools/one_time_edge_redirect_architecture.py'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align canonical identity and redirect sources
        run: python3 tools/one_time_edge_redirect_architecture.py
      - name: Remove one-time automation
        run: |
          rm -f .github/workflows/one-time-edge-redirect-architecture.yml
          rm -f tools/one_time_edge_redirect_architecture.py
      - name: Run complete archive audit
        run: npm test
      - name: Commit audited redirect architecture
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden canonical identity and edge redirects"
          git push
