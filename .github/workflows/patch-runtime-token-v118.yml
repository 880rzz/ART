name: Patch runtime cache token v118
on:
  push:
    branches: [fix/nav-books-typography-20260811]
    paths: ['.github/workflows/patch-runtime-token-v118.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-books-typography-20260811
      - name: Sync runtime cache tokens
        shell: bash
        run: |
          sed -i 's/20260811-menu-anchor-v117/20260811-menu-books-v118/g' assets/js/responsive-header-system.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/responsive-header-system.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync ART runtime cache tokens'
          git push origin HEAD:fix/nav-books-typography-20260811
