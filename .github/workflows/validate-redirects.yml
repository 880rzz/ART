name: Build and validate legacy redirects

on:
  push:
    paths:
      - redirects.json
      - scripts/build-google-redirects.mjs
      - '.github/workflows/validate-redirects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate redirect documents
        run: node scripts/build-google-redirects.mjs
      - name: Validate targets and redirect markup
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const map = JSON.parse(fs.readFileSync('redirects.json', 'utf8')).redirects;
          for (const [source, target] of Object.entries(map)) {
            const file = path.join(source.replace(/^\/+|\/+$/g, ''), 'index.html');
            const html = fs.readFileSync(file, 'utf8');
            if (/noindex/i.test(html)) throw new Error(`${file}: redirect document must not contain noindex`);
            if (!/http-equiv="refresh" content="0; /i.test(html)) throw new Error(`${file}: missing instant meta refresh`);
            if (!/rel="canonical"/i.test(html)) throw new Error(`${file}: missing canonical target`);
            if (!/^https?:\/\//i.test(target)) {
              const clean = target.split(/[?#]/)[0];
              const candidates = clean.endsWith('.html')
                ? [clean.slice(1)]
                : [path.join(clean.slice(1), 'index.html'), clean.slice(1)];
              if (!candidates.some((candidate) => fs.existsSync(candidate))) {
                throw new Error(`${source}: missing internal target ${target}`);
              }
            }
          }
          console.log(`Validated ${Object.keys(map).length} redirects.`);
          NODE
      - name: Commit generated redirect documents
        run: |
          if git diff --quiet; then
            echo "Redirect documents are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redirects.json scripts/build-google-redirects.mjs */index.html */*/index.html
          git commit -m "Generate Google-compatible legacy redirects"
          git push
