name: ART cross-site diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-cross-site-audit-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all audits with diagnostics
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee art-audit.log
          s1=${PIPESTATUS[0]}
          npm run test:archive-hu 2>&1 | tee -a art-audit.log
          s2=${PIPESTATUS[0]}
          npm run test:copy 2>&1 | tee -a art-audit.log
          s3=${PIPESTATUS[0]}
          npm run test:coverage 2>&1 | tee -a art-audit.log
          s4=${PIPESTATUS[0]}
          echo "statuses: $s1 $s2 $s3 $s4" | tee -a art-audit.log
          exit $((s1 || s2 || s3 || s4))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-cross-site-diagnostics
          path: art-audit.log
