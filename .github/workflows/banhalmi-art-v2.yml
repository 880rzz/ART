name: BANHALMI ART production build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'tools/**'
      - '.github/workflows/banhalmi-art-v2.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: banhalmi-art-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate archive tools
        run: python -m py_compile tools/full_presence_remediation.py tools/final_schema_alignment.py tools/archive_quality_pass.py tools/audit_complete_archive.py

      - name: Generate complete presence-led archive
        run: python tools/full_presence_remediation.py

      - name: Align homepage schema and social metadata
        run: python tools/final_schema_alignment.py

      - name: Curate homepage archive metadata
        run: python tools/archive_quality_pass.py

      - name: Run blocking archive audit and capture diagnostics
        id: archive_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/audit_complete_archive.py 2>&1 | tee archive-audit-diagnostics.txt

      - name: Comment audit diagnostics on pull request
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Complete archive audit diagnostics'
            echo '```text'
            cat archive-audit-diagnostics.txt
            echo '```'
          } > archive-audit-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file archive-audit-comment.md

      - name: Fail when archive audit failed
        if: steps.archive_audit.outcome == 'failure'
        run: exit 1

      - name: Commit audited generated files
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "BANHALMI ART build bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate verified presence-led production archive"
          git push origin HEAD:${{ github.ref_name }}
