name: BANHALMI ART production build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: banhalmi-art-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate archive tools
        run: python -m py_compile tools/full_presence_remediation.py tools/audit_complete_archive.py

      - name: Generate complete presence-led archive
        run: python tools/full_presence_remediation.py

      - name: Run blocking archive audit
        run: python tools/audit_complete_archive.py

      - name: Commit audited generated files
        run: |
          git config user.name "BANHALMI ART build bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate verified presence-led production archive"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
