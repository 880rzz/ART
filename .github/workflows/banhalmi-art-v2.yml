name: BANHALMI ART archive rebuild

on:
  workflow_dispatch:
  push:
    branches: [main, restore-art-complete-archive]
    paths:
      - 'assets/css/archive-system.css'
      - 'scripts/apply-unified-design.mjs'
      - 'tests/**'
      - '.github/workflows/banhalmi-art-v2.yml'

permissions:
  contents: write

concurrency:
  group: banhalmi-art-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply archive restoration, verified links and human voice
        run: npm run integrate:unified-design
      - name: Run complete repository audit
        run: npm test
      - name: Run human voice audit
        run: npm run test:copy
      - name: Run archive coverage audit
        run: npm run test:coverage
      - name: Commit generated page updates
        run: |
          if [[ -n "$(git status --porcelain -- '*.html')" ]]; then
            git config user.name "BANHALMI ART build bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- '*.html'
            git commit -m "Restore complete archive navigation, gallery and verified links"
            git push
          else
            echo "No generated HTML changes."
          fi