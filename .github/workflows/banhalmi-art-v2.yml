name: BANHALMI ART production build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: banhalmi-art-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate, audit and report diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          : > production-build-diagnostics.txt
          echo "BANHALMI ART production build diagnostics" >> production-build-diagnostics.txt
          echo "Commit: $GITHUB_SHA" >> production-build-diagnostics.txt
          echo >> production-build-diagnostics.txt

          python3 -m py_compile tools/full_presence_remediation.py tools/audit_complete_archive.py >> production-build-diagnostics.txt 2>&1
          SYNTAX_STATUS=$?
          echo "SYNTAX_STATUS=$SYNTAX_STATUS" >> production-build-diagnostics.txt

          if [ "$SYNTAX_STATUS" -eq 0 ]; then
            python3 tools/full_presence_remediation.py >> production-build-diagnostics.txt 2>&1
            BUILD_STATUS=$?
          else
            BUILD_STATUS=99
          fi
          echo "BUILD_STATUS=$BUILD_STATUS" >> production-build-diagnostics.txt

          if [ "$BUILD_STATUS" -eq 0 ]; then
            python3 tools/audit_complete_archive.py >> production-build-diagnostics.txt 2>&1
            AUDIT_STATUS=$?
          else
            AUDIT_STATUS=99
          fi
          echo "AUDIT_STATUS=$AUDIT_STATUS" >> production-build-diagnostics.txt

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            {
              echo '### Production build diagnostics'
              echo '```text'
              cat production-build-diagnostics.txt
              echo '```'
            } > pr-diagnostics.md
            gh pr comment "$GITHUB_EVENT_PATH" --body-file pr-diagnostics.md 2>/dev/null || gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-diagnostics.md
          fi

          if [ "$SYNTAX_STATUS" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ] || [ "$AUDIT_STATUS" -ne 0 ]; then
            exit 1
          fi
