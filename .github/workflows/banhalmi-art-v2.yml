name: BANHALMI ART archive rebuild

on:
  workflow_dispatch:
  push:
    branches: [main, elon-audit-2026, presence-oeuvre-archive-2026, full-presence-archive-remediation]
    paths:
      - 'assets/css/archive-system.css'
      - 'assets/css/presence-core.css'
      - 'assets/css/presence-press.css'
      - 'scripts/apply-unified-design.mjs'
      - 'tools/apply_presence_archive.py'
      - 'tools/full_presence_remediation.py'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/banhalmi-art-v2.yml'

permissions:
  contents: write

concurrency:
  group: banhalmi-art-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply unified editorial design
        run: npm run integrate:unified-design
      - name: Apply complete presence-led archive remediation
        run: python tools/full_presence_remediation.py
      - name: Commit generated page updates
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "BANHALMI ART build bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Apply complete presence-led archive remediation"
            git push
          else
            echo "No generated changes."
          fi
      - name: Presence-specific audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          bad=[]
          files=[p for p in Path('.').rglob('*.html') if not any(x in p.parts for x in ('node_modules','dist','.git'))]
          for p in files:
            s=p.read_text(encoding='utf-8')
            if 'presence-core.css' not in s: bad.append(f'missing shared CSS: {p}')
            if '#c9a962' in s or 'rgba(201,169,98' in s: bad.append(f'legacy gold: {p}')
            if '9786150000534' in s: bad.append(f'old ISBN: {p}')
            if p.name in ('index.html','curators.html'):
              if 'data-presence-context="2026"' not in s: bad.append(f'missing thesis: {p}')
              if 'data-source-hub="2026"' not in s: bad.append(f'missing source hub: {p}')
            if p.name=='press.html':
              for token in ('class="era"','class="desc"','class="note"','"@type":"ItemList"','G-90C452LJKQ'):
                if token not in s: bad.append(f'{token} missing: {p}')
          if not Path('archive-source-map.json').exists(): bad.append('missing archive-source-map.json')
          if bad:
            print('\n'.join(bad));sys.exit(1)
          print(f'Presence architecture verified in {len(files)} HTML files.')
          PY
      - name: Existing repository audits
        continue-on-error: true
        run: |
          npm test
          npm run test:copy
          npm run test:coverage
          npm run test:elon-clarity
