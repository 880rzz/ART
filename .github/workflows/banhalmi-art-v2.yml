name: BANHALMI ART v2 rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/css/archive-system.css'
      - 'scripts/apply-unified-design.mjs'
      - 'tests/audit-unified-design.mjs'
      - 'tests/audit-apple-design-system.mjs'
      - 'tests/audit-content-structure-duplicates.mjs'
      - '.github/workflows/banhalmi-art-v2.yml'

permissions:
  contents: write

concurrency:
  group: banhalmi-art-v2-main
  cancel-in-progress: true

jobs:
  rebuild-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply global v2 design and semantic hooks
        run: npm run integrate:unified-design
      - name: Run focused v2 design audits
        run: npm run test:unified-design && npm run test:apple-design && npm run test:content-structure
      - name: Commit generated page updates
        run: |
          if [[ -n "$(git status --porcelain -- '*.html')" ]]; then
            git config user.name "BANHALMI ART build bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- '*.html'
            git commit -m "Apply BANHALMI ART v2 system to all language pages"
            git push
          else
            echo "No generated HTML changes."
          fi
