name: BANHALMI ART production build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.json'
      - 'tools/**'
      - '.github/workflows/banhalmi-art-v2.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: banhalmi-art-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate archive tools
        run: |
          python -m py_compile \
            tools/full_presence_remediation.py tools/final_schema_alignment.py \
            tools/geo_schema_pass.py tools/gdpr_consent_pass.py \
            tools/archive_quality_pass.py tools/gallery_metadata_quality.py \
            tools/home_gallery_performance.py tools/human_voice_alignment.py \
            tools/editorial_voice_pass.py tools/presence_periods_pass.py \
            tools/oeuvre_integrity_pass.py tools/record_depth_pass.py \
            tools/record_relationships_pass.py tools/project_evidence_pass.py \
            tools/press_source_registry_pass.py tools/archive_record_registry_pass.py \
            tools/wikidata_entity_alignment.py tools/life_work_source_alignment.py \
            tools/conversation_source_registry_pass.py tools/period_evidence_backbone.py \
            tools/wikipedia_source_coverage_pass.py \
            tools/master_source_database_pass.py tools/press_accessibility_pass.py tools/normalize_press_accessibility.py \
            tools/move_presence_into_hero.py tools/concept_coverage_pass.py \
            tools/audit_editorial_voice.py tools/audit_design_system.py \
            tools/audit_presence_periods.py tools/audit_oeuvre_integrity.py \
            tools/audit_record_depth.py tools/audit_record_relationships.py \
            tools/audit_project_evidence.py tools/audit_press_source_registry.py \
            tools/audit_archive_record_registry.py tools/audit_wikidata_entity_alignment.py \
            tools/audit_life_work_source_alignment.py tools/audit_conversation_source_registry.py \
            tools/audit_period_evidence_backbone.py tools/audit_master_source_database.py \
            tools/audit_wikipedia_source_coverage.py tools/audit_geo_gdpr_llm.py \
            tools/audit_oeuvre_claim_consistency.py tools/audit_concept_coverage.py \
            tools/audit_complete_archive.py

      - name: Generate complete presence-led archive
        run: python tools/full_presence_remediation.py
      - name: Align homepage schema and social metadata
        run: python tools/final_schema_alignment.py
      - name: Align the two studio GEO entities
        run: python tools/geo_schema_pass.py
      - name: Preserve complete homepage curatorial metadata
        run: python tools/archive_quality_pass.py
      - name: Make complete gallery metadata truthful and unique
        run: python tools/gallery_metadata_quality.py
      - name: Optimise complete homepage gallery delivery
        run: python tools/home_gallery_performance.py
      - name: Normalize press archive accessibility
        run: python tools/normalize_press_accessibility.py
      - name: Align the human first-person voice
        run: python tools/human_voice_alignment.py
      - name: Align homepage editorial introductions
        run: python tools/editorial_voice_pass.py
      - name: Structure the oeuvre by presence-research periods
        run: python tools/presence_periods_pass.py
      - name: Preserve the whole-oeuvre argument in curator dossiers
        run: python tools/oeuvre_integrity_pass.py
      - name: Give every book and exhibition curator-grade depth
        run: python tools/record_depth_pass.py
      - name: Connect every book and exhibition record
        run: python tools/record_relationships_pass.py
      - name: Attach direct press and evidence sources to project records
        run: python tools/project_evidence_pass.py
      - name: Preserve every current Wikipedia source and moving-image record
        run: python tools/wikipedia_source_coverage_pass.py
      - name: Generate language-aware press source registry
        run: python tools/press_source_registry_pass.py
      - name: Generate canonical archive record registry
        run: python tools/archive_record_registry_pass.py
      - name: Restore verified Wikidata entity relationships
        run: python tools/wikidata_entity_alignment.py
      - name: Build complete life-work source dossier
        run: python tools/life_work_source_alignment.py
      - name: Preserve owner-shared source provenance
        run: python tools/conversation_source_registry_pass.py
      - name: Build one origin plus four documented periods
        run: python tools/period_evidence_backbone.py
      - name: Generate canonical master source database
        run: python tools/master_source_database_pass.py

      - name: Verify deterministic source generation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            conversation-source-registry.json
            wikipedia-source-registry.json
            wikidata-source-registry.json
            period-evidence-backbone.json
            master-source-database.json
          )
          sha256sum "${files[@]}" > /tmp/source-hashes-before.txt
          python tools/conversation_source_registry_pass.py
          python tools/wikipedia_source_coverage_pass.py
          python tools/period_evidence_backbone.py
          python tools/master_source_database_pass.py
          sha256sum "${files[@]}" > /tmp/source-hashes-after.txt
          diff -u /tmp/source-hashes-before.txt /tmp/source-hashes-after.txt

      - name: Place the presence thesis below the hero
        run: python tools/move_presence_into_hero.py
      - name: Preserve the complete concept, sources and stories
        run: python tools/concept_coverage_pass.py
      - name: Remediate strict copy and accessibility defects
        run: node scripts/remediate-strict-live-audit.mjs
      - name: Apply the unified archive design
        run: npm run integrate:unified-design
      - name: Reassert homepage editorial introductions
        run: python tools/editorial_voice_pass.py
      - name: Reassert the homepage thesis below the hero
        run: python tools/move_presence_into_hero.py
      - name: Ensure consent can be withdrawn as easily as it is given
        run: python tools/gdpr_consent_pass.py

      - name: Run blocking archive audit and capture diagnostics
        id: archive_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            python tools/audit_editorial_voice.py
            python tools/audit_design_system.py
            python tools/audit_presence_periods.py
            python tools/audit_oeuvre_integrity.py
            python tools/audit_record_depth.py
            python tools/audit_record_relationships.py
            python tools/audit_project_evidence.py
            python tools/audit_press_source_registry.py
            python tools/audit_archive_record_registry.py
            python tools/audit_wikidata_entity_alignment.py
            python tools/audit_life_work_source_alignment.py
            python tools/audit_conversation_source_registry.py
            python tools/audit_period_evidence_backbone.py
            python tools/audit_wikipedia_source_coverage.py
            python tools/audit_geo_gdpr_llm.py
            python tools/audit_master_source_database.py
            python tools/audit_oeuvre_claim_consistency.py
            python tools/audit_concept_coverage.py
            python tools/audit_complete_archive.py
          } 2>&1 | tee archive-audit-diagnostics.txt

      - name: Upload archive audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-audit-diagnostics
          path: archive-audit-diagnostics.txt
          if-no-files-found: error
          retention-days: 7

      - name: Comment audit diagnostics on pull request
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Complete archive audit diagnostics'
            echo '```text'
            cat archive-audit-diagnostics.txt
            echo '```'
          } > archive-audit-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file archive-audit-comment.md

      - name: Fail when archive audit failed
        if: steps.archive_audit.outcome == 'failure'
        run: exit 1

      - name: Commit audited generated files
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "BANHALMI ART build bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate verified presence-led production archive"
          git push origin HEAD:${{ github.ref_name }}
