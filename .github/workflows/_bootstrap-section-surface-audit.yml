name: One-time section surface design audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  audit-and-apply:
    if: github.head_ref == 'agent/section-surface-design-audit-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-surface-design-audit-20260802
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical section surface system
        working-directory: work
        run: node scripts/_apply-section-surface-audit.mjs
      - name: Apply new release token to every page
        working-directory: work
        run: npm run bump:release
      - name: Run complete design and content audit suite
        working-directory: work
        run: npm test
      - name: Commit audited source only
        working-directory: work
        run: |
          git rm scripts/_apply-section-surface-audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unify full-bleed section surfaces across ART"
          git push origin agent/section-surface-design-audit-20260802
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: cleanup
      - name: Remove one-time bootstrap
        working-directory: cleanup
        run: |
          git pull --rebase origin main
          git rm .github/workflows/_bootstrap-section-surface-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time section surface bootstrap [skip ci]"
          git push origin main
