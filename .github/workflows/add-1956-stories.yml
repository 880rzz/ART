name: Add 1956 portrait stories
on:
  push:
    paths:
      - "scripts/add-1956-stories.mjs"
      - "assets/data/merfoldkovek1956-stories-hu.json"
      - ".github/workflows/add-1956-stories.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/add-1956-stories.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exhibitions/merfoldkovek1956.html hu/exhibitions/merfoldkovek1956.html de-at/exhibitions/merfoldkovek1956.html
          git diff --cached --quiet || git commit -m "Add portrait stories to 1956 exhibition"
          git push
