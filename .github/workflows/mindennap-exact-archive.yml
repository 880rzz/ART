name: Read exact historical book review
on:
  push:
    branches: [audit/art-editorial-source-snapshot-20261006]
    paths: [.github/workflows/mindennap-exact-archive.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the actual archived article, not just the capture index
        run: |
          mkdir -p /tmp/exact-review
          python3 - <<'PY'
          import urllib.request,json,pathlib,re,datetime
          from html.parser import HTMLParser
          url='https://web.archive.org/web/20240917012441/https://mindennapkonyv.hu/mindennapi/olvastuk/a-noi-let-kilenc-fordulopontja-banhalmi-norbert-a-no-vilaga'
          class Reader(HTMLParser):
            def __init__(self):super().__init__(convert_charrefs=True);self.skip=0;self.text=[];self.meta={}
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=='meta':self.meta[a.get('property') or a.get('name') or '']=a.get('content','')
              if t in ('script','style','svg'):self.skip+=1
              if not self.skip and t in ('p','li','div','h1','h2','h3','br'):self.text.append('\n')
            def handle_endtag(self,t):
              if t in ('script','style','svg') and self.skip:self.skip-=1
              if not self.skip and t in ('p','li','div','h1','h2','h3'):self.text.append('\n')
            def handle_data(self,d):
              if not self.skip:self.text.append(d)
          result={'url':url,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'semanticApproval':False}
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BANHALMI-Source-Audit/1.0)'})
            with urllib.request.urlopen(req,timeout=40) as response:
              raw=response.read(5000000).decode('utf-8','replace');r=Reader();r.feed(raw)
              result.update({'status':response.status,'finalUrl':response.url,'meta':r.meta,'text':re.sub('\n{3,}','\n\n','\n'.join(re.sub('[ \t]+',' ',line).strip() for line in ''.join(r.text).splitlines()))})
          except Exception as e:result['error']=str(e)
          pathlib.Path('/tmp/exact-review/mindennap.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: exact-mindennap-review
          path: /tmp/exact-review
          if-no-files-found: error
          retention-days: 7
