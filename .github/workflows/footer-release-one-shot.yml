name: Footer release one-shot
on: push
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/footer-ecosystem-layout-20260813
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply release token
        run: npm run bump:release
      - name: Commit release propagation and remove helper
        shell: bash
        run: |
          git rm .github/workflows/footer-release-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Propagate footer design release'
          git push origin HEAD:agent/footer-ecosystem-layout-20260813
