name: One-time internal redirect pages

on:
  push:
    paths:
      - '.github/workflows/one-time-internal-redirect-pages.yml'
      - 'tools/one_time_internal_redirect_pages.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize internal redirect pages
        run: python3 tools/one_time_internal_redirect_pages.py
      - name: Remove one-time automation
        run: |
          rm -f .github/workflows/one-time-internal-redirect-pages.yml
          rm -f tools/one_time_internal_redirect_pages.py
      - name: Run complete archive audit
        run: npm test
      - name: Commit audited internal redirects
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize internal legacy redirects"
          git push
