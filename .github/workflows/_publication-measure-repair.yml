name: Isolated publication reading-measure repair
on:
  push:
    branches: [remediate/art-visible-sources-hu-en-de-20261006]
    paths: [.github/workflows/_publication-measure-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == '880rzz/ART' && github.ref == 'refs/heads/remediate/art-visible-sources-hu-en-de-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Repair the canonical component without dropping text or relaxing gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'b499add936020883bd50ff30cf5715518623139c'
          python3 - <<'PY'
          from pathlib import Path
          import json
          csspath=Path('assets/css/site.css')
          css=csspath.read_text()
          old='.linklist>li{width:100%!important;max-width:none!important;}'
          new='.linklist>li{width:100%!important;max-width:var(--art-writing-record-max,none)!important;}'
          assert css.count(old)==1
          css=css.replace(old,new+'\n  /* Publication records contain translated titles and bibliographic metadata.\n     Their text keeps the editorial measure; the surrounding list stays full width. */\n  body.apple-archive[data-archive-page="writing"] main.writing-page>section.wrap.narrow .linklist>li[data-publication-source]{--art-writing-record-max:min(68ch,860px);}')
          anchor='.linklist li:last-child{border-bottom:0;padding-bottom:0}'
          assert css.count(anchor)==1
          css=css.replace(anchor,anchor+'\n.linklist li[data-publication-source]>span{display:block;margin-top:.35rem;}')
          csspath.write_text(css)
          compiler=Path('scripts/restore-production-design-authority.mjs')
          text=compiler.read_text()
          assert text.count(old)==2
          compiler.write_text(text.replace(old,new))
          audit=Path('tools/audit-visible-publication-links.mjs')
          text=audit.read_text()
          text+='\nconst publicationCss=fs.readFileSync("assets/css/site.css","utf8");\nassert(publicationCss.includes("max-width:var(--art-writing-record-max,none)!important"),"Canonical writing records must support a bounded publication measure");\nassert(publicationCss.includes("--art-writing-record-max:min(68ch,860px)"),"Publication text must retain the editorial reading cap");\nassert(publicationCss.includes(".linklist li[data-publication-source]>span{display:block;"),"Publication metadata must occupy its own readable line");\n'
          audit.write_text(text)
          reportpath=Path('docs/visible-publications-restoration-20261006.json')
          report=json.loads(reportpath.read_text())
          report['layoutFollowup']={'cause':'Translated titles plus original Hungarian titles made publication rows long-form text, but the generic structured-record rule forced an unbounded row width.','solution':'The existing canonical writing-row max-width now reads a component custom property. Only publication rows set it to min(68ch,860px); outer list and factual record canvases remain unchanged. Metadata is a separate block.','failingBaselineWidthsPx':[1024,1280,1440,1920],'localesReproduced':['en','de-AT'],'contentRemoved':False,'regressionGateWeakened':False,'verification':'Required CI and production readback remain separate.'}
          reportpath.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git rm .github/workflows/_publication-measure-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css scripts/restore-production-design-authority.mjs tools/audit-visible-publication-links.mjs docs/visible-publications-restoration-20261006.json
          git commit -m 'Bound translated publication records within the canonical reading measure'
          npm test
          SITEMAP_VERIFY_GIT_HISTORY=1 node tests/audit-sitemap-freshness-stage33.mjs
      - name: Prepare the exact changed source as a production-like artifact
        run: |
          mkdir -p _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.3.0'
          python scripts/generate-responsive-gallery.py _site
          node scripts/optimize-pages-artifact.mjs _site
          node scripts/restore-production-design-authority.mjs _site
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium
      - name: Verify every publication at twelve widths on the rendered artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/publication-evidence
          node tools/perf-static-server.mjs _site 4173 >/tmp/publication-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const rows=[];
          for(const route of ['/writing.html','/hu/writing.html','/de-at/writing.html']){
            for(const width of [375,390,621,768,1024,1180,1280,1440,1600,1920,2560,3840]){
              await page.setViewportSize({width,height:1000});
              await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle'});
              const state=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+1,rows:[...document.querySelectorAll('[data-publication-source]')].map(li=>({key:li.dataset.publicationSource,width:li.getBoundingClientRect().width,text:li.innerText,href:li.querySelector('a')?.href,metadataDisplay:getComputedStyle(li.querySelector(':scope>span')).display,lineHeight:parseFloat(getComputedStyle(li).lineHeight),fontSize:parseFloat(getComputedStyle(li).fontSize)}))}));
              assert.equal(state.overflow,false,route+' horizontal overflow '+width);
              assert.equal(state.rows.length,6,route+' incomplete publication list');
              for(const row of state.rows){assert(row.href.startsWith('https://'),row.key+' actual link');assert(row.width<=860.5,row.key+' width '+row.width);assert(row.lineHeight/row.fontSize>=1.38,row.key+' line spacing');assert.equal(row.metadataDisplay,'block');}
              rows.push({route,viewport:width,...state});
              if(width===390||width===1440)await page.screenshot({path:'/tmp/publication-evidence/'+route.replaceAll('/','_')+'-'+width+'.png',fullPage:true});
            }
          }
          await browser.close();
          fs.writeFileSync('/tmp/publication-evidence/rendered-publications.json',JSON.stringify({sourceCommit:process.env.REPAIR_SHA,states:rows.length,publicationChecks:rows.length*6,results:rows},null,2));
          console.log('PASS: 36 route/viewport states; 216 rendered publication checks; all six source links and titles retained per locale, bounded text, separate metadata and no horizontal overflow.');
          JS
          git diff --exit-code
          git push origin HEAD:refs/heads/remediate/art-visible-sources-hu-en-de-20261006
          git rev-parse HEAD | tee /tmp/publication-evidence/source-sha.txt
          git archive HEAD | gzip -1 > /tmp/publication-evidence/source.tar.gz
      - name: Preserve inspectable source and rendered evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-reading-measure-repair
          path: /tmp/publication-evidence
          if-no-files-found: warn
          retention-days: 7
