name: Footer ecosystem one-shot
on:
  push:
    branches:
      - agent/footer-ecosystem-layout-20260813
permissions:
  contents: write
jobs:
  align-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/footer-ecosystem-layout-20260813
      - name: Append shared footer authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/footer-elegant.css')
          marker = '/* STAGE-FOOTER-ECOSYSTEM-POLISH-20260813 */'
          css = r'''

/* STAGE-FOOTER-ECOSYSTEM-POLISH-20260813 */
/* Final footer authority: the three official destinations form one compact,
   equal-width navigation row on desktop, tablet and phone. */
html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem{
  width:min(100%,760px)!important;
  max-width:760px!important;
  display:grid!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  align-items:stretch!important;
  justify-content:center!important;
  gap:0!important;
  margin:1.35rem auto 0!important;
  padding-top:1rem!important;
  border-top:1px solid rgba(175,196,217,.18)!important;
  text-align:center!important;
}
html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem a{
  min-width:0!important;
  min-height:52px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  margin:0!important;
  padding:.65rem .8rem!important;
  border:0!important;
  border-right:1px solid rgba(175,196,217,.16)!important;
  color:#AFC4D9!important;
  opacity:.92!important;
  font-size:.88rem!important;
  line-height:1.3!important;
  letter-spacing:0!important;
  text-align:center!important;
  text-wrap:balance!important;
}
html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem a:last-child{border-right:0!important}
html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem a[aria-current="page"]{color:#F5F5F7!important;opacity:1!important;font-weight:650!important}
html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem a:hover,
html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem a:focus-visible{color:#F5F5F7!important;opacity:1!important}
@media(max-width:719px){
  html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem{
    width:100%!important;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    align-items:stretch!important;
    gap:0!important;
    margin-top:1.2rem!important;
    padding-top:.8rem!important;
  }
  html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem a{
    min-height:56px!important;
    justify-content:center!important;
    padding:.55rem .38rem!important;
    border-bottom:0!important;
    border-right:1px solid rgba(175,196,217,.16)!important;
    font-size:clamp(.76rem,3.25vw,.84rem)!important;
    line-height:1.25!important;
    text-align:center!important;
    overflow-wrap:anywhere!important;
  }
  html body.apple-archive.apple-archive.apple-archive footer .banhalmi-ecosystem a:last-child{border-right:0!important}
}
'''
          text = p.read_text()
          if marker not in text:
              p.write_text(text.rstrip() + css + '\n')
          PY
      - name: Remove one-shot workflow and commit final CSS-only change
        shell: bash
        run: |
          git rm .github/workflows/footer-ecosystem-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/footer-elegant.css
          git commit -m "Polish footer ecosystem navigation"
          git push origin HEAD:agent/footer-ecosystem-layout-20260813
