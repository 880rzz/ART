name: One-shot ART optimizer idempotency v3
on:
  push:
    branches:
      - audit/final-10of10-hardening-20260814
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-10of10-hardening-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch all homepage optimizer idempotency contracts
        run: echo '     ' | base64 -d | python
      - name: Validate exact clean source and production transform
        run: |
          set -euo pipefail
          npm test
          node tools/audit-blue-palette-contrast-stage43.mjs
          rm -rf _site
          mkdir -p _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.3.0'
          python scripts/generate-responsive-gallery.py _site
          node scripts/optimize-pages-artifact.mjs _site
          for page in _site/index.html _site/hu/index.html _site/de-at/index.html; do
            grep -q 'src="/assets/img/responsive/portrait-circle-480.webp"' "$page"
            grep -q '/assets/img/responsive/portrait-circle-720.webp 720w' "$page"
            grep -q 'data-deferred-src="/assets/fragments/home-gallery-' "$page"
          done
      - name: Commit verified optimizer fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/optimize-pages-artifact.mjs
          git diff --cached --check
          git commit -m 'Make ART homepage optimizer idempotent'
          git push origin HEAD:audit/final-10of10-hardening-20260814
