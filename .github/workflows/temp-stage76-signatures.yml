name: Temporary Stage 76 exhibition signatures
on:
  push:
    paths:
      - '.github/workflows/temp-stage76-signatures.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exhibition signature system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          runtime_path = Path('assets/js/responsive-header-system.js')
          runtime = runtime_path.read_text()
          if 'body.dataset.recordSlug' not in runtime:
              needle = "  if (isExhibitionRecord) body.dataset.recordType = 'exhibition';\n  else if (isBookRecord) body.dataset.recordType = 'book';\n"
              replacement = "  if (isExhibitionRecord) {\n    body.dataset.recordType = 'exhibition';\n    body.dataset.recordSlug = (cleanPath.split('/').pop() || '').replace(/\\.html$/i, '');\n  } else if (isBookRecord) {\n    body.dataset.recordType = 'book';\n    body.dataset.recordSlug = (cleanPath.split('/').pop() || '').replace(/\\.html$/i, '');\n  }\n"
              if needle not in runtime:
                  raise SystemExit('Stage 76 runtime insertion anchor not found')
              runtime = runtime.replace(needle, replacement, 1)
              runtime_path.write_text(runtime)

          css_path = Path('assets/css/record-editorial-system.css')
          css = css_path.read_text()
          marker = '/* Stage 76 — exhibition signatures */'
          if marker not in css:
              css += r'''

/* Stage 76 — exhibition signatures
   Four landmark exhibitions now have recognisable editorial pacing without
   changing archival facts, schema or the two-blue BANHALMI palette. The
   identity comes from spacing, image rhythm and linework — not decorative
   colour drift. */
body.apple-archive[data-record-type="exhibition"][data-record-slug="euforia"]{
  --record-measure:66ch;
}
body.apple-archive[data-record-type="exhibition"][data-record-slug="euforia"] header.sub .wrap{max-width:1220px!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="euforia"] header.sub h1{max-width:15ch!important;font-size:clamp(3rem,7vw,6.25rem)!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="euforia"] header.sub::after{width:min(62vw,880px);right:-10vw;background:radial-gradient(circle,rgba(175,196,217,.24) 0%,rgba(183,156,68,.07) 30%,transparent 68%)}
body.apple-archive[data-record-type="exhibition"][data-record-slug="euforia"] .collage{columns:2!important;column-gap:clamp(22px,3vw,46px)!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="euforia"] .collage figure:nth-child(3n+1){break-inside:avoid;margin-bottom:clamp(34px,5vw,68px)!important}

body.apple-archive[data-record-type="exhibition"][data-record-slug="merfoldkovek1956"]{
  --record-measure:62ch;
  --record-line:rgba(175,196,217,.22);
}
body.apple-archive[data-record-type="exhibition"][data-record-slug="merfoldkovek1956"] header.sub h1{max-width:14ch!important;letter-spacing:-.035em!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="merfoldkovek1956"] main section>.wrap{max-width:1060px!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="merfoldkovek1956"] main section h2{padding-left:1rem;border-left:2px solid var(--record-gold)!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="merfoldkovek1956"] .collage{columns:2!important;column-gap:clamp(16px,2vw,26px)!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="merfoldkovek1956"] .collage figcaption{font-size:.82rem!important;max-width:52ch}

body.apple-archive[data-record-type="exhibition"][data-record-slug="anovilaga"]{
  --record-measure:70ch;
}
body.apple-archive[data-record-type="exhibition"][data-record-slug="anovilaga"] header.sub .wrap{max-width:1140px!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="anovilaga"] header.sub h1{max-width:16ch!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="anovilaga"] main>section{padding-block:clamp(4.75rem,9vw,8rem)!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="anovilaga"] .collage{columns:2!important;column-gap:clamp(28px,4vw,58px)!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="anovilaga"] .collage figure:nth-child(even){margin-top:clamp(22px,4vw,54px)!important}

body.apple-archive[data-record-type="exhibition"][data-record-slug="theframe"]{
  --record-line:rgba(175,196,217,.26);
}
body.apple-archive[data-record-type="exhibition"][data-record-slug="theframe"] header.sub::after{border-radius:0;aspect-ratio:1.35;right:-8vw;top:6%;background:transparent;border:1px solid rgba(183,156,68,.26);transform:rotate(-3deg)}
body.apple-archive[data-record-type="exhibition"][data-record-slug="theframe"] main section>.wrap{max-width:1120px!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="theframe"] .collage{columns:2!important;column-gap:clamp(22px,3vw,42px)!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="theframe"] .collage figure{padding:clamp(8px,1vw,14px)!important;border:1px solid var(--record-line)!important}
body.apple-archive[data-record-type="exhibition"][data-record-slug="theframe"] .collage figcaption{padding:.75rem .2rem .15rem!important}

@media(max-width:640px){
  body.apple-archive[data-record-type="exhibition"][data-record-slug="euforia"] .collage,
  body.apple-archive[data-record-type="exhibition"][data-record-slug="merfoldkovek1956"] .collage,
  body.apple-archive[data-record-type="exhibition"][data-record-slug="anovilaga"] .collage,
  body.apple-archive[data-record-type="exhibition"][data-record-slug="theframe"] .collage{columns:1!important}
  body.apple-archive[data-record-type="exhibition"][data-record-slug="anovilaga"] .collage figure:nth-child(even){margin-top:0!important}
  body.apple-archive[data-record-type="exhibition"][data-record-slug="theframe"] header.sub::after{right:-30vw;top:20%;width:78vw}
}
'''
              css_path.write_text(css)

          test_path = Path('tests/audit-record-editorial-stage75.mjs')
          test = test_path.read_text()
          if 'Stage 76 exhibition signature selectors are missing' not in test:
              anchor = "must(css.includes('@media(max-width:640px)'), 'record system has no mobile contract');\n"
              addition = "must(runtime.includes('body.dataset.recordSlug'), 'runtime does not expose the canonical record slug');\nmust(['euforia','merfoldkovek1956','anovilaga','theframe'].every((slug) => css.includes(`[data-record-slug=\\\"${slug}\\\"]`)), 'Stage 76 exhibition signature selectors are missing');\n"
              if anchor not in test:
                  raise SystemExit('Stage 76 test insertion anchor not found')
              test = test.replace(anchor, anchor + addition, 1)
              test_path.write_text(test)

          cfg_path = Path('data/design-release.json')
          cfg = json.loads(cfg_path.read_text())
          cfg['release'] = '20260810-exhibition-signatures-v76'
          cfg['note'] = 'Stage 76 exhibition signatures: EUFÓRIA, Milestones 1956, The World of Woman and The Frame gain distinct museum-editorial pacing across EN/HU/DE-AT while preserving the shared two-blue palette, content, schema and archive structure.'
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          PY

          npm run bump:release

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          cfg_path = Path('data/design-release.json')
          cfg = json.loads(cfg_path.read_text())
          h = hashlib.sha256()
          for p in sorted(Path('assets/css').glob('*.css')):
              h.update(p.read_bytes())
          for p in sorted(Path('assets/js').glob('*.js')):
              h.update(p.read_bytes())
          for p in sorted(Path('assets/video').glob('*.mp4')):
              h.update(p.read_bytes())
          cfg['assetDigest'] = h.hexdigest()[:16]
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          PY

          npm test
          rm .github/workflows/temp-stage76-signatures.yml
          git config user.name 'ART Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add landmark exhibition signatures across three languages'
          git push
