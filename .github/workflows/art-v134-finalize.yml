name: Finalize ART v134 cache synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/art-v134-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize footer import, release digest and page asset tokens
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';

          const configPath = 'data/design-release.json';
          const config = JSON.parse(await readFile(configPath, 'utf8'));
          const release = config.release;

          const footerPath = 'assets/css/footer-elegant.css';
          let footer = await readFile(footerPath, 'utf8');
          footer = footer.replace(
            /@import url\('\.\/palette-blue-final\.css\?v=[^']+'\);/,
            `@import url('./palette-blue-final.css?v=${release}');`
          );
          await writeFile(footerPath, footer, 'utf8');

          const hash = createHash('sha256');
          for (const name of (await readdir('assets/css')).filter(f => f.endsWith('.css')).sort()) {
            hash.update(await readFile(`assets/css/${name}`));
          }
          for (const name of (await readdir('assets/js')).filter(f => f.endsWith('.js')).sort()) {
            hash.update(await readFile(`assets/js/${name}`));
          }
          for (const name of (await readdir('assets/video')).filter(f => f.endsWith('.mp4')).sort()) {
            hash.update(await readFile(`assets/video/${name}`));
          }
          config.assetDigest = hash.digest('hex').slice(0, 16);
          config.note = 'Stage 134 final release: Press and record-page visual regressions are fixed, footer palette loading is synchronized, and all versioned assets share the active release token.';
          await writeFile(configPath, JSON.stringify(config, null, 2) + '\n');
          console.log(`Release ${release}; digest ${config.assetDigest}`);
          NODE
          npm run bump:release
      - name: Remove temporary workflow and commit final source state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/art-v134-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Apply final ART v134 cache synchronization'
          git push origin HEAD:main
