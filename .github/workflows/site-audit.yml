name: ART site audit

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize press archive accessibility
        run: python3 tools/press_accessibility_pass.py
      - name: Validate curatorial normalizer syntax
        run: python3 -m py_compile tools/curatorial_content_pass.py
      - name: Generate non-sales curator and press structure
        run: python3 tools/curatorial_content_pass.py
      - name: Verify normalizers changed only declared pages
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only -- . \
            ':(exclude)curators.html' \
            ':(exclude)hu/curators.html' \
            ':(exclude)de-at/curators.html' \
            ':(exclude)press.html' \
            ':(exclude)hu/press.html' \
            ':(exclude)de-at/press.html' \
            ':(exclude)hu/index.html')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files modified by audit normalizers:"
            echo "$unexpected"
            exit 1
          fi
      - name: Audit site structure
        id: site_structure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tests/audit-site.mjs 2>&1 | tee site-structure-audit.log
      - name: Upload site structure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-site-structure-audit
          path: site-structure-audit.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when site structure audit failed
        if: steps.site_structure.outcome == 'failure'
        run: exit 1
      - name: Audit ecosystem alignment
        run: node tests/audit-ecosystem-alignment.mjs
      - name: Audit SEO network
        run: node tests/audit-seo-network.mjs
      - name: Audit family origins
        run: node tests/audit-family-origins.mjs
      - name: Audit About narrative
        run: node tests/audit-about-narrative.mjs
      - name: Audit homepage intro
        run: node tests/audit-home-intro.mjs
      - name: Audit career chronology
        run: node tests/audit-career-chronology.mjs
      - name: Audit section intros
        run: node tests/audit-section-intros.mjs
      - name: Audit project summaries
        run: node tests/audit-project-summaries.mjs
      - name: Audit homepage metadata
        run: node tests/audit-home-meta.mjs
      - name: Audit contact and footer
        run: node tests/audit-contact-footer.mjs
      - name: Audit domain ecosystem
        run: node tests/audit-domain-ecosystem.mjs
      - name: Audit Hungarian secondary pages
        run: node tests/audit-secondary-pages.mjs
      - name: Generate human voice copy report
        run: npm run test:copy > human-voice-audit.json
      - name: Upload human voice copy report
        uses: actions/upload-artifact@v4
        with:
          name: art-human-voice-audit
          path: human-voice-audit.json
          if-no-files-found: error
      - name: Inventory remaining editorial work
        run: npm run test:coverage
      - name: Upload editorial coverage report
        uses: actions/upload-artifact@v4
        with:
          name: art-content-coverage
          path: content-coverage-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit verified coverage report
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git add content-coverage-report.json
          if git diff --cached --quiet; then
            echo 'Coverage report already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified content coverage report'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Verify audits did not modify unrelated tracked files
        shell: bash
        run: |
          git diff --exit-code -- . \
            ':(exclude)curators.html' \
            ':(exclude)hu/curators.html' \
            ':(exclude)de-at/curators.html' \
            ':(exclude)press.html' \
            ':(exclude)hu/press.html' \
            ':(exclude)de-at/press.html' \
            ':(exclude)hu/index.html'
      - name: Check live endpoints and external links
        run: npm run test:live
      - name: Upload external link report
        if: always() && hashFiles('link-audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: art-external-link-audit
          path: link-audit-results.json
          if-no-files-found: ignore
