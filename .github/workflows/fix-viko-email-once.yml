name: Fix Viko email once

on:
  push:
    paths:
      - '.github/workflows/fix-viko-email-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Viko Speier email references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'hello@norbertbanhalmi.com'
          new = 'office@banhalmi.at'
          markers = (
              'Viko', 'Speier Vik', 'Viktória Speier',
              'Budapest studio and AmCham Austria liaison',
              'Vienna project contact', 'AmCham Austria liaison',
              'Budapest Studio', 'Budapest stúdió', 'Budapester Studio'
          )
          exts = {'.html', '.htm', '.json', '.jsonld', '.txt', '.md', '.mjs', '.js', '.xml'}
          changed = []
          replacements = 0

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old not in text:
                  continue

              out = []
              pos = 0
              local_count = 0
              while True:
                  idx = text.find(old, pos)
                  if idx < 0:
                      out.append(text[pos:])
                      break
                  out.append(text[pos:idx])
                  context = text[max(0, idx-700):min(len(text), idx+700)]
                  if any(marker in context for marker in markers):
                      out.append(new)
                      local_count += 1
                  else:
                      out.append(old)
                  pos = idx + len(old)

              if local_count:
                  path.write_text(''.join(out), encoding='utf-8')
                  changed.append(str(path))
                  replacements += local_count

          if not changed:
              raise SystemExit('No Viko email references were changed')

          print(f'Updated {replacements} Viko email references in {len(changed)} files:')
          for p in changed:
              print(f' - {p}')

          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              start = 0
              while True:
                  idx = text.find(old, start)
                  if idx < 0:
                      break
                  context = text[max(0, idx-700):min(len(text), idx+700)]
                  if any(marker in context for marker in markers):
                      failures.append(f'{path}: old Viko-context email remains')
                  start = idx + len(old)
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Viko Speier email address'
          git push
