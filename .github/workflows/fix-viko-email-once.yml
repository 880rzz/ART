name: Fix Viko email once

on:
  push:
    paths:
      - '.github/workflows/fix-viko-email-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Viko Speier email references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          old = 'hello@norbertbanhalmi.com'
          new = 'office@banhalmi.at'
          changed = []

          # 1) Replace explicit Viko contactPoint e-mail values without touching Norbert/general contacts.
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.html','.htm','.json','.jsonld','.txt','.md','.js','.mjs'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              text = re.sub(
                  r'((?:"name"\s*:\s*"Viko Speier"|"@id"\s*:\s*"[^"]*viko-speier[^"]*")[\s\S]{0,5000}?"email"\s*:\s*"(?:mailto:)?)(?:hello@norbertbanhalmi\.com)',
                  lambda m: m.group(1) + (('mailto:' if m.group(1).endswith('mailto:') else '') if False else '') + new,
                  text,
                  count=20
              )
              # Strong local contact-type patterns used by BANHALMI mirrored schema.
              text = re.sub(r'("contactType"\s*:\s*"[^"]*(?:AmCham|Budapest Studio|Budapest studio|Budapest stúdió|Budapester Studio)[^"]*"\s*,\s*"email"\s*:\s*")hello@norbertbanhalmi\.com', r'\1'+new, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # 2) Ensure the canonical ART oeuvre graph carries Viko's actual e-mail.
          graph = Path('oeuvre-knowledge-graph.hu.jsonld')
          if graph.exists():
              text = graph.read_text(encoding='utf-8')
              original = text
              anchor = '"alternateName": ["Speier Viktória", "Speier Vikó"],'
              if anchor in text and '"email": "mailto:office@banhalmi.at"' not in text:
                  text = text.replace(anchor, anchor + '\n      "email": "mailto:office@banhalmi.at",', 1)
              if text != original:
                  graph.write_text(text, encoding='utf-8')
                  if str(graph) not in changed:
                      changed.append(str(graph))

          # 3) Ensure the authority bridge exposes the correct AmCham company-contact e-mail.
          bridge = Path('authority-bridge.json')
          if bridge.exists():
              text = bridge.read_text(encoding='utf-8')
              original = text
              anchor = '"companyContact": "Viko Speier",'
              if anchor in text and '"companyContactEmail": "office@banhalmi.at"' not in text:
                  text = text.replace(anchor, anchor + '\n      "companyContactEmail": "office@banhalmi.at",', 1)
              if text != original:
                  bridge.write_text(text, encoding='utf-8')
                  if str(bridge) not in changed:
                      changed.append(str(bridge))

          if not changed:
              raise SystemExit('No ART Viko e-mail changes were required')

          print('Changed:')
          for p in changed:
              print(' -', p)

          # Validation: canonical ART Viko records must expose the corrected address.
          assert 'office@banhalmi.at' in Path('authority-bridge.json').read_text(encoding='utf-8')
          assert 'office@banhalmi.at' in Path('oeuvre-knowledge-graph.hu.jsonld').read_text(encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Viko Speier email address'
          git push
