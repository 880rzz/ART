name: Apply PageSpeed release v61

on:
  push:
    branches:
      - fix/pagespeed-lazy-hero-video-20260808
    paths:
      - .github/workflows/apply-pagespeed-release-v61.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply PageSpeed release v61'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump release token and propagate cache key
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          p=Path('data/design-release.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['release']='20260808-pagespeed-v61'
          data['assetDigest']='f9b76d99f09e6a7a'
          data['note']='Stage 61 PageSpeed release marker. Decorative hero video fetching is removed from the startup path: preload remains none until the first real hover or focus interaction. Accessibility behavior and archive masters remain unchanged; the generated cache-key update is propagated across the published HTML set.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          npm run bump:release
          git diff --check
      - name: Commit release propagation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BANHALMI Release Bot'
          git config user.email '107166660+880rzz@users.noreply.github.com'
          git add data/design-release.json '*.html' hu de-at assets data tests scripts tools || true
          git reset .github/workflows/apply-pagespeed-release-v61.yml || true
          git commit -m 'Propagate PageSpeed release v61'
          git push origin HEAD:fix/pagespeed-lazy-hero-video-20260808
