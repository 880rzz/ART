name: Apply ART design ecosystem v67
on:
  push:
    branches: [fix/design-ecosystem-v67-20260809]
    paths:
      - scripts/apply-design-ecosystem-v67-20260809.mjs
      - .github/workflows/apply-design-ecosystem-v67-20260809.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design-ecosystem-v67-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply archive-wide migration
        run: node scripts/apply-design-ecosystem-v67-20260809.mjs
      - name: Commit migrated source and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No migration changes"; exit 1; fi
          git commit -m "fix: unify ART subpage surfaces and ecosystem semantics"
          git push origin HEAD:fix/design-ecosystem-v67-20260809
