name: Steward canonical identity migration

on:
  push:
    branches:
      - steward/canonical-legal-brand-fix-20260910

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[identity-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: steward/canonical-legal-brand-fix-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical identity migration
        run: node tools/migrate-canonical-legal-brand.mjs
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit migration output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration diff to commit."
            exit 0
          fi
          git config user.name "BANHALMI Steward"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply canonical legal and brand identity [identity-migrated]"
          git push origin HEAD:steward/canonical-legal-brand-fix-20260910
