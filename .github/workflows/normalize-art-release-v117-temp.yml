name: Temporary normalize ART v117 release tokens

on:
  push:
    branches:
      - fix/art-menu-anchor-integrity-20260811

permissions:
  contents: write

jobs:
  normalize-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/art-menu-anchor-integrity-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize every nested asset release token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tokens = {
              '20260811-rendered-contrast-v114',
              '20260811-menu-anchor-v115',
              '20260811-menu-anchor-v116',
          }
          replacement = '20260811-menu-anchor-v117'
          changed=[]
          for root in (Path('assets/css'), Path('assets/js')):
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.css','.js'}:
                      continue
                  s=p.read_text()
                  n=s
                  for token in tokens:
                      n=n.replace(token,replacement)
                  if n!=s:
                      p.write_text(n)
                      changed.append(str(p))
          print('Normalized nested release tokens in:', ', '.join(changed) if changed else 'none')
          PY
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const hash = createHash('sha256');
          for (const name of (await readdir('assets/css')).filter(f => f.endsWith('.css')).sort()) hash.update(await readFile(`assets/css/${name}`));
          for (const name of (await readdir('assets/js')).filter(f => f.endsWith('.js')).sort()) hash.update(await readFile(`assets/js/${name}`));
          for (const name of (await readdir('assets/video')).filter(f => f.endsWith('.mp4')).sort()) hash.update(await readFile(`assets/video/${name}`));
          const digest = hash.digest('hex').slice(0, 16);
          const path = 'data/design-release.json';
          const data = JSON.parse(await readFile(path, 'utf8'));
          data.release = '20260811-menu-anchor-v117';
          data.note = 'Stage 117 removes the exhibition catalogue dropdown in every viewport, validates all internal fragment destinations across EN/HU/DE, and normalizes every nested CSS/JS asset reference to the active cache token.';
          data.assetDigest = digest;
          data.updated = '2026-08-11';
          await writeFile(path, JSON.stringify(data, null, 2) + '\n');
          console.log(`Computed ART asset digest ${digest}`);
          NODE
      - name: Apply v117 across every HTML asset reference
        run: npm run bump:release
      - name: Verify no retired release token remains in runtime assets
        run: |
          ! grep -R -n -E '20260811-(rendered-contrast-v114|menu-anchor-v115|menu-anchor-v116)' assets/css assets/js
      - name: Commit normalized v117 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css assets/js data/design-release.json '*.html' 'hu/**/*.html' 'de-at/**/*.html' '**/*.html'
          git commit -m 'Normalize ART menu anchor v117 release' || exit 0
          git push origin HEAD:fix/art-menu-anchor-integrity-20260811
