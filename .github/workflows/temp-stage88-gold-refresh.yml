name: Temporary Stage 88 gold refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace every canonical gold occurrence and prepare release
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import path from 'node:path';

          const oldGolds = ['#B79C44','#b79c44','#D3B85A','#d3b85a'];
          const newGold = '#DCC56B';
          const files = execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          let changed = 0;
          for (const file of files) {
            let source;
            try { source = await readFile(file,'utf8'); } catch { continue; }
            if (source.includes('\u0000')) continue;
            let updated = source;
            for (const oldGold of oldGolds) updated = updated.split(oldGold).join(newGold);
            if (updated !== source) {
              await writeFile(file,updated,'utf8');
              changed++;
            }
          }
          console.log(`Updated canonical gold in ${changed} tracked text files to ${newGold}.`);

          const configPath='data/design-release.json';
          const config=JSON.parse(await readFile(configPath,'utf8'));
          const oldRelease=config.release;
          const release='20260810-elegant-gold-v88';
          config.release=release;
          config.note='Stage 88 brightens the ART gold accent globally to #DCC56B while preserving the dark blue museum palette, WCAG contrast and final runtime design authority.';
          await writeFile(configPath,JSON.stringify(config,null,2)+'\n','utf8');

          for (const dir of ['assets/css','assets/js']) {
            for (const name of await readdir(dir)) {
              if (!/\.(css|js)$/.test(name)) continue;
              const file = path.join(dir,name);
              const source = await readFile(file,'utf8');
              const updated = source.split(oldRelease).join(release);
              if (updated !== source) await writeFile(file,updated,'utf8');
            }
          }

          const hash=createHash('sha256');
          for (const name of (await readdir('assets/css')).filter(f=>f.endsWith('.css')).sort()) hash.update(await readFile(path.join('assets/css',name)));
          for (const name of (await readdir('assets/js')).filter(f=>f.endsWith('.js')).sort()) hash.update(await readFile(path.join('assets/js',name)));
          for (const name of (await readdir('assets/video')).filter(f=>f.endsWith('.mp4')).sort()) hash.update(await readFile(path.join('assets/video',name)));
          config.assetDigest=hash.digest('hex').slice(0,16);
          await writeFile(configPath,JSON.stringify(config,null,2)+'\n','utf8');
          console.log(`Prepared ${release} with digest ${config.assetDigest}`);
          NODE
      - run: npm run bump:release
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-stage88-gold-refresh.yml
      - name: Create local release commit before fail-closed audit
        run: |
          git config user.name "BANHALMI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: brighten ART gold accent globally"
      - run: npm test
      - name: Push verified release
        run: git push
