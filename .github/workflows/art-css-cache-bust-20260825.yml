name: ART CSS cache-bust migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/art-css-cache-bust-20260825.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh ART stylesheet cache key
        run: node tools/bust-art-css-cache-20260825.mjs
      - name: Validate CSS authority
        run: |
          node tools/audit-clean-architecture.mjs
          node tools/audit-apple-responsive-contract.mjs
      - name: Commit cache-key refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes to commit"
            exit 1
          fi
          git commit -m "Refresh ART stylesheet cache key"
          git push origin HEAD:main
