name: Fix ART press description contrast
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-press-desc-contrast-20260825.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Append final press contrast authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/site.css')
          s=p.read_text()
          marker='/* ART-PRESS-DESC-CONTRAST-FINAL-20260825 */'
          if marker not in s:
              s += '\n'+marker+'\nhtml body.apple-archive.apple-archive.apple-archive.apple-archive.apple-archive.press-page main#main-content.press-redesign .press-record p.desc{color:#FFFFFF!important;opacity:1!important;}\n'
              p.write_text(s)
          PY
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          if git diff --cached --quiet; then
            echo 'No CSS changes.'
          else
            git commit -m 'Fix ART press description contrast authority'
            git push origin HEAD:main
          fi
