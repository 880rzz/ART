name: One-shot finalize ART clean source

on:
  push:
    branches: [audit/final-10of10-hardening-20260814]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-10of10-hardening-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply clean presentation contract
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          css='/assets/css/site.css?v=20260814-clean-v1'
          runtime='/assets/js/responsive-header-system.js?v=src-clean-20260814'
          count=0
          for p in root.rglob('*.html'):
              s=p.read_text(encoding='utf-8',errors='ignore')
              if '<html' not in s.lower() or re.search(r'http-equiv=["\']refresh["\']',s,re.I): continue
              s=re.sub(r'<style\b[^>]*>[\s\S]*?</style>\s*','',s,flags=re.I)
              s=re.sub(r'\sstyle=(["\'])(.*?)\1','',s,flags=re.I|re.S)
              s=re.sub(r'<link\b(?=[^>]*\brel=["\']stylesheet["\'])(?=[^>]*\bhref=["\']/assets/css/[^"\']+)[^>]*>\s*','',s,flags=re.I)
              s=s.replace('</head>',f'<link rel="stylesheet" href="{css}"/>\n</head>',1)
              s=re.sub(r'<script\b[^>]*\bsrc=["\']/assets/js/responsive-header-system\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
              s=s.replace('</body>',f'<script defer src="{runtime}"></script>\n</body>',1)
              p.write_text(s,encoding='utf-8'); count+=1
          if count != 87: raise SystemExit(f'expected 87 content pages, normalized {count}')

          rp=Path('assets/js/responsive-header-system.js'); s=rp.read_text(encoding='utf-8')
          start=s.find('  /* v90 final visual authority.'); end=s.find('  const language =',start)
          if start<0 or end<0: raise SystemExit('runtime legacy presentation prelude not found')
          s=s[:start]+'  /* CLEAN-AUTHORITY: all presentation is in /assets/css/site.css. */\n'+s[end:]
          rs=s.find('  if ((isExhibitionRecord || isBookRecord) && !document.querySelector'); re_=s.find('  let page =',rs)
          if rs>=0 and re_>rs: s=s[:rs]+s[re_:]
          rp.write_text(s,encoding='utf-8')

          op=Path('scripts/optimize-pages-artifact.mjs'); s=op.read_text(encoding='utf-8')
          s=s.replace('if (links.length > 1)','if (links.length >= 1)'); op.write_text(s,encoding='utf-8')

          keep=Path('assets/css/site.css').resolve()
          for p in Path('assets/css').glob('*.css'):
              if p.resolve()!=keep: p.unlink()
      - name: Install strict clean audit
        shell: bash
        run: |
          cat > tools/audit-clean-architecture.mjs <<'EOF'
          import fs from 'node:fs';import path from 'node:path';
          const root=process.cwd(),errors=[];const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()&&!['node_modules','.git'].includes(e.name)?walk(path.join(d,e.name)):e.isFile()?[path.join(d,e.name)]:[]);const files=walk(root),rel=p=>path.relative(root,p).replaceAll('\\','/'),read=p=>fs.readFileSync(path.join(root,p),'utf8'),exists=p=>fs.existsSync(path.join(root,p));
          const css=files.filter(f=>f.endsWith('.css')).map(rel);if(css.length!==1||css[0]!=='assets/css/site.css')errors.push(`CSS authority drift: ${css.join(', ')}`);
          const html=files.filter(f=>f.endsWith('.html')&&/<html\b/i.test(fs.readFileSync(f,'utf8')));let content=0;
          for(const f of html){const h=fs.readFileSync(f,'utf8');if(/http-equiv=["']refresh["']/i.test(h))continue;content++;const styles=[...h.matchAll(/<link\b(?=[^>]*rel=["']stylesheet["'])[^>]*href=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1].split('?')[0]);if(styles.length!==1||styles[0]!=='/assets/css/site.css')errors.push(`${rel(f)}: expected one site.css`);const runtimes=(h.match(/<script\b[^>]*src=["']\/assets\/js\/responsive-header-system\.js(?:\?[^"']*)?["'][^>]*>\s*<\/script>/gi)||[]).length;if(runtimes!==1)errors.push(`${rel(f)}: responsive runtime count ${runtimes}`);if(/<style\b/i.test(h)||/\sstyle=["']/i.test(h))errors.push(`${rel(f)}: inline presentation forbidden`);}
          if(content!==87)errors.push(`expected 87 content pages, found ${content}`);const runtime=read('assets/js/responsive-header-system.js');if(/createElement\(["']link["']\)/i.test(runtime)||/data-art-(?:chronology|content-flow|record-editorial)/i.test(runtime))errors.push('runtime stylesheet injection returned');if(!read('scripts/optimize-pages-artifact.mjs').includes('if (links.length >= 1)'))errors.push('single CSS production bundling missing');
          for(const p of ['llms.txt','ai.txt','robots.txt','sitemap.xml','_redirects','.well-known/agent.json','api/v1/identity.json','api/v1/actions.json','api/v1/archive.json','archive-record-registry.json','archive-source-map.json','ecosystem-bridge.json','ecosystem-bridge.jsonld'])if(!exists(p))errors.push(`${p}: missing`);
          const identity=JSON.parse(read('api/v1/identity.json'));if(identity.entityType!=='ArtArchive'||identity.canonicalUrl!=='https://www.banhalmi.art/'||identity?.about?.wikidata!=='https://www.wikidata.org/wiki/Q56391118'||identity.commercialAuthority!=='https://www.norbertbanhalmi.com/')errors.push('Wikidata-first archive identity drift');const agent=JSON.parse(read('.well-known/agent.json'));if(agent.canonical!=='https://www.banhalmi.art/'||agent.commercialAuthority!=='https://www.norbertbanhalmi.com/'||agent?.read?.identity!=='/api/v1/identity.json'||agent?.read?.archive!=='/api/v1/archive.json'||agent.actions!=='/api/v1/actions.json')errors.push('agent discovery drift');const actions=JSON.parse(read('api/v1/actions.json'));if(actions.writeApiAvailable!==false||actions?.actions?.find?.(a=>a.id==='professional-enquiry')?.url!=='https://www.norbertbanhalmi.com/contact/')errors.push('professional handoff drift');
          for(const p of ['llms.txt','ai.txt']){const t=read(p);for(const token of ['Q56391118','https://www.norbertbanhalmi.com/','https://www.banhalmi.art/','https://blog.banhalmi.art/','New York is not a studio, office, headquarters or operational base'])if(!t.includes(token))errors.push(`${p}: missing ${token}`);}const redirects=read('_redirects');for(const token of ['/post/*  https://blog.banhalmi.art/post/:splat  301','/blog/post/*  https://blog.banhalmi.art/post/:splat  301','/blog/categories/*  https://blog.banhalmi.art/blog/categories/:splat  301','/blog/tags/*  https://blog.banhalmi.art/blog/tags/:splat  301','/blog/page/*  https://blog.banhalmi.art/blog/page/:splat  301','/fotokiallitasok/ebredes  /hu/exhibitions/ebredes.html  301','/ajanlatkeres  https://www.norbertbanhalmi.com/hu/ajanlatkeres/  301','/kapcsolat  https://www.norbertbanhalmi.com/hu/kapcsolat/  301','/norbert-banhalmi  https://www.norbertbanhalmi.com/about/  301','/*  /404.html  404'])if(!redirects.includes(token))errors.push(`legacy redirect missing: ${token}`);if(errors.length){console.error(errors.join('\n'));process.exit(1)}console.log(`ART clean audit passed: ${content} content pages, one CSS authority, one runtime, Wikidata-first identity, LLM/agent and legacy redirects preserved.`);
          EOF
      - name: Verify and commit source only
        run: |
          set -euo pipefail
          npm test
          node --check assets/js/responsive-header-system.js
          node --check scripts/optimize-pages-artifact.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'hu/**/*.html' 'de-at/**/*.html' 'books/*.html' 'exhibitions/*.html' assets/css assets/js/responsive-header-system.js scripts/optimize-pages-artifact.mjs tools/audit-clean-architecture.mjs
          git add -u assets/css
          git diff --cached --check
          git commit -m 'Finalize ART clean presentation source'
          git push origin HEAD:audit/final-10of10-hardening-20260814
