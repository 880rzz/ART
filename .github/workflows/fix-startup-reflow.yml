name: Fix ART homepage startup reflow

on:
  push:
    branches:
      - fix/pagespeed-startup-reflow-20260808
    paths:
      - .github/workflows/fix-startup-reflow.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply ART startup reflow fix without temporary audit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove eager layout reads from homepage startup
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          pages = [Path('index.html'), Path('hu/index.html'), Path('de-at/index.html')]
          parallax_old = ");upd();}})();var menu="
          parallax_new = ");}})();var menu="
          lightbox_old = "});}collect();window.__lbCollect=collect;"
          lightbox_new = "});}window.__lbCollect=collect;"

          for page in pages:
              text = page.read_text(encoding='utf-8')
              if text.count(parallax_old) != 1:
                  raise SystemExit(f'{page}: expected exactly one eager parallax update, found {text.count(parallax_old)}')
              if text.count(lightbox_old) != 1:
                  raise SystemExit(f'{page}: expected exactly one eager lightbox collect, found {text.count(lightbox_old)}')
              text = text.replace(parallax_old, parallax_new)
              text = text.replace(lightbox_old, lightbox_new)
              page.write_text(text, encoding='utf-8')

          print('Removed startup scrollY/layout read and eager lightbox offsetParent scan from all homepages.')
          PY

          for page in index.html hu/index.html de-at/index.html; do
            ! grep -Fq ');upd();}})();var menu=' "$page"
            ! grep -Fq '});}collect();window.__lbCollect=collect;' "$page"
            grep -Fq '});}})();var menu=' "$page"
            grep -Fq '});}window.__lbCollect=collect;' "$page"
          done
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BANHALMI PageSpeed Bot'
          git config user.email '107166660+880rzz@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html
          git commit -m 'Defer ART homepage layout reads until interaction'
          git push origin HEAD:fix/pagespeed-startup-reflow-20260808
