name: One-time humanize English and German copy

on:
  push:
    paths:
      - '.github/workflows/one-time-humanize-en-de-copy.yml'

permissions:
  contents: write

jobs:
  humanize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Humanize visible English and German copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          changed = {}

          def replace_visible_html(html, transform):
              parts = re.split(r'(<(?:script|style)\b[\s\S]*?</(?:script|style)>)', html, flags=re.I)
              for i in range(0, len(parts), 2):
                  parts[i] = transform(parts[i])
              return ''.join(parts)

          def humanize_en(text):
              original = text
              # Repeated exhibition template: replace the entire paragraph, not just keywords.
              text = re.sub(
                  r'<p([^>]*)>\s*This exhibition is presented as one chapter in the investigation of presence\.[\s\S]*?records that document its public life\.\s*</p>',
                  r'<p\1>This exhibition belongs here because of the question behind it, the photographs it brought together and the traces it left in public.</p>',
                  text,
                  flags=re.I,
              )
              # Repeated book template.
              text = re.sub(
                  r'<p([^>]*)>\s*This book is presented as a document within the wider investigation of presence\.[\s\S]*?related public records belong together\.\s*</p>',
                  r'<p\1>This book grew from the same questions as the photographs around it. The publication, the project and its public history are shown together here.</p>',
                  text,
                  flags=re.I,
              )
              replacements = {
                  'The official archive of Norbert Bánhalmi’s oeuvre since 1999, organised around the investigation of presence through photography, books, exhibitions, moving image and public reception.':
                  'The official archive of Norbert Bánhalmi’s work since 1999: photographs, books, exhibitions, films and the stories that grew around them.',
                  "The official archive of Norbert Bánhalmi's oeuvre since 1999, organised around the investigation of presence through photography, books, exhibitions, moving image and public reception.":
                  "The official archive of Norbert Bánhalmi's work since 1999: photographs, books, exhibitions, films and the stories that grew around them.",
                  'Presence-research period': 'Chapter of the work',
                  'How this chapter belongs to the oeuvre': 'How it connects to the wider work',
                  'Curatorial record': 'Why it belongs here',
                  'public reception': 'public life',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              return text, text != original

          def humanize_de(text):
              original = text
              # German exhibition template: identify the institutional paragraph by its core vocabulary.
              text = re.sub(
                  r'<p([^>]*)>(?=[\s\S]{0,650}</p>)(?=[\s\S]{0,650}(?:Ausstellung|Ausstellungsprojekt))(?=[\s\S]{0,650}Erforschung der Präsenz)[\s\S]*?</p>',
                  r'<p\1>Diese Ausstellung gehört hierher, weil sie eine eigene Frage stellt, bestimmte Arbeiten zusammenführt und Spuren im öffentlichen Leben hinterlassen hat.</p>',
                  text,
                  flags=re.I,
              )
              # German book template.
              text = re.sub(
                  r'<p([^>]*)>(?=[\s\S]{0,650}</p>)(?=[\s\S]{0,650}(?:Dieses Buch|Das Buch))(?=[\s\S]{0,650}(?:bibliograf|Erforschung der Präsenz))[\s\S]*?</p>',
                  r'<p\1>Dieses Buch entstand aus denselben Fragen wie die Fotografien. Publikation, Projekt und öffentliche Geschichte werden hier gemeinsam gezeigt.</p>',
                  text,
                  flags=re.I,
              )
              replacements = {
                  'Das offizielle Archiv des Werks von Norbert Bánhalmi seit 1999, geordnet als Erforschung der Präsenz in Fotografie, Büchern, Ausstellungen, Bewegtbild und öffentlicher Rezeption.':
                  'Das offizielle Archiv von Norbert Bánhalmis Arbeit seit 1999: Fotografien, Bücher, Ausstellungen, Filme und die Geschichten, die daraus entstanden sind.',
                  'Präsenzforschungsperiode': 'Werkphase',
                  'Wie dieses Kapitel zum Gesamtwerk gehört': 'Wie es mit dem übrigen Werk verbunden ist',
                  'Kuratorischer Eintrag': 'Warum dieses Projekt hierhergehört',
                  'öffentliche Rezeption': 'öffentliche Wirkung',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              return text, text != original

          en_files = []
          for p in root.rglob('*.html'):
              rel = p.as_posix()
              if rel.startswith(('de-at/', 'hu/', '.git/', 'node_modules/')):
                  continue
              en_files.append(p)
          de_files = list((root / 'de-at').rglob('*.html'))

          for lang, files, fn in [('en', en_files, humanize_en), ('de', de_files, humanize_de)]:
              for p in files:
                  html = p.read_text(encoding='utf-8')
                  did_change = False
                  def transform(chunk):
                      nonlocal_holder = [False]
                      new, changed_here = fn(chunk)
                      if changed_here:
                          nonlocal_holder[0] = True
                      transform.changed = getattr(transform, 'changed', False) or changed_here
                      return new
                  transform.changed = False
                  new_html = replace_visible_html(html, transform)
                  if transform.changed and new_html != html:
                      p.write_text(new_html, encoding='utf-8')
                      changed[p.as_posix()] = lang

          if not changed:
              raise SystemExit('No English or German visible copy was changed.')

          audit = root / 'tests' / 'audit-human-voice-en-de.mjs'
          audit.write_text(r'''import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';

          const root = process.cwd();
          const failures = [];
          const banned = [
            'This exhibition is presented as one chapter in the investigation of presence.',
            'This book is presented as a document within the wider investigation of presence.',
            'organised around the investigation of presence through photography',
            'geordnet als Erforschung der Präsenz in Fotografie',
            'Presence-research period',
            'Präsenzforschungsperiode'
          ];
          const required = [
            ['index.html', "The official archive of Norbert Bánhalmi’s work since 1999"],
            ['de-at/index.html', 'Das offizielle Archiv von Norbert Bánhalmis Arbeit seit 1999']
          ];

          function visibleText(html) {
            return html
              .replace(/<script\b[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ');
          }

          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['.git', 'node_modules', 'hu'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.html')) files.push(full);
            }
          }
          walk(root);

          for (const file of files) {
            const rel = path.relative(root, file).replaceAll('\\', '/');
            if (!(rel.startsWith('de-at/') || !rel.includes('/'))) {
              // English pages also live in root subdirectories.
            }
            const text = visibleText(fs.readFileSync(file, 'utf8'));
            for (const phrase of banned) if (text.includes(phrase)) failures.push(`${rel}: banned institutional phrase remains: ${phrase}`);
          }
          for (const [rel, phrase] of required) {
            const html = fs.readFileSync(path.join(root, rel), 'utf8');
            if (!html.includes(phrase)) failures.push(`${rel}: natural homepage description missing`);
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`English/German human-voice audit passed across ${files.length} HTML files.`);
          ''', encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          cmd = 'node tests/audit-human-voice-en-de.mjs'
          if cmd not in package['scripts']['test']:
              package['scripts']['test'] += ' && ' + cmd
          package['scripts']['test:human-voice-en-de'] = cmd
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          report = root / 'docs' / 'HUMAN_VOICE_REWRITE_EN_DE.md'
          report.write_text('# English and German human-voice rewrite\n\nChanged visible copy in **%d files**. Schema and technical identifiers were left untouched.\n\n%s\n' % (
              len(changed), '\n'.join(f'- `{p}` ({lang})' for p, lang in sorted(changed.items()))
          ), encoding='utf-8')
          print(f'Changed {len(changed)} files.')
          PY
      - name: Remove temporary workflow and raw audit report
        run: |
          rm -f .github/workflows/one-time-humanize-en-de-copy.yml
          rm -f docs/HUMAN_VOICE_AUDIT_EN_DE.md
      - name: Install dependencies
        run: npm install
      - name: Run human voice audit
        run: npm run test:human-voice-en-de
      - name: Run complete repository test suite
        run: npm test
      - name: Commit and publish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Humanize English and German archive copy"
          git push
