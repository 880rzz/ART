name: One-time stage41 life journey default closed
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-life-journey-default-closed-stage41.mjs'
      - '.github/workflows/one-time-stage41-life-journey-default-closed.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Close life journey groups by default
        run: node tools/migrate-life-journey-default-closed-stage41.mjs
      - name: Propagate release cache key
        run: npm run bump:release
      - name: Guard closed default state
        run: |
          ! grep -R -E '<details[^>]*life-record-group[^>]* open' index.html hu/index.html de-at/index.html
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(journey): keep homepage archive groups closed by default'
          git push
