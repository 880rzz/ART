name: One-shot restore verified ART gallery fragments
on:
  push:
    branches:
      - audit/final-10of10-hardening-20260814
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-10of10-hardening-20260814
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild fragments from preserved pre-clean gallery source
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          source_commit='5002143b87063aff0c591dc147e9c2a66cbf894c'
          specs=[
            ('index.html','en','a79d1ab141e489f6ba9e467a3aa5d4fc374137003cbb20241dcc690d37078ce3'),
            ('hu/index.html','hu','98722fc7e26777b915d526276f5c744bb79f4affdf1b6c920d1a140501978cd3'),
            ('de-at/index.html','de-at','eaf70042a2adc0ca6ccf21bccdc480613d55cc0ba50a5f9a8f567458003e17b6'),
          ]
          outdir=Path('assets/fragments')
          outdir.mkdir(parents=True,exist_ok=True)
          gallery_re=re.compile(r'(<div id="galwrap"[^>]*>)(<div class="collage gal-batch" data-batch="0"[\s\S]*?</div>)([\s\S]*?)(</div>\s*<div class="gal-actions">\s*<button type="button" class="btn gal-more-btn" id="galmore")')
          for source_path,lang,expected in specs:
              html=subprocess.check_output(['git','show',f'{source_commit}:{source_path}']).decode('utf-8')
              m=gallery_re.search(html)
              if not m:
                  raise SystemExit(f'{source_path}: gallery block not found')
              hidden=m.group(3)
              count=len(re.findall(r'<img\b',hidden,re.I))
              if count < 80:
                  raise SystemExit(f'{source_path}: only {count} deferred images found')
              data=hidden.encode('utf-8')
              actual=hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{source_path}: fragment SHA mismatch {actual} != {expected}')
              target=outdir/f'home-gallery-{lang}.html'
              target.write_bytes(data)
              print(f'{target}: {count} images, sha256={actual}')
      - name: Verify exact approved fragment hashes
        run: |
          echo 'a79d1ab141e489f6ba9e467a3aa5d4fc374137003cbb20241dcc690d37078ce3  assets/fragments/home-gallery-en.html' | sha256sum -c -
          echo '98722fc7e26777b915d526276f5c744bb79f4affdf1b6c920d1a140501978cd3  assets/fragments/home-gallery-hu.html' | sha256sum -c -
          echo 'eaf70042a2adc0ca6ccf21bccdc480613d55cc0ba50a5f9a8f567458003e17b6  assets/fragments/home-gallery-de-at.html' | sha256sum -c -
      - name: Commit only verified fragments
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fragments/home-gallery-en.html assets/fragments/home-gallery-hu.html assets/fragments/home-gallery-de-at.html
          git diff --cached --check
          git commit -m 'Restore approved deferred gallery fragments'
          git push origin HEAD:audit/final-10of10-hardening-20260814
