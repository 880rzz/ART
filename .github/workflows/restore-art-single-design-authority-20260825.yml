name: Restore ART single design authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-art-single-design-authority-20260825.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the final Apple editorial authority
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const cssPath='assets/css/site.css';
          let css=fs.readFileSync(cssPath,'utf8');
          const end='/* APPLE-RESPONSIVE-CONTRACT-V1:END */';
          if(!css.includes(end)) throw new Error('Apple contract END marker missing');
          const start='/* ART-SINGLE-DESIGN-AUTHORITY-20260825:START */';
          const stop='/* ART-SINGLE-DESIGN-AUTHORITY-20260825:END */';
          if(css.includes(start)){
            const a=css.indexOf(start), b=css.indexOf(stop,a);
            if(b<0) throw new Error('Existing ART authority END marker missing');
            css=css.slice(0,a)+css.slice(b+stop.length);
          }
          const authority=String.raw`
/* ART-SINGLE-DESIGN-AUTHORITY-20260825:START */
/* Final visual authority for BANHALMI ART.
   Earlier rules may define component mechanics only. Palette, typography,
   spacing, alignment and responsive geometry are governed here. */
:root{
  --art-final-dark:#202530;
  --art-final-light:#2D3444;
  --art-final-raised:#29303F;
  --art-final-ink:#F5F5F7;
  --art-final-soft:#BED0E2;
  --art-final-blue:#AFC4D9;
  --art-final-gold:#DCC56B;
  --art-final-line:rgba(190,208,226,.18);
  --art-final-page:1200px;
  --art-final-reading:760px;
  --art-final-reading-wide:900px;
  --art-final-gutter:clamp(20px,4vw,56px);
  --art-final-section:clamp(72px,7.2vw,108px);
  --art-final-section-compact:clamp(54px,5.6vw,78px);
  --art-final-gap:clamp(18px,2.2vw,28px);
}
html{overflow-x:clip;background:var(--art-final-dark)!important;}
html body.apple-archive{
  margin:0!important;
  min-height:0!important;
  display:block!important;
  overflow-x:clip!important;
  background:var(--art-final-dark)!important;
  color:var(--art-final-ink)!important;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif!important;
  font-size:17px!important;
  line-height:1.62!important;
  letter-spacing:-.01em!important;
  -webkit-font-smoothing:antialiased;
}
html body.apple-archive :is(main,#main-content){display:block!important;width:100%!important;max-width:none!important;min-height:0!important;margin:0!important;background:var(--art-final-dark)!important;color:var(--art-final-ink)!important;}
html body.apple-archive footer{height:auto!important;min-height:0!important;flex:none!important;margin-top:0!important;}

/* One editorial axis on every route and language. */
html body.apple-archive :is(.wrap,.container,.inner,.press-shell){
  box-sizing:border-box!important;
  width:min(100%,var(--art-final-page))!important;
  max-width:var(--art-final-page)!important;
  margin-left:auto!important;
  margin-right:auto!important;
  padding-left:var(--art-final-gutter)!important;
  padding-right:var(--art-final-gutter)!important;
}
html body.apple-archive main :is(.intro,.section-head,.section-intro,.curatorial-periods__intro,.life-journey__intro,.presence-context__inner){
  width:min(100%,var(--art-final-reading-wide))!important;
  max-width:var(--art-final-reading-wide)!important;
  margin-left:0!important;
  margin-right:auto!important;
  text-align:left!important;
}
html body.apple-archive main :is(.prose,.copy,.text-block,.editorial-copy,.press-copy){max-width:var(--art-final-reading)!important;margin-left:0!important;margin-right:auto!important;text-align:left!important;}
html body.apple-archive main :is(h1,h2,h3,h4,p,li,dt,dd,.lead,.label,.eyebrow,.meta,.loc){text-align:left!important;}
html body.apple-archive main :is(h1,h2,h3,h4,p,.lead){margin-left:0!important;margin-right:auto!important;}

/* Typography: Apple editorial hierarchy, consistent across all templates. */
html body.apple-archive :is(h1,h2,h3,h4){font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif!important;color:var(--art-final-ink)!important;text-wrap:balance;font-weight:600!important;}
html body.apple-archive h1{font-size:clamp(2.65rem,5vw,4.85rem)!important;line-height:1.02!important;letter-spacing:-.048em!important;max-width:18ch!important;}
html body.apple-archive h2{font-size:clamp(1.95rem,3.1vw,3.05rem)!important;line-height:1.08!important;letter-spacing:-.036em!important;max-width:24ch!important;}
html body.apple-archive h3{font-size:clamp(1.2rem,1.7vw,1.65rem)!important;line-height:1.18!important;letter-spacing:-.022em!important;}
html body.apple-archive main :is(p,li,dt,dd){line-height:1.68!important;}
html body.apple-archive main :is(.lead,p.lead,.hero-sub){font-size:clamp(1.08rem,.45vw + 1rem,1.26rem)!important;line-height:1.55!important;color:var(--art-final-soft)!important;max-width:58ch!important;}
html body.apple-archive :is(.label,.eyebrow,.kicker,.presence-kicker,.era-no,.period-no){font-size:.78rem!important;line-height:1.45!important;letter-spacing:.14em!important;text-transform:uppercase!important;font-weight:650!important;color:var(--art-final-gold)!important;}
html body.apple-archive :is(.art-hero-accent,.title-accent){color:var(--art-final-blue)!important;}
@supports((-webkit-background-clip:text) or (background-clip:text)){
  html body.apple-archive :is(h1,h2) :is(.art-hero-accent,.title-accent){background:linear-gradient(90deg,#EDF4FA 0%,#AFC4D9 48%,#DCC56B 92%)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;}
}

/* Two approved section surfaces only, alternating consistently. */
html body.apple-archive main>section{
  --banhalmi-section-surface:var(--art-final-dark)!important;
  position:relative!important;
  isolation:isolate!important;
  box-sizing:border-box!important;
  margin:0!important;
  padding-top:var(--art-final-section)!important;
  padding-bottom:var(--art-final-section)!important;
  background:var(--art-final-dark)!important;
  background-color:var(--art-final-dark)!important;
  border-color:var(--art-final-line)!important;
  content-visibility:visible!important;
  contain-intrinsic-size:none!important;
  overflow:visible!important;
}
html body.apple-archive main>section:nth-of-type(even){--banhalmi-section-surface:var(--art-final-light)!important;background:var(--art-final-light)!important;background-color:var(--art-final-light)!important;}
html body.apple-archive main>section:nth-of-type(odd){--banhalmi-section-surface:var(--art-final-dark)!important;background:var(--art-final-dark)!important;background-color:var(--art-final-dark)!important;}
html body.apple-archive main>section.tone-a{--banhalmi-section-surface:var(--art-final-dark)!important;background:var(--art-final-dark)!important;background-color:var(--art-final-dark)!important;}
html body.apple-archive main>section.tone-b{--banhalmi-section-surface:var(--art-final-light)!important;background:var(--art-final-light)!important;background-color:var(--art-final-light)!important;}
html body.apple-archive main>section::before{background:var(--banhalmi-section-surface)!important;background-color:var(--banhalmi-section-surface)!important;box-shadow:none!important;}
html body.apple-archive main>section.statement::before{background:radial-gradient(circle at 76% 18%,rgba(220,197,107,.12),transparent 34%),linear-gradient(132deg,#202530,#29303F 48%,#202530)!important;}
html body.apple-archive main :is(.surface,.surface-light,.archive-surface,.section-surface){background:transparent!important;}

/* Heroes meet the header and use the same content axis. */
html body.apple-archive :is(header.hero,main>header.sub,header.sub,.curatorial-hero){box-sizing:border-box!important;width:100%!important;max-width:none!important;margin:0!important;padding-top:clamp(82px,10vw,132px)!important;padding-bottom:clamp(58px,6.5vw,92px)!important;background:radial-gradient(circle at 78% 18%,rgba(220,197,107,.12),transparent 34%),linear-gradient(132deg,#202530,#29303F 48%,#202530)!important;color:var(--art-final-ink)!important;border:0!important;overflow:hidden!important;}
html body.apple-archive header.hero{min-height:min(82svh,820px)!important;display:flex!important;align-items:center!important;}
html body.apple-archive :is(header.hero,main>header.sub,header.sub,.curatorial-hero) :is(h1,.lead,.hero-sub,.loc,.meta){margin-left:0!important;margin-right:auto!important;text-align:left!important;}
html body.apple-archive :is(header.hero,main>header.sub,header.sub,.curatorial-hero) h1{max-width:18ch!important;}

/* Cards and evidence are subordinate to the photographs, not floating UI. */
html body.apple-archive main :is(.card,.archive-card,.project-card,.record-card,.source-card,.fact-card,.timeline-card,.curatorial-period,.life-stage,.t-item,.timeline-item,.exhibition-item,.book-card,.press-record,.record-links>*,.project-evidence-grid>*){
  box-sizing:border-box!important;
  min-width:0!important;
  color:var(--art-final-ink)!important;
  background:rgba(32,37,48,.16)!important;
  border:1px solid var(--art-final-line)!important;
  border-radius:0!important;
  box-shadow:none!important;
  transform:none!important;
}
html body.apple-archive main :is(.grid,.cards,.archive-grid,.project-grid,.record-grid,.source-grid,.facts,.timeline,.record-links,.project-evidence-grid,.curatorial-periods__grid){gap:var(--art-final-gap)!important;row-gap:var(--art-final-gap)!important;}
html body.apple-archive main :is(.cards,.archive-grid,.project-grid,.record-grid,.source-grid){align-items:stretch!important;}
html body.apple-archive main :is(.card,.archive-card,.project-card,.record-card,.source-card,.fact-card,.timeline-card,.press-record) :is(h2,h3,h4,p,li,span,strong){text-align:left!important;}
html body.apple-archive main :is(.card,.archive-card,.project-card,.record-card,.source-card,.fact-card,.timeline-card,.press-record) p{color:var(--art-final-soft)!important;}
html body.apple-archive main .collage{columns:3!important;column-gap:var(--art-final-gap)!important;}
html body.apple-archive main .collage figure{break-inside:avoid!important;margin:0 0 var(--art-final-gap)!important;border-radius:0!important;box-shadow:none!important;}
html body.apple-archive main .collage img{width:100%!important;height:auto!important;transform:none!important;}

/* Centering is opt-in only. */
html body.apple-archive main :is(.statement,.editorial-statement,.text-center,.center,.centered,[data-align="center"]){text-align:center!important;}
html body.apple-archive main :is(.statement,.editorial-statement,.text-center,.center,.centered,[data-align="center"]) :is(h1,h2,h3,p,.lead,blockquote,.intro,.section-head){margin-left:auto!important;margin-right:auto!important;text-align:center!important;}

/* Menu: full-screen editorial navigation; active state is typographic only. */
html body.apple-archive #menu{background:rgba(32,37,48,.99)!important;color:var(--art-final-ink)!important;}
html body.apple-archive #menu :is(a,summary,.m-desc,.m-foot){text-align:left!important;}
html body.apple-archive #menu :is(a[aria-current="page"],a.active,.active>a){background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important;text-decoration:underline!important;text-decoration-thickness:2px!important;text-underline-offset:.25em!important;}
@media(min-width:901px){
  html body.apple-archive #menu{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;padding:clamp(6.5rem,10vh,8rem) var(--art-final-gutter) clamp(3rem,6vh,5rem)!important;overflow-y:auto!important;}
  html body.apple-archive #menu .mwrap{box-sizing:border-box!important;width:min(100%,var(--art-final-page))!important;max-width:var(--art-final-page)!important;margin-inline:auto!important;padding:0!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;column-gap:clamp(4rem,8vw,8rem)!important;align-content:start!important;align-items:start!important;}
}

/* Press and curatorial pages obey the same approved blue pair. */
html body.apple-archive[data-archive-page="press"] :is(main.press-redesign,.press-records,.press-period){background:var(--art-final-dark)!important;}
html body.apple-archive[data-archive-page="press"] :is(.press-overview,.press-period:nth-child(even)){background:var(--art-final-light)!important;}
html body.apple-archive[data-content-family="curatorial"] main>section:nth-of-type(odd){background:var(--art-final-dark)!important;}
html body.apple-archive[data-content-family="curatorial"] main>section:nth-of-type(even){background:var(--art-final-light)!important;}
html body.apple-archive[data-content-family="curatorial"] main :is(h1,h2,h3,p,ul,ol,li,.lead,.loc,.label,.meta){text-align:left!important;}

/* Footer is content-height, centered as a system but with readable left columns. */
html body.apple-archive footer{background:linear-gradient(180deg,var(--art-final-raised),var(--art-final-dark) 78%)!important;color:var(--art-final-soft)!important;padding:clamp(54px,6vw,78px) 0 30px!important;}
html body.apple-archive footer>.wrap{width:min(100%,var(--art-final-page))!important;max-width:var(--art-final-page)!important;margin-inline:auto!important;padding-inline:var(--art-final-gutter)!important;}
html body.apple-archive footer :is(.footer-grid,.footer-columns){display:grid!important;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))!important;gap:clamp(28px,4vw,52px)!important;align-items:start!important;text-align:left!important;}
html body.apple-archive footer :is(h3,p,li,a){text-align:left!important;}
html body.apple-archive footer .socials.lang-switch{width:100%!important;max-width:100%!important;margin-inline:auto!important;justify-content:center!important;text-align:center!important;}
html body.apple-archive footer :is(.fineprint,.footer-social-disclosure,.banhalmi-ecosystem){margin-left:auto!important;margin-right:auto!important;text-align:center!important;}

/* Accessible interaction and predictable geometry. */
html body.apple-archive :is(.btn,button,summary,input,select,textarea,#menu a){min-height:44px;}
html body.apple-archive :is(input,select,textarea){font-size:16px;}
html body.apple-archive main p a:not(.btn):not(.button):not(.cta){color:var(--art-final-ink)!important;text-decoration:underline!important;text-decoration-color:var(--art-final-gold)!important;text-underline-offset:.22em!important;}
html body.apple-archive main p a:not(.btn):not(.button):not(.cta):hover{color:var(--art-final-gold)!important;}

@media(max-width:1024px){
  :root{--art-final-gutter:clamp(22px,4.5vw,44px);--art-final-section:clamp(64px,7vw,88px);}
  html body.apple-archive main .collage{columns:2!important;}
  html body.apple-archive :is(.book-lead,.split,.two-col,.grid-2){grid-template-columns:1fr!important;}
}
@media(max-width:768px){
  :root{--art-final-gutter:24px;--art-final-section:62px;--art-final-gap:18px;}
  html body.apple-archive{font-size:17px!important;}
  html body.apple-archive h1{font-size:clamp(2.3rem,9vw,3.35rem)!important;}
  html body.apple-archive h2{font-size:clamp(1.8rem,7vw,2.4rem)!important;}
  html body.apple-archive header.hero{min-height:auto!important;}
  html body.apple-archive :is(header.hero,main>header.sub,header.sub,.curatorial-hero){padding-top:72px!important;padding-bottom:52px!important;}
  html body.apple-archive :is(.wrap,.container,.inner,.press-shell){width:100%!important;max-width:100%!important;padding-left:var(--art-final-gutter)!important;padding-right:var(--art-final-gutter)!important;}
  html body.apple-archive main :is(.grid,.cards,.archive-grid,.project-grid,.record-grid,.source-grid,.facts,.timeline,.record-links,.project-evidence-grid,.curatorial-periods__grid){grid-template-columns:1fr!important;}
  html body.apple-archive main .collage{columns:2!important;}
  html body.apple-archive #menu .mwrap{grid-template-columns:1fr!important;}
}
@media(max-width:560px){
  :root{--art-final-gutter:20px;--art-final-section:54px;--art-final-gap:16px;}
  html body.apple-archive{font-size:16px!important;line-height:1.6!important;}
  html body.apple-archive h1{font-size:clamp(2.05rem,11vw,2.9rem)!important;}
  html body.apple-archive h2{font-size:clamp(1.62rem,8vw,2.08rem)!important;}
  html body.apple-archive main .collage{columns:1!important;}
  html body.apple-archive :is(.hero-cta,.actions,.gal-actions){display:grid!important;grid-template-columns:1fr!important;width:100%!important;}
  html body.apple-archive :is(.hero-cta,.actions,.gal-actions) :is(.btn,a,button,label){width:100%!important;box-sizing:border-box!important;text-align:center!important;justify-content:center!important;}
  html body.apple-archive footer :is(.footer-grid,.footer-columns){grid-template-columns:1fr!important;}
}
@media(prefers-reduced-motion:reduce){html body.apple-archive *,html body.apple-archive *::before,html body.apple-archive *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}
/* ART-SINGLE-DESIGN-AUTHORITY-20260825:END */
`;
          css=css.replace(end,authority+'\n'+end);
          fs.writeFileSync(cssPath,css);

          const auditPath='tools/audit-apple-responsive-contract.mjs';
          let audit=fs.readFileSync(auditPath,'utf8');
          if(!audit.includes('ART-SINGLE-DESIGN-AUTHORITY-20260825:START')){
            audit=audit.replace("const contract = a >= 0 && b > a ? css.slice(a,b) : '';",`const contract = a >= 0 && b > a ? css.slice(a,b) : '';\nconst finalStart = contract.indexOf('ART-SINGLE-DESIGN-AUTHORITY-20260825:START');\nconst finalEnd = contract.indexOf('ART-SINGLE-DESIGN-AUTHORITY-20260825:END');\nif (finalStart < 0 || finalEnd <= finalStart) failures.push('final ART single-design authority missing');\nif (finalEnd >= 0 && contract.slice(finalEnd).includes('STAGE153-')) failures.push('legacy stage found after final ART authority');\nfor (const needle of ['--art-final-dark:#202530','--art-final-light:#2D3444','--art-final-page:1200px','content-visibility:visible!important','contain-intrinsic-size:none!important','main>section:nth-of-type(even)','@media(max-width:1024px)','@media(max-width:768px)','@media(max-width:560px)']) if (!contract.includes(needle)) failures.push('final ART authority missing: '+needle);`);
            fs.writeFileSync(auditPath,audit);
          }
          NODE
          rm .github/workflows/restore-art-single-design-authority-20260825.yml
      - name: Validate source contracts
        run: npm test
      - name: Commit restored design authority
        run: |
          git restore .github/workflows/restore-art-single-design-authority-20260825.yml
          git config user.name "ART release bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/site.css tools/audit-apple-responsive-contract.mjs
          git commit -m "Restore single Apple editorial design authority"
          git push origin HEAD:main
