name: ART PageSpeed responsive image validation

on:
  push:
    branches:
      - fix/pagespeed-responsive-images-20260808
    paths:
      - .github/workflows/art-pagespeed-fix.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate ART PageSpeed image pipeline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository audit
        run: npm test
      - name: Build and validate optimized Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.3.0'
          python scripts/generate-responsive-gallery.py _site
          node scripts/optimize-pages-artifact.mjs _site

          test -f _site/assets/img/best-of/responsive/best-of-05-640.webp
          test -f _site/assets/img/best-of/responsive/best-of-05-720.webp
          test -f _site/assets/img/best-of/responsive/best-of-05-960.webp
          test -f _site/assets/img/responsive/portrait-circle-480.webp
          test -f _site/assets/img/responsive/portrait-circle-720.webp

          for page in index.html hu/index.html de-at/index.html; do
            grep -Fq '/assets/img/best-of/responsive/best-of-05-720.webp 720w' "_site/$page"
            grep -Fq 'sizes="(max-width: 640px) calc(100vw - 70px), (max-width: 1000px) calc(50vw - 48px), 33vw"' "_site/$page"
            grep -Fq 'src="/assets/img/responsive/portrait-circle-480.webp"' "_site/$page"
            grep -Fq '/assets/img/responsive/portrait-circle-720.webp 720w' "_site/$page"
            grep -Fq 'sizes="(max-width: 640px) 274px, 480px"' "_site/$page"
          done

          echo 'ART responsive image production artifact validated.'
