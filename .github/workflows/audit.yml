name: Audit

# The site is the source of truth. Nothing here generates or commits: the
# workflow reads the committed files and reports. The previous setup ran about
# thirty generators on every push to main and pushed the result back, which is
# how hand-made corrections kept disappearing.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the audits
        run: npm test
      - name: Fail if anything in the working tree changed
        run: |
          if ! git diff --quiet; then
            echo "::error::An audit modified a file. Audits must only read."
            git --no-pager diff --stat
            exit 1
          fi

  image-semantics-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate image metadata registry
        run: npm run audit:image-registry
      - name: Validate registry coverage
        run: npm run audit:image-coverage
      - name: Validate HTML synchronization state
        run: npm run audit:image-html-sync
      - name: Validate image knowledge graph
        run: npm run audit:image-knowledge-graph
      - name: Validate runtime isolation
        run: npm run audit:image-runtime-isolation
      - name: Dry-run metadata synchronization
        run: npm run sync:image-metadata
      - name: Confirm image checks are read-only
        run: |
          if ! git diff --quiet; then
            echo "::error::An image semantics check modified runtime files."
            git --no-pager diff --stat
            exit 1
          fi
