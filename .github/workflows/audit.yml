name: Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply one-shot homepage CTA remediation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/home-hero-gallery-size-20260823'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/css/site.css')
          css = path.read_text(encoding='utf-8')
          start = '/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */'
          if start not in css:
              block = '''\n/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */
/* Homepage-only desktop CTA geometry. Mobile <=640px remains governed by the existing two-column/narrow-viewport authority. */
@media (min-width:641px){
  html body.apple-archive[data-archive-page="index"] header.hero .hero-cta .btn{
    box-sizing:border-box!important;
    inline-size:10.5rem!important;
    min-inline-size:10.5rem!important;
    max-inline-size:10.5rem!important;
  }
}
/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */\n'''
              anchor = '/* APPLE-RESPONSIVE-CONTRACT-V1:END */'
              if anchor not in css:
                  raise SystemExit('canonical CSS authority end marker missing')
              path.write_text(css.replace(anchor, block + '\n' + anchor, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/apply-home-hero-cta-size-fix.yml .audit-trigger-hero-cta
          git fetch origin main
          git checkout origin/main -- .github/workflows/audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Equalize homepage hero CTA desktop geometry'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run the audits
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee audit.log
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-log
          path: audit.log
          retention-days: 3
      - name: Fail if anything in the working tree changed
        run: |
          if ! git diff --quiet; then
            echo "::error::An audit modified a file. Audits must only read."
            git --no-pager diff --stat
            exit 1
          fi
