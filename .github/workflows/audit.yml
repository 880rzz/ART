name: Canonical Person migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/canonical-person-audit-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-person-audit-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace the Person identifier in every affected file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          canonical = 'https://www.norbertbanhalmi.com/about/'
          old_values = [
              'https://www.banhalmi.art/norbert-banhalmi#person',
              'https://banhalmi.art/norbert-banhalmi#person',
              'http://www.banhalmi.art/norbert-banhalmi#person',
              'http://banhalmi.art/norbert-banhalmi#person',
              'https://www.banhalmi.art/norbert-banhalmi/',
              'https://banhalmi.art/norbert-banhalmi/',
              'https://www.banhalmi.art/norbert-banhalmi',
              'https://banhalmi.art/norbert-banhalmi',
          ]
          extensions = {'.html','.htm','.json','.jsonld','.txt','.md','.mjs','.js','.cjs','.xml','.yaml','.yml','.css','.svg','.webmanifest','.csv'}
          special = {'_redirects','robots.txt','CNAME'}
          changed = []
          for file in Path('.').rglob('*'):
              if not file.is_file() or any(part in {'.git','node_modules'} for part in file.parts):
                  continue
              if file.suffix.lower() not in extensions and file.name not in special:
                  continue
              try:
                  text = file.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old in old_values:
                  text = text.replace(old, canonical)
              if file.name == '_redirects':
                  for route in ['/norbert-banhalmi','/hu/norbert-banhalmi','/de-at/norbert-banhalmi']:
                      text = re.sub(rf'^{re.escape(route)}\s+\S+\s+301$', f'{route}  {canonical}  301', text, flags=re.M)
              if text != original:
                  file.write_text(text, encoding='utf-8')
                  changed.append(str(file))
          Path('.canonical-person-migration').unlink(missing_ok=True)
          print(f'Migrated {len(changed)} existing files')
          PY
      - name: Restore the permanent branch audit
        run: |
          cat > .github/workflows/audit.yml <<'YAML'
          name: Audit

          # The site is the source of truth. Nothing here generates or commits: the
          # workflow reads the committed files and reports. The previous setup ran about
          # thirty generators on every push to main and pushed the result back, which is
          # how hand-made corrections kept disappearing.

          on:
            workflow_dispatch:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Run the audits
                  run: npm test
                - name: Fail if anything in the working tree changed
                  run: |
                    if ! git diff --quiet; then
                      echo "::error::An audit modified a file. Audits must only read."
                      git --no-pager diff --stat
                      exit 1
                    fi
          YAML
      - name: Audit and commit
        run: |
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify canonical Person across ART"
          git push origin HEAD:agent/canonical-person-audit-20260802

  cleanup:
    needs: migrate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore the permanent main audit
        run: |
          cat > .github/workflows/audit.yml <<'YAML'
          name: Audit

          # The site is the source of truth. Nothing here generates or commits: the
          # workflow reads the committed files and reports. The previous setup ran about
          # thirty generators on every push to main and pushed the result back, which is
          # how hand-made corrections kept disappearing.

          on:
            workflow_dispatch:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Run the audits
                  run: npm test
                - name: Fail if anything in the working tree changed
                  run: |
                    if ! git diff --quiet; then
                      echo "::error::An audit modified a file. Audits must only read."
                      git --no-pager diff --stat
                      exit 1
                    fi
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit.yml
          git commit -m "Restore read-only audit workflow [skip ci]"
          git push origin main
