name: One-time curatorial release refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit.yml

permissions:
  contents: write

jobs:
  refresh-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curatorial-template-system-20260802
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh the curatorial release on the PR branch
        working-directory: work
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/design-release.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['release'] = '20260802-curatorial-v23'
          data['assetDigest'] = '87a131e56c2d50ab'
          data['note'] = 'Curatorial template release: gradient inner-page heroes, shared Press/Community/Writing rules, curator-style homepage Journey and Exhibitions chapters, and one footer boundary across all languages.'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          npm run bump:release
          cat > .github/workflows/audit.yml <<'YAML'
          name: Audit

          # The site is the source of truth. Nothing here generates or commits: the
          # workflow reads the committed files and reports. The previous setup ran about
          # thirty generators on every push to main and pushed the result back, which is
          # how hand-made corrections kept disappearing.

          on:
            workflow_dispatch:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Run the audits
                  run: npm test
                - name: Fail if anything in the working tree changed
                  run: |
                    if ! git diff --quiet; then
                      echo "::error::An audit modified a file. Audits must only read."
                      git --no-pager diff --stat
                      exit 1
                    fi
          YAML
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh curatorial design release"
          git push origin agent/curatorial-template-system-20260802
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: cleanup
      - name: Restore the permanent read-only audit workflow on main
        working-directory: cleanup
        run: |
          cat > .github/workflows/audit.yml <<'YAML'
          name: Audit

          # The site is the source of truth. Nothing here generates or commits: the
          # workflow reads the committed files and reports. The previous setup ran about
          # thirty generators on every push to main and pushed the result back, which is
          # how hand-made corrections kept disappearing.

          on:
            workflow_dispatch:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Run the audits
                  run: npm test
                - name: Fail if anything in the working tree changed
                  run: |
                    if ! git diff --quiet; then
                      echo "::error::An audit modified a file. Audits must only read."
                      git --no-pager diff --stat
                      exit 1
                    fi
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit.yml
          git commit -m "Restore read-only audit workflow [skip ci]"
          git push origin main
