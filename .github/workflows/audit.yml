name: Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/layout-palette-gallery-audit-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Stage145 final layout remediation
        run: node tools/stage145-remediate.mjs
      - name: Run the audits
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee audit.log
      - name: Commit remediation and restore read-only audit workflow
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/audit.yml
          rm -f .github/workflows/one-shot-stage145-final-layout.yml tools/stage145-remediate.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+880rzz@users.noreply.github.com'
          git add assets/css/site.css .github/workflows/audit.yml .github/workflows/one-shot-stage145-final-layout.yml tools/stage145-remediate.mjs
          git commit -m 'Enforce final ART layout and palette authority'
          git push origin HEAD:fix/layout-palette-gallery-audit-20260815
