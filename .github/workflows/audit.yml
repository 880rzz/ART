name: Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply scoped PR147 CTA remediation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 147 && github.event.pull_request.head.ref == 'fix/home-hero-gallery-size-20260823'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/site.css')
          css=p.read_text(encoding='utf-8')
          start='/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */'
          end='/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */'
          anchor='/* APPLE-RESPONSIVE-CONTRACT-V1:END */'
          if start not in css:
              if end in css or anchor not in css: raise SystemExit('invalid CSS marker state')
              block='''/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */
/* Homepage-only desktop CTA geometry. Mobile <=640px remains governed by the existing two-column/narrow-viewport authority. */
@media (min-width:641px){
  html body.apple-archive[data-archive-page="index"] header.hero .hero-cta .btn{
    box-sizing:border-box!important;
    inline-size:10.5rem!important;
    min-inline-size:10.5rem!important;
    max-inline-size:10.5rem!important;
  }
}
/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */
'''
              p.write_text(css.replace(anchor,block+'\n'+anchor,1),encoding='utf-8')
          PY
          if ! git diff --quiet -- assets/css/site.css; then
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/css/site.css
            git commit -m 'Equalize homepage hero CTA desktop geometry'
            git push origin HEAD:fix/home-hero-gallery-size-20260823
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run the audits
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee audit.log
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-log
          path: audit.log
          retention-days: 3
