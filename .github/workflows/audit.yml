name: Audit

# The site is the source of truth. Nothing here generates or commits: the
# workflow reads the committed files and reports. The previous setup ran about
# thirty generators on every push to main and pushed the result back, which is
# how hand-made corrections kept disappearing.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run the audits
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee audit.log
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-log
          path: audit.log
          retention-days: 3
      - name: Fail if anything in the working tree changed
        run: |
          if ! git diff --quiet; then
            echo "::error::An audit modified a file. Audits must only read."
            git --no-pager diff --stat
            exit 1
          fi

  apply-home-hero-cta-fix:
    if: github.event_name == 'push' && github.sha == '8e9fa002073c33b656bb07479bdeaa72999feb76'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/home-hero-gallery-size-20260823
          fetch-depth: 0
      - name: Patch canonical CSS authority on PR branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/css/site.css')
          css = p.read_text(encoding='utf-8')
          start = '/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */'
          if start not in css:
              block = '''\n/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */
/* Homepage-only desktop CTA geometry. Existing <=640px two-column and narrow-viewport behavior remains authoritative. */
@media (min-width:641px){
  html body.apple-archive[data-archive-page="index"] header.hero .hero-cta .btn{
    box-sizing:border-box!important;
    inline-size:10.5rem!important;
    min-inline-size:10.5rem!important;
    max-inline-size:10.5rem!important;
  }
}
/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */\n'''
              anchor = '/* APPLE-RESPONSIVE-CONTRACT-V1:END */'
              if anchor not in css:
                  raise SystemExit('canonical CSS authority end marker missing')
              p.write_text(css.replace(anchor, block + '\n' + anchor, 1), encoding='utf-8')
          Path('.github/workflows/apply-home-hero-cta-size-fix.yml').unlink(missing_ok=True)
          Path('.audit-trigger-hero-cta').unlink(missing_ok=True)
          PY
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Equalize homepage hero CTA desktop geometry'
          git push origin HEAD:fix/home-hero-gallery-size-20260823
