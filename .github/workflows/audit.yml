name: Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-and-audit:
    if: github.event.pull_request.number == 51 && github.event.pull_request.head.ref == 'agent/mobile-header-story-hotfix-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-header-story-hotfix-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update release tokens
        run: npm run bump:release
      - name: Run full audits
        run: npm test
      - name: Commit audited release bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply mobile hotfix release token"
          git push origin HEAD:agent/mobile-header-story-hotfix-20260802
