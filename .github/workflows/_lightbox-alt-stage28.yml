name: Apply lightbox ALT stage 28

on:
  push:
    branches:
      - agent/lightbox-alt-stage28

permissions:
  contents: write

concurrency:
  group: lightbox-alt-stage28
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/lightbox-alt-stage28
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply shared lightbox accessibility contract
        run: node scripts/_apply-lightbox-alt-stage28.mjs

      - name: Regenerate image semantics report and require zero issues
        run: |
          npm run audit:images:report
          npm run audit:images:strict

      - name: Remove one-time migration files before safety audits
        run: |
          rm .github/workflows/_lightbox-alt-stage28.yml
          rm scripts/_apply-lightbox-alt-stage28.mjs

      - name: Run complete archive audit
        run: npm test

      - name: Commit verified state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Classify shared lightbox placeholders accessibly" || exit 0
          git push origin HEAD:agent/lightbox-alt-stage28
