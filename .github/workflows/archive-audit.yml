name: Archive audit

on:
  pull_request:
    paths:
      - 'data/archive/**'
      - 'hu/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/archive-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run archive tests
        run: npm test

      - name: Run integration
        run: npm run integrate:family-origins

      - name: Verify generated files are committed
        run: git diff --exit-code -- hu/index.html sitemap.xml
