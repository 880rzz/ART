name: Archive audit

on:
  pull_request:
    paths:
      - 'data/archive/**'
      - 'hu/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/archive-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit family origins
        run: node tests/audit-family-origins.mjs

      - name: Audit About narrative
        run: node tests/audit-about-narrative.mjs

      - name: Audit homepage intro
        run: node tests/audit-home-intro.mjs

      - name: Audit career chronology
        run: node tests/audit-career-chronology.mjs

      - name: Audit section intros
        run: node tests/audit-section-intros.mjs

      - name: Audit project summaries
        run: node tests/audit-project-summaries.mjs

      - name: Audit homepage metadata
        run: node tests/audit-home-meta.mjs

      - name: Audit contact and footer
        run: node tests/audit-contact-footer.mjs

      - name: Audit domain ecosystem
        run: node tests/audit-domain-ecosystem.mjs

      - name: Run integration
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run integrate:family-origins 2>&1 | tee integration.log

      - name: Create integration patch
        if: always()
        shell: bash
        run: |
          git diff -- hu/index.html sitemap.xml > integration.patch
          test -s integration.log || printf 'No integration output was captured.\n' > integration.log

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-integration-diagnostics
          path: |
            integration.log
            integration.patch
          if-no-files-found: error
          retention-days: 7

      - name: Fail when integration failed
        if: steps.integration.outcome == 'failure'
        run: |
          tail -n 60 integration.log
          exit 1

      - name: Verify generated files are committed
        if: steps.integration.outcome == 'success'
        run: git diff --exit-code -- hu/index.html sitemap.xml
