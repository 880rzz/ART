name: Archive audit

# CI verification marker: 2026-07-30
on:
  push:
    branches:
      - main
    paths:
      - 'data/archive/**'
      - 'vocabulary/**'
      - 'hu/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.jsonld'
      - 'press-source-registry.json'
      - 'sitemap.xml'
      - 'sitemap-artworks.xml'
      - 'robots.txt'
      - 'package.json'
      - '.github/workflows/archive-audit.yml'
  pull_request:
    paths:
      - 'data/archive/**'
      - 'vocabulary/**'
      - 'hu/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.jsonld'
      - 'press-source-registry.json'
      - 'sitemap.xml'
      - 'sitemap-artworks.xml'
      - 'robots.txt'
      - 'package.json'
      - '.github/workflows/archive-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Archive and knowledge graph audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies when declared
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif node -e "const p=require('./package.json'); process.exit(Object.keys(p.dependencies||{}).length || Object.keys(p.devDependencies||{}).length ? 0 : 1)"; then
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo 'No npm dependencies declared; installation skipped.'
          fi

      - name: Run committed-state archive tests
        id: committed_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:archive-hu 2>&1 | tee archive-tests.log

      - name: Upload committed-state diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-diagnostics
          path: archive-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when committed-state tests failed
        if: steps.committed_tests.outcome == 'failure'
        run: |
          tail -n 120 archive-tests.log
          exit 1

      - name: Run complete Hungarian archive integration
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run integrate:hu-archive 2>&1 | tee integration.log

      - name: Run post-integration archive tests
        if: steps.integration.outcome == 'success'
        shell: bash
        run: npm run test:archive-hu

      - name: Commit verified generated state to pull request branch
        if: steps.integration.outcome == 'success' && github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowed-files.txt <<'EOF'
          hu/books/book-anovilaga.html
          hu/books/book-ebredes.html
          hu/books/book-szosszenetek.html
          hu/exhibitions/anovilaga.html
          hu/exhibitions/ebredes.html
          hu/exhibitions/euforia.html
          hu/index.html
          hu/works/magyar-peter-portre-2026.html
          press-knowledge-graph.hu.jsonld
          sitemap.xml
          EOF
          git diff --name-only | sort > /tmp/changed-files.txt
          unexpected="$(comm -23 /tmp/changed-files.txt /tmp/allowed-files.txt)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected generated files:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          mapfile -t files < /tmp/allowed-files.txt
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo 'Generated state already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Commit verified Hungarian archive generated state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Create integration patch
        if: always()
        shell: bash
        run: |
          git diff -- \
            hu/index.html \
            hu/books \
            hu/exhibitions \
            hu/works \
            sitemap.xml \
            sitemap-artworks.xml \
            robots.txt \
            artwork-knowledge-graph.hu.jsonld \
            press-knowledge-graph.hu.jsonld \
            oeuvre-knowledge-graph.hu.jsonld \
            data/archive > integration.patch
          test -s integration.log || printf 'No integration output was captured.\n' > integration.log
          test -s integration.patch || printf 'No generated file changes.\n' > integration.patch

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-integration-diagnostics
          path: |
            integration.log
            integration.patch
          if-no-files-found: error
          retention-days: 7

      - name: Fail when integration failed
        if: steps.integration.outcome == 'failure'
        run: |
          tail -n 120 integration.log
          exit 1

      - name: Verify generated files are committed
        if: steps.integration.outcome == 'success'
        run: |
          git diff --exit-code -- \
            hu/index.html \
            hu/books \
            hu/exhibitions \
            hu/works \
            sitemap.xml \
            sitemap-artworks.xml \
            robots.txt \
            artwork-knowledge-graph.hu.jsonld \
            press-knowledge-graph.hu.jsonld \
            oeuvre-knowledge-graph.hu.jsonld \
            data/archive
