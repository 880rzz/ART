name: Apply ART v67 cache bump
on:
  push:
    branches: [fix/design-ecosystem-v67-20260809]
    paths:
      - .github/workflows/apply-v67-cache-bump.yml
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design-ecosystem-v67-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical release token to every HTML asset reference
        run: npm run bump:release
      - name: Remove helper and commit
        run: |
          rm -f .github/workflows/apply-v67-cache-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No cache-bump changes"; exit 1; fi
          git commit -m "fix: propagate ART v67 design cache token archive-wide"
          git push origin HEAD:fix/design-ecosystem-v67-20260809
