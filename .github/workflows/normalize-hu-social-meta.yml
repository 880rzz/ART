name: Normalize Hungarian archive social metadata

on:
  push:
    branches:
      - feature/archive-origins-foundation
    paths:
      - 'scripts/normalize-hu-social-meta.mjs'
      - 'tests/audit-hu-social-meta.mjs'
      - 'package.json'
      - '.github/workflows/normalize-hu-social-meta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-origins-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize social metadata
        run: npm run integrate:social-hu
      - name: Audit social metadata
        run: node tests/audit-hu-social-meta.mjs
      - name: Run Hungarian archive audits
        run: npm run test:archive-hu
      - name: Commit generated metadata
        shell: bash
        run: |
          if git diff --quiet -- hu/books hu/exhibitions; then
            echo 'No generated social metadata changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hu/books hu/exhibitions
          git commit -m 'Normalize Hungarian archive social metadata'
          git push origin HEAD:feature/archive-origins-foundation
