name: Temporary Stage 90 chronology
on:
  push:
    branches: [work/art-chronology-v90-20260810]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/art-chronology-v90-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare v90 release metadata and cache keys
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const release='20260810-chronology-surface-v90';
          for(const dir of ['assets/css','assets/js']){
            for(const name of fs.readdirSync(dir)){
              if(!/\.(css|js)$/.test(name)) continue;
              const p=path.join(dir,name);
              let t=fs.readFileSync(p,'utf8');
              t=t.replace(/20260810-page-review-v89/g,release).replace(/20260810-v90/g,release);
              fs.writeFileSync(p,t);
            }
          }
          const p='data/design-release.json';
          const rel=JSON.parse(fs.readFileSync(p,'utf8'));
          rel.release=release;
          rel.note='Stage 90 closes the remaining ART design cascade leak: subpages follow the homepage blue surface rhythm, hero H1 scale is consistent, and chronology/life-journey rows alternate dark and lighter blue across EN/HU/DE-AT.';
          if(!rel.stylesheets.includes('chronology-surface-authority.css')) rel.stylesheets.push('chronology-surface-authority.css');
          rel.assetDigest='pending';
          fs.writeFileSync(p,JSON.stringify(rel,null,2)+'\n');
          NODE
      - run: npm run bump:release
      - name: Finalize asset digest
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const h=crypto.createHash('sha256');
          for(const n of fs.readdirSync('assets/css').filter(x=>x.endsWith('.css')).sort()) h.update(fs.readFileSync(path.join('assets/css',n)));
          for(const n of fs.readdirSync('assets/js').filter(x=>x.endsWith('.js')).sort()) h.update(fs.readFileSync(path.join('assets/js',n)));
          for(const n of fs.readdirSync('assets/video').filter(x=>x.endsWith('.mp4')).sort()) h.update(fs.readFileSync(path.join('assets/video',n)));
          const p='data/design-release.json';
          const rel=JSON.parse(fs.readFileSync(p,'utf8'));
          rel.assetDigest=h.digest('hex').slice(0,16);
          fs.writeFileSync(p,JSON.stringify(rel,null,2)+'\n');
          NODE
      - name: Remove temporary release workflow
        run: rm .github/workflows/temp-stage90-chronology.yml
      - name: Run complete audit suite
        run: npm test
      - name: Run palette and contrast gate
        run: node tools/audit-blue-palette-contrast-stage43.mjs
      - name: Commit verified v90 candidate
        run: |
          git config user.name "ART Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: finalize ART chronology surface authority v90"
          git push origin HEAD:work/art-chronology-v90-20260810
