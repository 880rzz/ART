name: Patch footer cache token v118

on:
  push:
    branches: [fix/nav-books-typography-20260811]
    paths:
      - '.github/workflows/patch-footer-token-v118.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-books-typography-20260811
      - name: Sync footer palette cache token
        shell: bash
        run: |
          sed -i 's/20260811-menu-anchor-v117/20260811-menu-books-v118/g' assets/css/footer-elegant.css
          if git diff --quiet -- assets/css/footer-elegant.css; then
            echo 'Footer token already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/footer-elegant.css
          git commit -m 'Sync footer palette cache token'
          git push origin HEAD:fix/nav-books-typography-20260811
