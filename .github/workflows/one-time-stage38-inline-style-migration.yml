name: One-time stage38 inline style migration
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-inline-styles-stage38.mjs'
      - '.github/workflows/one-time-stage38-inline-style-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run guarded migration
        run: node tools/migrate-inline-styles-stage38.mjs
      - name: Propagate v51 release token
        run: npm run bump:release
      - name: Verify full audit before commit
        run: npm test
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add assets/css/museum-editorial.css data/design-release.json
          git commit -m 'fix(design): centralize repeated inline presentation styles'
          git push
