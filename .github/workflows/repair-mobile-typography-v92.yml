name: Repair mobile typography v92

on:
  push:
    branches:
      - fix/mobile-typography-audit-20260810
    paths:
      - .github/workflows/repair-mobile-typography-v92.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-typography-audit-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply archive-wide mobile typography floor and audit
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import path from 'node:path';

          const OLD='20260810-mobile-readability-v91';
          const NEW='20260810-mobile-typography-v92';
          const textExt=new Set(['.html','.css','.js','.json','.mjs','.py','.yml','.yaml','.txt','.xml','.md']);
          const skipDirs=new Set(['.git','.github','node_modules','reports']);
          const files=[];
          async function walk(dir='.'){
            for(const ent of await readdir(dir,{withFileTypes:true})){
              if(skipDirs.has(ent.name)) continue;
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()) await walk(p);
              else if(textExt.has(path.extname(ent.name))) files.push(p);
            }
          }
          await walk();
          let replacements=0;
          for(const file of files){
            let s=await readFile(file,'utf8');
            if(!s.includes(OLD)) continue;
            const n=s.split(OLD).length-1;
            replacements+=n;
            s=s.split(OLD).join(NEW);
            await writeFile(file,s);
          }
          if(replacements<200) throw new Error(`Expected broad v91 propagation, only replaced ${replacements} tokens`);

          const cssPath='assets/css/homepage-two-tone-authority.css';
          let css=await readFile(cssPath,'utf8');
          const marker='STAGE92-ARCHIVE-WIDE-MOBILE-TYPOGRAPHY-FLOOR';
          if(css.includes(marker)) throw new Error('Stage92 already present');
          css += `\n\n/* ${marker}:START\n   Final mobile reading contract. This stylesheet is the last visual authority\n   on every ART content page, so semantic copy and known catalogue/meta roles\n   cannot fall back to legacy 10–13px rules on phones. Decorative pseudo-\n   elements/icons are intentionally excluded. */\n@media(max-width:719px){\n  html body.apple-archive.apple-archive.apple-archive.apple-archive :is(\n    p,li,a,button,summary,label,input,textarea,select,option,small,figcaption,td,th,dt,dd,time,address,blockquote,cite,\n    .meta,.loc,.muted,.fineprint,.cap,.caption,.credit,.credits,.source,.sources,.reference,.references,\n    .label,.eyebrow,.kicker,.presence-kicker,.era-no,.period-no,.life-stage__index,.yr,\n    .btn,.svc-cta,.actions a,.hero-cta .btn,.lang-note,.footer-links a,.link-grid a,.banhalmi-ecosystem a\n  ){\n    font-size:max(.875rem,1em)!important;\n  }\n  html body.apple-archive.apple-archive.apple-archive.apple-archive :is(\n    p,li,figcaption,td,th,dt,dd,blockquote,address,.meta,.loc,.muted,.fineprint,.cap,.caption,.credit,.source,.reference\n  ){\n    line-height:1.5!important;\n  }\n  html body.apple-archive.apple-archive.apple-archive.apple-archive :is(a,button,summary,.btn,.svc-cta,.actions a){\n    text-underline-offset:.16em;\n  }\n}\n/* ${marker}:END */\n`;
          await writeFile(cssPath,css);

          const audit=`import fs from 'node:fs';\nimport path from 'node:path';\nconst errors=[];\nconst RELEASE='${NEW}';\nconst authority='assets/css/homepage-two-tone-authority.css';\nconst css=fs.readFileSync(authority,'utf8');\nfor(const token of ['${marker}', 'font-size:max(.875rem,1em)!important', 'p,li,a,button,summary,label,input,textarea,select,option,small,figcaption,td,th,dt,dd,time,address,blockquote,cite', '.meta,.loc,.muted,.fineprint,.cap,.caption,.credit,.credits,.source,.sources,.reference,.references', '.label,.eyebrow,.kicker,.presence-kicker,.era-no,.period-no,.life-stage__index,.yr']) if(!css.includes(token)) errors.push('mobile floor missing '+token);\nfunction walk(dir,out=[]){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){if(['.git','.github','node_modules','reports'].includes(ent.name))continue;const p=path.join(dir,ent.name);if(ent.isDirectory())walk(p,out);else if(ent.name.endsWith('.html'))out.push(p)}return out}\nconst htmlFiles=walk('.');\nlet content=0;\nfor(const file of htmlFiles){const html=fs.readFileSync(file,'utf8');if(!/body[^>]*apple-archive/.test(html))continue;content++;const links=[...html.matchAll(/<link[^>]+href=[\"']([^\"']*homepage-two-tone-authority\.css[^\"']*)[\"'][^>]*>/gi)];if(links.length!==1)errors.push(file+' must link final typography authority exactly once');else if(!links[0][1].includes(RELEASE))errors.push(file+' authority cache key is stale');const styleImportant=[...html.matchAll(/style=[\"'][^\"']*font-size\s*:\s*(\d+(?:\.\d+)?)px\s*!important/gi)];for(const m of styleImportant){if(Number(m[1])<14)errors.push(file+' has inline !important font-size below 14px: '+m[1]+'px')}}\nif(content<80)errors.push('content page inventory unexpectedly small: '+content);\nconst pkg=JSON.parse(fs.readFileSync('package.json','utf8'));if(!pkg.scripts.test.includes('audit-mobile-typography-stage92.mjs'))errors.push('main test chain does not include Stage92');\nif(errors.length){console.error(errors.join('\\n'));process.exit(1)}\nconsole.log('Stage 92 mobile typography audit passed: '+content+' ART content pages inherit a final 14px minimum semantic reading floor on phones; inline sub-14px !important text is forbidden.');\n`;
          await writeFile('tests/audit-mobile-typography-stage92.mjs',audit);

          const pkgPath='package.json';
          const pkg=JSON.parse(await readFile(pkgPath,'utf8'));
          if(pkg.scripts.test.includes('audit-mobile-typography-stage92.mjs')) throw new Error('Stage92 already in test chain');
          pkg.scripts.test += ' && node tests/audit-mobile-typography-stage92.mjs';
          pkg.scripts['test:mobile-typography']='node tests/audit-mobile-typography-stage92.mjs';
          await writeFile(pkgPath,JSON.stringify(pkg,null,2)+'\n');

          const reviewPath='data/page-simplification-review.json';
          const review=JSON.parse(await readFile(reviewPath,'utf8'));
          review.release=NEW;
          await writeFile(reviewPath,JSON.stringify(review,null,2)+'\n');

          const designPath='data/design-release.json';
          const design=JSON.parse(await readFile(designPath,'utf8'));
          design.release=NEW;
          const hash=createHash('sha256');
          for(const dir of ['assets/css','assets/js']) for(const name of (await readdir(dir)).filter(f=>/\.(?:css|js)$/.test(f)).sort()) hash.update(await readFile(path.join(dir,name)));
          for(const name of (await readdir('assets/video')).filter(f=>f.endsWith('.mp4')).sort()) hash.update(await readFile(path.join('assets/video',name)));
          design.assetDigest=hash.digest('hex').slice(0,16);
          await writeFile(designPath,JSON.stringify(design,null,2)+'\n');
          console.log(`Stage92 applied; ${replacements} release tokens updated; digest ${design.assetDigest}`);
          NODE
      - name: Run the new typography audit before committing
        run: node tests/audit-mobile-typography-stage92.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce archive-wide mobile typography floor"
          git push origin HEAD:fix/mobile-typography-audit-20260810
