name: Apply ART stage 32 heading fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply German heading hierarchy fix
        run: node tools/apply-german-heading-stage32.mjs
      - name: Commit fix and remove one-shot migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de-at/index.html
          git rm tools/apply-german-heading-stage32.mjs .github/workflows/apply-stage32.yml
          git commit -m "fix(a11y): normalize German homepage heading hierarchy"
          git push
