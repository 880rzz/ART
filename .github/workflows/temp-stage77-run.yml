name: Temporary Stage 77 runner
on:
  push:
    paths:
      - scripts/apply-stage77-book-signatures.mjs
      - .github/workflows/temp-stage77-run.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-stage77-book-signatures.mjs
      - run: rm .github/workflows/temp-stage77-run.yml scripts/apply-stage77-book-signatures.mjs
      - run: |
          git config user.name "ART Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add distinct editorial signatures to three books"
      - run: npm test
      - run: git push
