name: One-time stage37 runtime CSS migration
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-runtime-design-stage37.mjs'
      - '.github/workflows/one-time-stage37-runtime-css-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run guarded migration
        run: |
          set +e
          node tools/migrate-runtime-design-stage37.mjs > stage37-migration.log 2>&1
          code=$?
          echo "$code" > stage37-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage37-runtime-migration-diagnostics
          path: |
            stage37-migration.log
            stage37-exit-code.txt
          retention-days: 1
      - name: Validate migration result
        run: |
          code=$(cat stage37-exit-code.txt)
          cat stage37-migration.log
          if [ "$code" != "0" ]; then exit "$code"; fi
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/responsive-header-system.js assets/css/museum-editorial.css
          git commit -m 'fix(design): move archive interface CSS out of runtime JS'
          git push
