name: One-time stage37 runtime CSS migration
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-runtime-design-stage37.mjs'
      - '.github/workflows/one-time-stage37-runtime-css-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/migrate-runtime-design-stage37.mjs
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/responsive-header-system.js assets/css/museum-editorial.css
          git commit -m 'fix(design): move archive interface CSS out of runtime JS'
          git push
