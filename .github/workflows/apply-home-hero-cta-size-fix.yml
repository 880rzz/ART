name: Apply homepage hero CTA size fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/home-hero-gallery-size-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Append fix to canonical CSS authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css_path = Path('assets/css/site.css')
          workflow_path = Path('.github/workflows/apply-home-hero-cta-size-fix.yml')
          css = css_path.read_text(encoding='utf-8')
          start = '/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */'
          end = '/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */'
          if start not in css:
              block = '''\n/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */
/* Homepage-only desktop CTA geometry. Mobile <=640px remains governed by the existing two-column/narrow-viewport authority. */
@media (min-width:641px){
  html body.apple-archive[data-archive-page="index"] header.hero .hero-cta .btn{
    box-sizing:border-box!important;
    inline-size:10.5rem!important;
    min-inline-size:10.5rem!important;
    max-inline-size:10.5rem!important;
  }
}
/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */\n'''
              anchor = '/* APPLE-RESPONSIVE-CONTRACT-V1:END */'
              if anchor not in css:
                  raise SystemExit('canonical CSS authority end marker missing')
              css = css.replace(anchor, block + '\n' + anchor, 1)
              css_path.write_text(css, encoding='utf-8')
          workflow_path.unlink(missing_ok=True)
          PY
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Equalize homepage hero CTA desktop geometry'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
