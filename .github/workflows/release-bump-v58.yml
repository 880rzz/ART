name: Apply ART v58 release cache once

on:
  push:
    paths:
      - '.github/workflows/release-bump-v58.yml'

permissions:
  contents: write

jobs:
  bump-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write v58 release token and current asset digest
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');
          const configPath='data/design-release.json';
          const config=JSON.parse(fs.readFileSync(configPath,'utf8'));
          const hash=crypto.createHash('sha256');
          for(const name of fs.readdirSync('assets/css').filter(f=>f.endsWith('.css')).sort()) hash.update(fs.readFileSync(path.join('assets/css',name)));
          for(const name of fs.readdirSync('assets/js').filter(f=>f.endsWith('.js')).sort()) hash.update(fs.readFileSync(path.join('assets/js',name)));
          for(const name of fs.readdirSync('assets/video').filter(f=>f.endsWith('.mp4')).sort()) hash.update(fs.readFileSync(path.join('assets/video',name)));
          config.release='20260808-blue-rhythm-hero-video-v58';
          config.note='Stage 46: deterministic blue section rhythm, controlled blue feature gradients, Safari-resilient hover/focus hero video, and a fresh service-worker cache generation.';
          config.assetDigest=hash.digest('hex').slice(0,16);
          fs.writeFileSync(configPath,JSON.stringify(config,null,2)+'\n');
          console.log('release',config.release,'digest',config.assetDigest);
          NODE

      - name: Apply release token to every generated page
        run: npm run bump:release

      - name: Verify complete repository audit before committing
        run: npm test

      - name: Commit generated release update
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release changes to commit.'
            exit 0
          fi
          git commit -m 'chore: publish ART blue rhythm and hero video v58'
          git push origin HEAD:main
