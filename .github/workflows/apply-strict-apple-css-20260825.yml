name: Apply strict Apple CSS remediation
on:
  push:
    paths:
      - 'tools/apply-strict-apple-css-20260825.mjs'
      - '.github/workflows/apply-strict-apple-css-20260825.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node tools/apply-strict-apple-css-20260825.mjs
      - name: Commit strict Apple CSS authority
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/css/site.css; then
            echo 'No CSS change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          git commit -m 'Apply strict Apple visual contract across ART'
          git push origin HEAD:main
