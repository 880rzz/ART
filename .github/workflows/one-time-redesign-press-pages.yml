name: One-time redesign multilingual press pages

on:
  push:
    paths:
      - '.github/workflows/one-time-redesign-press-pages.yml'
      - 'tools/one_time_redesign_press_pages.py'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild the three press pages
        run: python3 tools/one_time_redesign_press_pages.py
      - name: Remove one-time tools
        run: |
          rm -f tools/one_time_redesign_press_pages.py
          rm -f .github/workflows/one-time-redesign-press-pages.yml
          rm -f .github/workflows/one-time-inspect-press-structure.yml
      - name: Run complete archive audit
        run: npm test
      - name: Commit audited press redesign
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign press archive in all languages"
          git push
