name: ART asset token sync
on: push
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/footer-ecosystem-layout-20260813
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align all nested versioned asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for root in (Path('assets/css'), Path('assets/js')):
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix in {'.css','.js'}:
                      s=p.read_text()
                      n=s.replace('20260813-art-footer-v138','20260813-art-footer-v139')
                      if n!=s: p.write_text(n)
          PY
          node --input-type=module <<'NODE'
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const hash=createHash('sha256');
          for(const f of (await readdir('assets/css')).filter(x=>x.endsWith('.css')).sort()) hash.update(await readFile('assets/css/'+f));
          for(const f of (await readdir('assets/js')).filter(x=>x.endsWith('.js')).sort()) hash.update(await readFile('assets/js/'+f));
          for(const f of (await readdir('assets/video')).filter(x=>x.endsWith('.mp4')).sort()) hash.update(await readFile('assets/video/'+f));
          const digest=hash.digest('hex').slice(0,16);
          const cfg=JSON.parse(await readFile('data/design-release.json','utf8'));
          cfg.assetDigest=digest;
          await writeFile('data/design-release.json', JSON.stringify(cfg,null,2)+'\n');
          console.log('design digest',digest);
          NODE
          npm run bump:release
      - name: Commit asset release sync and remove helper
        shell: bash
        run: |
          git rm .github/workflows/footer-release-asset-sync-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize ART design asset release'
          git push origin HEAD:agent/footer-ecosystem-layout-20260813
