name: Restore exact ART Apple authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-art-exact-apple-authority-20260825.yml'
      - 'tools/restore-art-exact-apple-authority-20260825.mjs'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact approved Apple editorial authority
        run: node tools/restore-art-exact-apple-authority-20260825.mjs
      - name: Validate CSS authority
        run: |
          node tools/audit-clean-architecture.mjs
          node tools/audit-apple-responsive-contract.mjs
      - name: Commit exact design authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site.css
          if git diff --cached --quiet; then
            echo "Exact approved authority already present; nothing to commit."
            exit 0
          fi
          git commit -m "Restore exact approved ART Apple editorial authority"
          git push origin HEAD:main
