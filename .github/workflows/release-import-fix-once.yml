name: One-time footer release import fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-import-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-footer-release-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align footer palette import with active release
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('data/design-release.json', 'utf8'));
          const file = 'assets/css/footer-elegant.css';
          let css = fs.readFileSync(file, 'utf8');
          css = css.replace(/palette-blue-final\.css\?v=[^'\")]+/, `palette-blue-final.css?v=${config.release}`);
          fs.writeFileSync(file, css);
          NODE
      - name: Commit footer import correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/footer-elegant.css
          if git diff --cached --quiet; then
            echo 'Footer import already matched the active release.'
            exit 0
          fi
          git commit -m 'Align footer palette import with ART release'
          git push origin HEAD:main
