name: Fix ART final authority placement
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-art-final-authority-placement-20260825.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move final press contrast rule inside Apple authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/site.css')
          s=p.read_text()
          end='/* APPLE-RESPONSIVE-CONTRACT-V1:END */'
          marker='/* ART-PRESS-DESC-CONTRAST-FINAL-20260825 */'
          rule='html body.apple-archive.apple-archive.apple-archive.apple-archive.apple-archive.press-page main#main-content.press-redesign .press-record p.desc{color:#FFFFFF!important;opacity:1!important;}'
          block=marker+'\n'+rule
          if end not in s:
              raise SystemExit('Apple authority END marker missing')
          s=s.replace('\n'+block+'\n','\n').replace(block+'\n','').replace('\n'+block,'\n')
          s=s.replace(end,block+'\n'+end)
          tail=s.split(end,1)[1].strip()
          if tail:
              raise SystemExit('Rules remain after Apple authority END marker')
          p.write_text(s)
          print('Final ART press correction moved inside the single CSS authority.')
          PY
      - run: npm test
      - name: Commit authority placement correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          if git diff --cached --quiet; then
            echo 'No CSS changes.'
          else
            git commit -m 'Place ART press contrast inside final CSS authority'
            git push origin HEAD:main
          fi
