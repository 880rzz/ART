name: Replace office email with Viko email

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-office-with-viko-email.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace email everywhere
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old = 'office' + '@banhalmi.at'
          new = 'viko' + '@banhalmi.at'
          self_path = Path('.github/workflows/replace-office-with-viko-email.yml')
          changed = []
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw:
                  continue
              p = Path(raw.decode())
              if p == self_path:
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in data:
                  p.write_text(data.replace(old, new), encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              print('No replacements needed')
          else:
              print('Changed files:')
              print('\n'.join(changed))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace office email with viko@banhalmi.at'
          git push origin main
