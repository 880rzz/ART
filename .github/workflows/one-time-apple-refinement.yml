name: One-time Apple refinement release refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/apple-spacing-contact-refinement-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apple-spacing-contact-refinement-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh cache token and audit
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          digest = hashlib.sha256()
          for path in sorted(Path('assets/css').glob('*.css')):
              digest.update(path.read_bytes())
          for path in sorted(Path('assets/js').glob('*.js')):
              digest.update(path.read_bytes())

          release_path = Path('data/design-release.json')
          data = json.loads(release_path.read_text(encoding='utf-8'))
          data['release'] = '20260802-apple-v24'
          data['assetDigest'] = digest.hexdigest()[:16]
          data['note'] = 'Apple-inspired refinement: one-border professional CTA, direct homepage WhatsApp link, unbroken footer identity line, system typography and consistent cell padding.'
          release_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          npm run bump:release
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Apple refinement release"
            git push origin HEAD:agent/apple-spacing-contact-refinement-20260802
          fi

  cleanup:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove this one-time workflow
        run: |
          rm -f .github/workflows/one-time-apple-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time Apple refinement workflow [skip ci]"
            git push origin main
          fi
