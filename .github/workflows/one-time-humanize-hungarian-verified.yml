name: Verify Hungarian human language editorial pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-humanize-hungarian-verified.yml'

permissions:
  contents: write

jobs:
  verify-humanize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run editorial pass and align source data
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          src=Path('.github/workflows/one-time-humanize-hungarian.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(src) if "python3 <<'PY'" in l)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='PY')
          code='\n'.join((l[10:] if l.startswith('          ') else l) for l in src[start:end])+'\n'
          Path('/tmp/humanize_hu.py').write_text(code,encoding='utf-8')
          PY
          python3 /tmp/humanize_hu.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('hu/exhibitions/euforia.html')
          p.write_text(p.read_text(encoding='utf-8').replace('Mit tanított a kép utóélete','A kép további története'),encoding='utf-8')
          p=Path('data/archive/home-copy.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['pages']['hu/index.html']['heroSub']='Bánhalmi Norbert fotográfiai életműve · portrék, könyvek, kiállítások és emberi történetek 1999 óta'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Remove one-time workflows
        run: rm .github/workflows/one-time-humanize-hungarian.yml .github/workflows/one-time-humanize-hungarian-retry.yml .github/workflows/one-time-humanize-hungarian-final.yml .github/workflows/one-time-humanize-hungarian-verified.yml
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run full repository audit
        run: npm test
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hu data/archive/home-copy.json package-lock.json .github/workflows/one-time-humanize-hungarian.yml .github/workflows/one-time-humanize-hungarian-retry.yml .github/workflows/one-time-humanize-hungarian-final.yml .github/workflows/one-time-humanize-hungarian-verified.yml
          git diff --cached --quiet && exit 0
          git commit -m "Humanize and unify Hungarian editorial voice"
          git push
