name: One-shot ART Stage150 Press surfaces

on:
  push:
    branches: [fix/final-curatorial-footer-menu-20260815]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-curatorial-footer-menu-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/one-shot-stage150-press-surface.mjs
      - run: npm test
      - name: Commit and self-clean
        run: |
          set -euo pipefail
          rm tools/one-shot-stage150-press-surface.mjs
          rm .github/workflows/one-shot-stage150-press-surface.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          git add -u tools/one-shot-stage150-press-surface.mjs .github/workflows/one-shot-stage150-press-surface.yml
          git commit -m 'Normalize nested Press surfaces to approved blue palette'
          git push origin HEAD:fix/final-curatorial-footer-menu-20260815
