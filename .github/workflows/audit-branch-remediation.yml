name: Audit branch remediation

on:
  push:
    branches: [agent/full-10-10-audit-20260816]

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[audit-remediated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-10-10-audit-20260816
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Normalize proven audit defects
        run: node tools/remediate-audit-branch-20260816.mjs
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No remediation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize audited routes and homepage critical path [audit-remediated]'
          git push origin HEAD:agent/full-10-10-audit-20260816
