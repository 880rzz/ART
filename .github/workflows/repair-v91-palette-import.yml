name: Repair v91 palette import

on:
  push:
    branches:
      - fix/mobile-footer-readability-20260810
    paths:
      - .github/workflows/repair-v91-palette-import.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-footer-readability-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align nested palette cache key and design digest
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const footerPath='assets/css/footer-elegant.css';
          let footer=await readFile(footerPath,'utf8');
          footer=footer.replace('palette-blue-final.css?v=20260810-chronology-surface-v90','palette-blue-final.css?v=20260810-mobile-readability-v91');
          await writeFile(footerPath,footer);
          const hash=createHash('sha256');
          for(const name of (await readdir('assets/css')).filter(f=>f.endsWith('.css')).sort()) hash.update(await readFile(path.join('assets/css',name)));
          for(const name of (await readdir('assets/js')).filter(f=>f.endsWith('.js')).sort()) hash.update(await readFile(path.join('assets/js',name)));
          for(const name of (await readdir('assets/video')).filter(f=>f.endsWith('.mp4')).sort()) hash.update(await readFile(path.join('assets/video',name)));
          const digest=hash.digest('hex').slice(0,16);
          const config=JSON.parse(await readFile('data/design-release.json','utf8'));
          config.assetDigest=digest;
          await writeFile('data/design-release.json',JSON.stringify(config,null,2)+'\n');
          console.log(`Updated design digest to ${digest}`);
          NODE
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/footer-elegant.css data/design-release.json
          git commit -m "fix: align v91 palette cache key and digest"
          git push origin HEAD:fix/mobile-footer-readability-20260810
