name: Apply ART PageSpeed stage 31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pagespeed-stage31.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source migration
        run: node tools/apply-pagespeed-stage31.mjs
      - name: Apply release key to HTML
        run: npm run bump:release
      - name: Remove one-time migration files
        run: git rm .github/workflows/apply-pagespeed-stage31.yml tools/apply-pagespeed-stage31.mjs
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BANHALMI ART PageSpeed migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): close ART PageSpeed accessibility gaps'
          git push origin HEAD:main
