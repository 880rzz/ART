name: Stage96 apply human editorial + Apple resilience

on:
  push:
    branches: [fix/human-editorial-apple-audit-20260810]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-editorial-apple-audit-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply human editorial and design migration
        run: |
          python3 tools/apply-stage96-fixed.py
          python3 tools/stage96-postfix.py
          npm run bump:release
      - name: Remove temporary migration machinery before audit
        run: |
          rm -f tools/apply-stage96.py
          rm -f tools/apply-stage96-fixed.py
          rm -f tools/stage96-postfix.py
          rm -f .github/workflows/stage96-apply-one-shot.yml
          rm -f .github/workflows/stage96-human-design-scan.yml
      - name: Run complete audit on final tree
        run: npm test
      - name: Commit verified Stage96 migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Stage96 human editorial and Apple design audit"
          git push origin HEAD:fix/human-editorial-apple-audit-20260810
