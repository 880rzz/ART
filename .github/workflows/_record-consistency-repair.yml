name: Isolated record consistency repair
on:
  push:
    branches: [remediate/art-visible-sources-hu-en-de-20261006]
    paths: [.github/workflows/_record-consistency-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == '880rzz/ART' && github.ref == 'refs/heads/remediate/art-visible-sources-hu-en-de-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply locally reproduced and audited record corrections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'b61976ddd61791c51159b0fb0146a2d61fcd1a18'
          python3 tools/maintenance/repair-records-20261006.py
          python3 tools/audit_record_depth.py
          git rm .github/workflows/_record-consistency-repair.yml tools/maintenance/repair-records-20261006.py tools/maintenance/record-summary-edits-20261006.json tools/maintenance/record-audit-extension-20261006.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books exhibitions hu/books hu/exhibitions de-at/books de-at/exhibitions archive-record-registry.json sitemap.xml tools/audit_record_depth.py docs/record-period-consistency-20261006.json
          git commit -m 'Reconcile 36 period assignments, complete 21 summaries and repair 69 machine fragments'
          npm test
          SITEMAP_VERIFY_GIT_HISTORY=1 node tests/audit-sitemap-freshness-stage33.mjs
          git push origin HEAD:refs/heads/remediate/art-visible-sources-hu-en-de-20261006
          mkdir -p /tmp/record-proof
          git rev-parse HEAD > /tmp/record-proof/source-sha.txt
          git diff b61976ddd61791c51159b0fb0146a2d61fcd1a18 HEAD --stat > /tmp/record-proof/change-stat.txt
          git archive HEAD | gzip -1 > /tmp/record-proof/source.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repaired-record-source
          path: /tmp/record-proof
          if-no-files-found: warn
          retention-days: 7
