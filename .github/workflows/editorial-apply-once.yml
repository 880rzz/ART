name: Apply reviewed editorial changes on isolated branch
on:
  push:
    branches: [remediate/art-full-editorial-sources-20261006]
    paths: [tools/editorial-once/ready.json]
permissions:
  contents: write
concurrency:
  group: art-reviewed-editorial-application
  cancel-in-progress: false
jobs:
  apply-reviewed-source:
    if: github.ref == 'refs/heads/remediate/art-full-editorial-sources-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: remediate/art-full-editorial-sources-20261006
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply only the reviewed editorial source changes
        env:
          EXPECTED_BRANCH_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BRANCH_HEAD"
          python -m pip install --disable-pip-version-check beautifulsoup4==4.13.5
          python tools/editorial-once/apply_reviewed.py
          git diff --check
          git config user.name 'BANHALMI Editorial Maintenance'
          git config user.email '107166660+880rzz@users.noreply.github.com'
          git add -A
          git commit -m 'Restore human-readable ART sources and multilingual editorial clarity'
          SITEMAP_VERIFY_GIT_HISTORY=1 npm test
          node tools/audit-single-public-phone.mjs
          test "$(git ls-remote origin refs/heads/remediate/art-full-editorial-sources-20261006 | cut -f1)" = "$EXPECTED_BRANCH_HEAD"
          git push origin HEAD:refs/heads/remediate/art-full-editorial-sources-20261006
