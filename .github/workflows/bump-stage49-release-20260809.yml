name: Bump ART stage49 release 20260809

on:
  push:
    branches:
      - fix/seo-geo-entity-consistency-20260809
    paths:
      - data/design-release.json
      - .github/workflows/bump-stage49-release-20260809.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-geo-entity-consistency-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Propagate release token
        run: npm run bump:release
      - name: Verify stage49
        run: node tests/audit-seo-geo-entity-stage49.mjs
      - name: Commit release propagation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: propagate ART stage49 release token"
          git push origin HEAD:fix/seo-geo-entity-consistency-20260809
