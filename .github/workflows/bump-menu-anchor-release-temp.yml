name: Temporary menu anchor release bump

on:
  push:
    branches:
      - fix/art-menu-anchor-integrity-20260811

permissions:
  contents: write

jobs:
  bump-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/art-menu-anchor-integrity-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update release metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'data/design-release.json';
          const data = JSON.parse(await readFile(path, 'utf8'));
          data.release = '20260811-menu-anchor-v115';
          data.note = 'Stage 115 removes the exhibition catalogue dropdown from ART navigation in every viewport and adds full internal fragment-target integrity auditing across EN, HU and DE.';
          data.assetDigest = 'b11710319bc8a6dc';
          data.updated = '2026-08-11';
          await writeFile(path, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Apply cache key across all HTML
        run: npm run bump:release
      - name: Commit generated release bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/design-release.json '*.html' 'hu/**/*.html' 'de-at/**/*.html' '**/*.html'
          git commit -m 'Bump ART menu anchor release cache' || exit 0
          git push origin HEAD:fix/art-menu-anchor-integrity-20260811
