name: Temporary Stage 84 curatorial simplification
on:
  push:
    branches: [fix/art-stage84-curatorial-density]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-stage84-curatorial-disclosures.mjs
      - run: rm .github/workflows/temp-stage84-curatorial.yml tools/apply-stage84-curatorial-disclosures.mjs
      - run: |
          git config user.name "BANHALMI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: simplify curatorial research density"
      - run: npm test
      - run: git push
