name: Sync page review v119
on:
  push:
    branches: [fix/nav-books-typography-20260811]
    paths: ['.github/workflows/sync-page-review-v119.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-books-typography-20260811
      - name: Sync review release token only
        shell: bash
        run: |
          set -euo pipefail
          sed -i '0,/"release": "20260811-menu-anchor-v117"/s//"release": "20260811-menu-books-v119"/' data/page-simplification-review.json
          node -e "const d=require('./data/page-simplification-review.json'); if(d.total!==84 || !Array.isArray(d.pages) || d.pages.length!==84) { throw new Error('page review inventory changed unexpectedly') }"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/page-simplification-review.json
          git commit -m 'Sync page simplification review release token'
          git push origin HEAD:fix/nav-books-typography-20260811
