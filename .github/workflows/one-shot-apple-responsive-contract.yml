name: One-shot Apple responsive contract

on:
  push:
    branches:
      - design/apple-responsive-contract-20260814
    paths:
      - .github/workflows/one-shot-apple-responsive-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/apple-responsive-contract-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply and verify final responsive design authority
        run: |
          python - <<'PY'
          from pathlib import Path
          site=Path('assets/css/site.css')
          fragment=Path('tools/apple-responsive-contract.css').read_text(encoding='utf-8').strip()
          css=site.read_text(encoding='utf-8')
          marker='/* APPLE-RESPONSIVE-CONTRACT-V1:START */'
          if marker in css:
              css=css[:css.rfind(marker)].rstrip()
          site.write_text(css+'\n\n'+fragment+'\n',encoding='utf-8')
          PY
          rm tools/apple-responsive-contract.css
          npm test
          git diff --check
      - name: Commit final responsive authority and remove helper workflow
        run: |
          rm .github/workflows/one-shot-apple-responsive-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply strict Apple responsive design contract'
          git push origin HEAD:design/apple-responsive-contract-20260814
