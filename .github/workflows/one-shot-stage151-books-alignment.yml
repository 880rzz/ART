name: One-shot ART Stage151 books alignment
on:
  push:
    branches:
      - fix/final-curatorial-footer-menu-20260815
    paths:
      - 'tools/one-shot-stage151-books-alignment.mjs'
      - '.github/workflows/one-shot-stage151-books-alignment.yml'
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-curatorial-footer-menu-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/one-shot-stage151-books-alignment.mjs
      - run: npm test
      - name: Commit and self-clean
        run: |
          rm tools/one-shot-stage151-books-alignment.mjs .github/workflows/one-shot-stage151-books-alignment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css tools/one-shot-stage151-books-alignment.mjs .github/workflows/one-shot-stage151-books-alignment.yml
          git commit -m 'Align homepage book cards to one baseline'
          git push
