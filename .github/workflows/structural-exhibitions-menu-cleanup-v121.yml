name: Structural Exhibitions menu cleanup v121

on:
  push:
    branches: [fix/nav-exhibitions-structural-cleanup-20260811]
    paths:
      - '.github/workflows/structural-exhibitions-menu-cleanup-v121.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-exhibitions-structural-cleanup-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove legacy Exhibitions disclosures and lock menu structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          skip = {'.git', 'node_modules'}
          pattern = re.compile(
              r'(<a class="m-main"[^>]*data-nav-role="exhibitions"[^>]*>.*?</a><p class="m-desc">.*?</p>)'
              r'<details><summary>(?:All exhibitions|Összes kiállítás|Alle Ausstellungen)</summary><div class="sub">.*?</div></details>',
              re.S,
          )
          removals = 0
          for path in root.rglob('*.html'):
              if any(part in skip for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(r'\1', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  removals += count

          if removals < 87:
              raise SystemExit(f'Expected Exhibitions disclosure removal on at least 87 menu pages, got {removals}')

          leftovers = []
          for path in root.rglob('*.html'):
              if any(part in skip for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if re.search(r'<summary>(?:All exhibitions|Összes kiállítás|Alle Ausstellungen)</summary>', text):
                  leftovers.append(path.as_posix())
          if leftovers:
              raise SystemExit('Legacy Exhibitions summaries remain: ' + ', '.join(leftovers[:10]))

          css_path = root / 'assets/css/final-layout-fixes.css'
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(
              r'/\* Exhibitions remains a single navigation destination in every viewport\.\n\s*Books has no disclosure markup at all: it is a plain destination link\. \*/\nbody\.apple-archive #menu \.m-main\[data-nav-role="exhibitions"\] \+ \.m-desc \+ details:not\(\.svc\)\{\n\s*display:none!important;\n\}\n\n',
              '/* Books and Exhibitions are plain menu destinations; no catalogue disclosure markup remains. */\n',
              css,
              count=1,
          )
          if 'data-nav-role="exhibitions"] + .m-desc + details' in css:
              raise SystemExit('Exhibitions CSS disclosure fallback still remains')
          css_path.write_text(css, encoding='utf-8')

          test_path = root / 'tests/audit-exhibitions-menu-structure-stage121.mjs'
          test_path.write_text(r'''/* Stage 121: Exhibitions is a plain destination, never a catalogue disclosure. */
          import { readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';
          const root = path.resolve(import.meta.dirname, '..');
          const skip = new Set(['.git','node_modules','.github','data']);
          const files=[];
          async function walk(dir){for(const e of await readdir(dir,{withFileTypes:true})){if(skip.has(e.name))continue;const f=path.join(dir,e.name);if(e.isDirectory())await walk(f);else if(e.name.endsWith('.html'))files.push(f);}}
          await walk(root);
          const failures=[]; let menuPages=0; const counts={en:0,hu:0,de:0};
          for(const file of files){const html=await readFile(file,'utf8');if(!/id=["']menu["']/i.test(html))continue;menuPages++;const lang=(html.match(/<html\b[^>]*lang=["']([^"']+)/i)?.[1]||'en').toLowerCase();if(lang.startsWith('hu'))counts.hu++;else if(lang.startsWith('de'))counts.de++;else counts.en++;if(/<summary>(?:All exhibitions|Összes kiállítás|Alle Ausstellungen)<\/summary>/i.test(html))failures.push(`${path.relative(root,file)} still contains an Exhibitions disclosure`);if(!/<a class="m-main"[^>]*data-nav-role="exhibitions"[^>]*>[^<]+<\/a><p class="m-desc">/i.test(html))failures.push(`${path.relative(root,file)} has no plain Exhibitions destination followed by description`);}
          if(menuPages<87)failures.push(`Only ${menuPages} menu pages audited`);for(const [lang,count] of Object.entries(counts))if(count<20)failures.push(`${lang} coverage low: ${count}`);
          const css=await readFile(path.join(root,'assets/css/final-layout-fixes.css'),'utf8');if(css.includes('data-nav-role="exhibitions"] + .m-desc + details'))failures.push('CSS still hides an Exhibitions disclosure instead of removing markup');
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}console.log(`Stage 121 Exhibitions menu audit passed: ${menuPages} EN/HU/DE menus contain no exhibition catalogue disclosure.`);
          ''',encoding='utf-8')

          pkg_path=root/'package.json'; pkg=json.loads(pkg_path.read_text(encoding='utf-8')); gate='node tests/audit-exhibitions-menu-structure-stage121.mjs';
          if gate not in pkg['scripts']['test']: pkg['scripts']['test'] += ' && ' + gate
          pkg['scripts']['test:exhibitions-menu-structure']=gate
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for data_path in [root/'data/design-release.json',root/'data/page-simplification-review.json']:
              data=json.loads(data_path.read_text(encoding='utf-8')); data['release']='20260811-menu-structure-v121'
              if data_path.name=='design-release.json':
                  data['note']='Stage 121 removes the legacy Exhibitions disclosure markup from every multilingual menu; Books and Exhibitions are now structurally plain destinations.'; data['updated']='2026-08-11'
              data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'Removed {removals} legacy Exhibitions disclosures')
          PY

          old='20260811-menu-structure-v120'; new='20260811-menu-structure-v121'
          grep -rl --fixed-strings "$old" assets/css assets/js | xargs -r sed -i "s/$old/$new/g"
          npm run bump:release
          node --input-type=module <<'NODE'
          import {readFile,writeFile,readdir} from 'node:fs/promises'; import {createHash} from 'node:crypto'; import path from 'node:path';
          const root=process.cwd(),h=createHash('sha256');
          for(const n of (await readdir(path.join(root,'assets/css'))).filter(f=>f.endsWith('.css')).sort())h.update(await readFile(path.join(root,'assets/css',n)));
          for(const n of (await readdir(path.join(root,'assets/js'))).filter(f=>f.endsWith('.js')).sort())h.update(await readFile(path.join(root,'assets/js',n)));
          for(const n of (await readdir(path.join(root,'assets/video'))).filter(f=>f.endsWith('.mp4')).sort())h.update(await readFile(path.join(root,'assets/video',n)));
          const p=path.join(root,'data/design-release.json'),d=JSON.parse(await readFile(p,'utf8'));d.assetDigest=h.digest('hex').slice(0,16);await writeFile(p,JSON.stringify(d,null,2)+'\n');console.log(`assetDigest=${d.assetDigest}`);
          NODE

          rm .github/workflows/structural-exhibitions-menu-cleanup-v121.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Exhibitions dropdown markup permanently'
          npm test
          git push origin HEAD:fix/nav-exhibitions-structural-cleanup-20260811
