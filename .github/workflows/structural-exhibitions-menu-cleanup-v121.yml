name: Structural Exhibitions menu cleanup v121

on:
  push:
    branches:
      - fix/nav-exhibitions-structural-cleanup-20260811
    paths:
      - '.github/workflows/structural-exhibitions-menu-cleanup-v121.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-exhibitions-structural-cleanup-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply structural cleanup
        run: node scripts/structural-exhibitions-cleanup-v121.mjs
      - name: Refresh release cache
        run: |
          sed -i 's/20260811-menu-structure-v120/20260811-menu-structure-v121/g' assets/css/*.css assets/js/*.js || true
          npm run bump:release
      - name: Recalculate asset digest
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const root=process.cwd(),h=createHash('sha256');
          for(const dir of ['assets/css','assets/js','assets/video']){
            for(const n of (await readdir(path.join(root,dir))).sort()){
              if(!/\.(css|js|mp4)$/.test(n)) continue;
              h.update(await readFile(path.join(root,dir,n)));
            }
          }
          const p=path.join(root,'data/design-release.json');
          const d=JSON.parse(await readFile(p,'utf8'));
          d.assetDigest=h.digest('hex').slice(0,16);
          await writeFile(p,JSON.stringify(d,null,2)+'\n');
          NODE
      - name: Commit locally before full audit
        run: |
          rm .github/workflows/structural-exhibitions-menu-cleanup-v121.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Exhibitions dropdown markup permanently'
      - name: Run complete audit
        run: npm test
      - name: Push verified cleanup
        run: git push origin HEAD:fix/nav-exhibitions-structural-cleanup-20260811
