name: Desktop browser regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source contract audits
        run: npm test
      - name: Prepare production-like Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site artifacts/browser-layout artifacts/lighthouse-desktop
          mkdir -p _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.3.0'
          python scripts/generate-responsive-gallery.py _site
          node scripts/optimize-pages-artifact.mjs _site
      - name: Install Chromium browser audit runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exhaustive six-width block, control and contrast audit
        run: |
          set -euo pipefail
          node tools/perf-static-server.mjs _site 4173 > /tmp/art-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-browser-layout.mjs
          kill $SERVER_PID || true
          trap - EXIT
      - name: Run desktop Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.desktop.cjs
      - name: Upload desktop QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-regression-${{ github.sha }}
          path: |
            artifacts/browser-layout
            artifacts/lighthouse-desktop
          if-no-files-found: warn
          retention-days: 14
