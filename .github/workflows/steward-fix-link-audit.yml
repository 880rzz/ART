name: Steward fix link audit request

on:
  push:
    branches:
      - steward/canonical-legal-brand-fix-20260910

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[link-audit-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: steward/canonical-legal-brand-fix-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node tools/fix-link-audit-user-agent.mjs
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BANHALMI Steward"
          git config user.email "actions@users.noreply.github.com"
          git add tests/audit-seo-network.mjs
          git commit -m "Use browser-compatible user agent in live link audit [link-audit-fixed]"
          git push origin HEAD:steward/canonical-legal-brand-fix-20260910
