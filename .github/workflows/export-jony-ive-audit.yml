name: Export repository for Jony Ive audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create code and content archive
        run: |
          zip -qr ART-jony-ive-audit.zip . \
            -x '.git/*' 'node_modules/*' 'ART-jony-ive-audit.zip' \
               'assets/img/*' 'assets/video/*' '*.webp' '*.avif' '*.jpg' '*.jpeg' '*.png' '*.gif' '*.mp4'
      - uses: actions/upload-artifact@v4
        with:
          name: ART-jony-ive-audit
          path: ART-jony-ive-audit.zip
          if-no-files-found: error
