name: Full ART audit fixes

on:
  push:
    branches:
      - agent/full-cross-site-audit-fixes

permissions:
  contents: write

jobs:
  fix-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-cross-site-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply multilingual audit fixes
        run: node scripts/fix-cross-site-audit.mjs
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply complete multilingual ART audit fixes [skip ci]"
            git push
          fi
      - name: Run complete audit suite
        run: npm test && npm run test:archive-hu && npm run test:copy && npm run test:coverage
