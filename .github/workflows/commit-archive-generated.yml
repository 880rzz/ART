name: Commit archive generated state

on:
  push:
    branches:
      - ci/verify-archive-audit
    paths:
      - '.github/workflows/commit-archive-generated.yml'

permissions:
  contents: write

jobs:
  commit-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-archive-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Hungarian archive state
        run: npm run integrate:hu-archive
      - name: Commit exact generated files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            hu/books/book-anovilaga.html
            hu/books/book-ebredes.html
            hu/books/book-szosszenetek.html
            hu/exhibitions/anovilaga.html
            hu/exhibitions/ebredes.html
            hu/exhibitions/euforia.html
            hu/index.html
            hu/works/magyar-peter-portre-2026.html
            press-knowledge-graph.hu.jsonld
            sitemap.xml
          )
          git add -- "${files[@]}"
          unexpected="$(git diff --name-only -- . "${files[@]/#/:!}" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Generated state already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit verified Hungarian archive generated state"
          git push origin HEAD:ci/verify-archive-audit
