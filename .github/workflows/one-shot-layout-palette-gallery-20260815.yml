name: One-shot ART visual consistency remediation

on:
  push:
    branches:
      - fix/layout-palette-gallery-audit-20260815

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/layout-palette-gallery-audit-20260815
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply visual consistency remediation
        run: node tools/one-shot-layout-palette-gallery-20260815.mjs
      - name: Run source audits
        run: npm test
      - name: Commit consolidated remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify ART palette, spacing, footer and exhibition galleries"
          git push origin HEAD:fix/layout-palette-gallery-audit-20260815
