name: Temporary release cache bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-bump-temp.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply release cache token
        run: npm run bump:release
      - name: Remove temporary workflow and commit generated release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-bump-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Apply ART visual stability release cache"
          git push origin HEAD:main
