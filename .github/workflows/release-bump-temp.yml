name: Temporary runtime cache synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-bump-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize runtime asset URLs and release digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/responsive-header-system.js')
          s = p.read_text()
          s = s.replace('20260812-gallery-shell-spacing-v133', '20260812-art-visual-stability-v135')
          s = s.replace('20260812-art-visual-stability-v134', '20260812-art-visual-stability-v135')
          p.write_text(s)
          PY
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const hash = createHash('sha256');
          for (const dir of ['assets/css','assets/js','assets/video']) {
            const ext = dir.endsWith('video') ? '.mp4' : dir.endsWith('js') ? '.js' : '.css';
            for (const file of (await readdir(dir)).filter(f => f.endsWith(ext)).sort()) {
              hash.update(await readFile(`${dir}/${file}`));
            }
          }
          const digest = hash.digest('hex').slice(0,16);
          const path = 'data/design-release.json';
          const config = JSON.parse(await readFile(path,'utf8'));
          config.release = '20260812-art-visual-stability-v135';
          config.note = 'Stage 135 finalizes the ART visual-stability fix and synchronizes every runtime-loaded CSS URL with the same cache-busted release token.';
          config.assetDigest = digest;
          config.updated = '2026-08-12';
          await writeFile(path, JSON.stringify(config,null,2) + '\n');
          console.log(`Computed release digest ${digest}`);
          NODE
          npm run bump:release
      - name: Remove temporary workflow and commit synchronized release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-bump-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply ART visual stability release v135"
          git push origin HEAD:main
