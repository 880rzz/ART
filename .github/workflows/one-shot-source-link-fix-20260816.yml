name: One-shot source link remediation 2026-08-16

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'agent/full-10-10-audit-20260816'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-10-10-audit-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fix deterministic stale external URLs in static HTML
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files=[];
          const walk=(dir='.')=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){if(['.git','node_modules','_site','artifacts'].includes(e.name))continue;const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.name.endsWith('.html'))files.push(p)}};
          walk();
          let languageFixes=0, offlineSourceFixes=0, changedFiles=0;
          for(const file of files){
            let html=fs.readFileSync(file,'utf8');
            const before=html;
            const oldLang='https://blog.banhalmi.art/lang=en-GB';
            const langMatches=html.split(oldLang).length-1;
            if(langMatches){html=html.split(oldLang).join('https://blog.banhalmi.art/?lang=en-GB');languageFixes+=langMatches;}
            html=html.replace(/<a\b([^>]*?)\bhref=["'](https:\/\/mindennapkonyv\.hu[^"']*)["']([^>]*)>([\s\S]*?)<\/a>/gi,(_m,_a,url,_b,body)=>{offlineSourceFixes+=1;return `<span class="archived-source-offline" data-source-url="${url}" title="Original cited source is currently offline">${body}</span>`;});
            if(html!==before){fs.writeFileSync(file,html);changedFiles+=1;}
          }
          console.log(`Static link remediation: ${changedFiles} files; ${languageFixes} English blog URL fixes; ${offlineSourceFixes} offline-source anchors converted to provenance-only records.`);
          if(languageFixes < 20) throw new Error(`Expected at least 20 stale English blog links, found ${languageFixes}.`);
          if(offlineSourceFixes < 3) throw new Error(`Expected at least 3 mindennapkonyv anchors, found ${offlineSourceFixes}.`);
          NODE
      - name: Verify source contracts and live external links
        shell: bash
        env:
          LIVE_AUDIT: '1'
        run: |
          npm test
          node tests/audit-seo-network.mjs
      - name: Remove this one-shot workflow and commit source remediation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-source-link-fix-20260816.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix stale external links and retire one-shot remediator'
          git push origin HEAD:agent/full-10-10-audit-20260816
