name: One-shot align ART Pages CSS authority

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-align-pages-css-authority.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align Pages contract to canonical CSS authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pages.yml')
          s = p.read_text(encoding='utf-8')
          old = 'assets/css/museum-editorial.css'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale CSS references, found {count}')
          s = s.replace(old, 'assets/css/site.css')
          p.write_text(s, encoding='utf-8')
          PY
          npm test
          grep -Fq 'assets/css/site.css' .github/workflows/pages.yml
          ! grep -Fq 'assets/css/museum-editorial.css' .github/workflows/pages.yml
      - name: Commit clean Pages contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml
          git rm .github/workflows/one-shot-align-pages-css-authority.yml
          git diff --cached --check
          git commit -m 'Align ART Pages with canonical CSS authority'
          git push origin HEAD:main
