name: One-time final ART audit bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  run-on-feature-branch:
    if: github.head_ref == 'agent/final-ecosystem-audit-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-ecosystem-audit-20260802
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final information architecture and design hardening
        working-directory: work
        run: |
          node scripts/_apply-final-ecosystem-audit.mjs
          node scripts/_patch-journey-localization.mjs
      - name: Apply release token
        working-directory: work
        run: npm run bump:release
      - name: Run complete ART audit suite
        working-directory: work
        run: npm test
      - name: Commit only audited source and regression tests
        working-directory: work
        run: |
          git rm scripts/_apply-final-ecosystem-audit.mjs scripts/_patch-journey-localization.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Harden archive IA, chronology and Person routing"
          git push origin agent/final-ecosystem-audit-20260802
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: cleanup
      - name: Remove this one-time bootstrap from main
        working-directory: cleanup
        run: |
          git pull --rebase origin main
          git rm .github/workflows/_bootstrap-final-art-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time ART audit bootstrap [skip ci]"
          git push origin main
