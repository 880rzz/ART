name: One-time English and German human voice audit

on:
  push:
    paths:
      - '.github/workflows/one-time-human-voice-audit-en-de.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate human voice audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'script','style','noscript','svg'}:
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'script','style','noscript','svg'} and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      t = re.sub(r'\s+', ' ', data).strip()
                      if t:
                          self.parts.append(t)

          rules_en = {
              'abstract/institutional': [r'\borganised around\b', r'\binvestigation of presence\b', r'\bpublic reception\b', r'\bcuratorial selection\b', r'\bvisual language\b', r'\binterrogates?\b', r'\bexplores? the relationship\b', r'\bserves as\b', r'\bacts as\b'],
              'promotional/absolute': [r'\bcomplete\b', r'\bdefinitive\b', r'\bunique\b', r'\biconic\b', r'\bgroundbreaking\b', r'\bexceptional\b'],
              'AI cadence': [r'\bnot only\b.*\bbut also\b', r'\bat the intersection of\b', r'\bmore than (?:a|an)\b', r'\ba testament to\b', r'\bin an era where\b', r'\bseamlessly\b', r'\bdelve(?:s|d)? into\b'],
          }
          rules_de = {
              'abstract/institutional': [r'\bals Erforschung\b', r'\böffentliche Rezeption\b', r'\bkuratorische Auswahl\b', r'\bvisuelle Sprache\b', r'\buntersucht das Verhältnis\b', r'\bfungiert als\b', r'\bdient als\b'],
              'promotional/absolute': [r'\bvollständig(?:e|en|er|es)?\b', r'\bendgültig(?:e|en|er|es)?\b', r'\beinzigartig(?:e|en|er|es)?\b', r'\bikonisch(?:e|en|er|es)?\b', r'\bbahnbrechend(?:e|en|er|es)?\b', r'\baußergewöhnlich(?:e|en|er|es)?\b'],
              'AI cadence': [r'\bnicht nur\b.*\bsondern auch\b', r'\ban der Schnittstelle von\b', r'\bmehr als (?:ein|eine)\b', r'\bein Zeugnis für\b', r'\bin einer Zeit, in der\b', r'\bnahtlos\b', r'\btaucht tief in\b'],
          }

          def audit(prefix, rules):
              rows=[]
              files=[]
              if prefix == 'en':
                  files=[p for p in Path('.').rglob('*.html') if not any(part in {'hu','de-at','node_modules'} for part in p.parts)]
              else:
                  files=list(Path('de-at').rglob('*.html'))
              for p in sorted(files):
                  parser=VisibleText()
                  try:
                      parser.feed(p.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  text=' | '.join(parser.parts)
                  hits=[]
                  for group, pats in rules.items():
                      for pat in pats:
                          for m in re.finditer(pat, text, re.I):
                              start=max(0,m.start()-90); end=min(len(text),m.end()+140)
                              hits.append((group,re.sub(r'\s+',' ',text[start:end]).strip()))
                  long_sent=[]
                  for sentence in re.split(r'(?<=[.!?])\s+', text):
                      words=sentence.split()
                      if len(words)>=34 and len(sentence)<600:
                          long_sent.append(sentence[:360])
                  if hits or long_sent:
                      rows.append((str(p),hits,long_sent[:4]))
              return files,rows

          en_files,en_rows=audit('en',rules_en)
          de_files,de_rows=audit('de',rules_de)
          out=[]
          out.append('# English and German human-voice audit')
          out.append('')
          out.append('Generated from visible HTML copy only. SEO/schema scripts are excluded from the language findings.')
          out.append('')
          out.append(f'- English pages scanned: **{len(en_files)}**')
          out.append(f'- German pages scanned: **{len(de_files)}**')
          out.append(f'- English pages flagged: **{len(en_rows)}**')
          out.append(f'- German pages flagged: **{len(de_rows)}**')
          out.append('')
          for title,rows in [('English',en_rows),('German',de_rows)]:
              out.append(f'## {title}')
              out.append('')
              if not rows:
                  out.append('No heuristic findings.')
                  out.append('')
                  continue
              for file,hits,longs in rows:
                  out.append(f'### `{file}`')
                  seen=set()
                  for group,snip in hits:
                      key=(group,snip)
                      if key in seen: continue
                      seen.add(key)
                      out.append(f'- **{group}:** {snip}')
                  for snip in longs:
                      out.append(f'- **long sentence:** {snip}')
                  out.append('')
          Path('docs').mkdir(exist_ok=True)
          Path('docs/HUMAN_VOICE_AUDIT_EN_DE.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/one-time-human-voice-audit-en-de.yml
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit English and German human voice"
          git push