name: Temporary Stage 75 footer digest alignment

on:
  push:
    paths:
      - '.github/workflows/temp-stage75-footer-digest.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align footer import and record exact digest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/footer-elegant.css')
          t=p.read_text()
          t=t.replace('20260810-content-flow-v74','20260810-record-layout-v75')
          p.write_text(t)
          PY

          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const hash=crypto.createHash('sha256');
          for(const f of fs.readdirSync('assets/css').filter(f=>f.endsWith('.css')).sort()) hash.update(fs.readFileSync(path.join('assets/css',f)));
          for(const f of fs.readdirSync('assets/js').filter(f=>f.endsWith('.js')).sort()) hash.update(fs.readFileSync(path.join('assets/js',f)));
          for(const f of fs.readdirSync('assets/video').filter(f=>f.endsWith('.mp4')).sort()) hash.update(fs.readFileSync(path.join('assets/video',f)));
          const digest=hash.digest('hex').slice(0,16);
          const p='data/design-release.json';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.assetDigest=digest;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          console.log('Stage75 footer-aligned digest',digest);
          NODE

          rm .github/workflows/temp-stage75-footer-digest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Stage 75 footer palette import"
          git push origin HEAD:main
