name: Apply human audit migration

on:
  push:
    branches:
      - agent/human-seo-llm-blog-audit-20260802

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-seo-llm-blog-audit-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply labels and record the new asset digest
        run: node tools/apply-presence-label.mjs
      - name: Apply the release token to every HTML asset reference
        run: npm run bump:release
      - name: Run the complete audit suite
        run: npm test
      - name: Remove one-time migration files
        run: |
          rm tools/apply-presence-label.mjs
          rm .github/workflows/_apply-human-audit.yml
      - name: Commit the audited migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Apply human voice, navigation and curatorial audit"
            git push origin HEAD:agent/human-seo-llm-blog-audit-20260802
          fi
