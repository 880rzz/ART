name: Temporary PR147 CTA remediation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.number == 147 && github.event.pull_request.head.ref == 'fix/home-hero-gallery-size-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/home-hero-gallery-size-20260823
          fetch-depth: 0
      - name: Apply canonical desktop CTA geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/css/site.css')
          css = path.read_text(encoding='utf-8')
          start = '/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */'
          end = '/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */'
          anchor = '/* APPLE-RESPONSIVE-CONTRACT-V1:END */'
          if start in css or end in css:
              if start not in css or end not in css:
                  raise SystemExit('partial STAGE154 marker state')
              raise SystemExit(0)
          if anchor not in css:
              raise SystemExit('canonical CSS authority marker missing')
          block = '''/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */
/* Homepage-only desktop CTA geometry. Mobile <=640px remains governed by the existing two-column/narrow-viewport authority. */
@media (min-width:641px){
  html body.apple-archive[data-archive-page="index"] header.hero .hero-cta .btn{
    box-sizing:border-box!important;
    inline-size:10.5rem!important;
    min-inline-size:10.5rem!important;
    max-inline-size:10.5rem!important;
  }
}
/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */
'''
          path.write_text(css.replace(anchor, block + '\n' + anchor, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          git commit -m 'Equalize homepage hero CTA desktop geometry'
          git push origin HEAD:fix/home-hero-gallery-size-20260823
