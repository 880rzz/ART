name: Temporary Stage 75 token fix

on:
  push:
    paths:
      - '.github/workflows/temp-stage75-token-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace ambiguous release token and refresh cache keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          old='20260810-record-editorial-v75'
          new='20260810-record-layout-v75'
          for p in [Path('assets/js/responsive-header-system.js'), Path('tests/audit-record-editorial-stage75.mjs')]:
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'{old} missing from {p}')
              p.write_text(text.replace(old,new))
          cfg_path=Path('data/design-release.json')
          cfg=json.loads(cfg_path.read_text())
          cfg['release']=new
          cfg['assetDigest']='PENDING'
          cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          PY

          npm run bump:release

          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const hash=crypto.createHash('sha256');
          for(const f of fs.readdirSync('assets/css').filter(f=>f.endsWith('.css')).sort()) hash.update(fs.readFileSync(path.join('assets/css',f)));
          for(const f of fs.readdirSync('assets/js').filter(f=>f.endsWith('.js')).sort()) hash.update(fs.readFileSync(path.join('assets/js',f)));
          for(const f of fs.readdirSync('assets/video').filter(f=>f.endsWith('.mp4')).sort()) hash.update(fs.readFileSync(path.join('assets/video',f)));
          const digest=hash.digest('hex').slice(0,16);
          const p='data/design-release.json';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.assetDigest=digest;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          console.log('Stage75 corrected digest',digest);
          NODE

          rm .github/workflows/temp-stage75-token-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: disambiguate ART Stage 75 release token"
          git push origin HEAD:main
