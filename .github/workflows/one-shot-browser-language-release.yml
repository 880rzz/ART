name: One-shot browser language release

on:
  push:
    branches:
      - agent/browser-language-routing

permissions:
  contents: write

jobs:
  bump-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/browser-language-routing
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile release metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';

          const root = process.cwd();
          const configPath = path.join(root, 'data/design-release.json');
          const config = JSON.parse(await readFile(configPath, 'utf8'));
          const hash = createHash('sha256');

          for (const name of (await readdir(path.join(root, 'assets/css'))).filter((file) => file.endsWith('.css')).sort()) {
            hash.update(await readFile(path.join(root, 'assets/css', name)));
          }
          for (const name of (await readdir(path.join(root, 'assets/js'))).filter((file) => file.endsWith('.js')).sort()) {
            hash.update(await readFile(path.join(root, 'assets/js', name)));
          }

          config.release = '20260804-browser-language-routing-v42';
          config.note = 'Reconciled the current CSS and JavaScript digest after the latest menu and mobile-layout corrections, and prepared the multilingual homepage routing release.';
          config.assetDigest = hash.digest('hex').slice(0, 16);
          await writeFile(configPath, JSON.stringify(config, null, 2) + '\n', 'utf8');
          NODE

      - name: Apply release token to every page
        run: npm run bump:release

      - name: Remove one-shot workflow before auditing
        run: rm .github/workflows/one-shot-browser-language-release.yml

      - name: Run repository audits
        run: npm test

      - name: Commit generated release update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump ART asset release token"
          git push origin HEAD:agent/browser-language-routing
