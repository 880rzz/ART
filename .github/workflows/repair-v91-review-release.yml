name: Repair v91 review release

on:
  push:
    branches:
      - fix/mobile-footer-readability-20260810
    paths:
      - .github/workflows/repair-v91-review-release.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-footer-readability-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align page review release marker
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const file='data/page-simplification-review.json';
          const review=JSON.parse(await readFile(file,'utf8'));
          const active=JSON.parse(await readFile('data/design-release.json','utf8')).release;
          if(review.release===active) throw new Error('Review release is already aligned');
          review.release=active;
          await writeFile(file,JSON.stringify(review,null,2)+'\n');
          console.log(`Review release aligned to ${active}`);
          NODE
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/page-simplification-review.json
          git commit -m "fix: align page review with v91 release"
          git push origin HEAD:fix/mobile-footer-readability-20260810
