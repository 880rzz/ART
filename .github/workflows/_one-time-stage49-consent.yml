name: One-time Stage 49 consent personalization hardening

on:
  push:
    branches:
      - audit/strict-trust-legal-20260808

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/strict-trust-legal-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply denied personalization storage to GA consent defaults
        run: node scripts/apply-consent-personalization-stage49.mjs
      - name: Remove one-time maintenance before candidate commit
        run: |
          rm -f .github/workflows/_one-time-stage49-consent.yml
          rm -f scripts/apply-consent-personalization-stage49.mjs
      - name: Commit candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No candidate changes.'
            exit 0
          fi
          git commit -m 'compliance: deny personalization storage before consent'
          git push origin HEAD:audit/strict-trust-legal-20260808
      - name: Run full archive audit on committed candidate
        run: npm test
      - name: Verify audit kept tracked source immutable
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
