name: Temporary Stage 81 record disclosures
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-stage81-record-disclosures.mjs
      - run: node scripts/bump-editorial-release-cache.mjs
      - run: rm .github/workflows/temp-stage81-record-disclosures.yml scripts/apply-stage81-record-disclosures.mjs
      - run: |
          git config user.name "ART Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: collapse supporting archive context on record pages"
      - run: npm test
      - run: git push
