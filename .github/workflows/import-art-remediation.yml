name: Import ART remediation patch
on:
  push:
    branches:
      - remediate/art-human-curatorial-v9-20261003
    paths:
      - .patch/READY
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch/chunk_* > /tmp/art-patch.b64
          base64 -d /tmp/art-patch.b64 > /tmp/art-patch.tar.xz
          echo "f5e1e390437227259f7558ec26b11e5b651d818994f75d9eee134bbe17abee40  /tmp/art-patch.tar.xz" | sha256sum -c -
          if tar -tJf /tmp/art-patch.tar.xz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi
      - name: Apply sanitized remediation
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/art-patch.tar.xz -C .
          sed -i 's/[[:space:]]\+$//' hu/books/book-szosszenetek.html
          rm -rf .patch
          rm -f .github/workflows/import-art-remediation.yml
      - name: Critical remediation audits
        shell: bash
        run: |
          set -euo pipefail
          node tests/audit-life-journey.mjs
          node tests/audit-euforia-source-disclosure-stage83.mjs
      - name: Commit imported patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BANHALMI Ecosystem Steward"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Apply human editorial ART remediation"
          git push origin HEAD:remediate/art-human-curatorial-v9-20261003
