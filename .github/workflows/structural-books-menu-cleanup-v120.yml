name: Structural Books menu cleanup v120

on:
  push:
    branches: [fix/nav-books-structural-cleanup-20260811]
    paths:
      - '.github/workflows/structural-books-menu-cleanup-v120.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-books-structural-cleanup-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove legacy Books disclosures and lock navigation hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          skip = {'.git', 'node_modules'}
          pattern = re.compile(
              r'(<a class="m-main"(?=[^>]*href="[^"]*#books")[^>]*>.*?</a><p class="m-desc">.*?</p>)'
              r'<details><summary>(?:All books|Összes könyv|Alle Bücher)</summary><div class="sub">.*?</div></details>',
              re.S,
          )
          changed = []
          removals = 0
          for path in root.rglob('*.html'):
              if any(part in skip for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(r'\1', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  removals += count
                  changed.append(path.as_posix())

          if removals < 87:
              raise SystemExit(f'Expected Books disclosure removal on at least 87 menu pages, got {removals}')

          leftovers = []
          for path in root.rglob('*.html'):
              if any(part in skip for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if re.search(r'<summary>(?:All books|Összes könyv|Alle Bücher)</summary>', text):
                  leftovers.append(path.as_posix())
          if leftovers:
              raise SystemExit('Legacy Books summaries remain: ' + ', '.join(leftovers[:10]))

          css_path = root / 'assets/css/final-layout-fixes.css'
          css = css_path.read_text(encoding='utf-8')
          old = '''/* Exhibitions and Books are single navigation destinations in every viewport.
             Their legacy catalogue disclosures remain in archival HTML for source history,
             but must never render as desktop or mobile menu dropdowns. */
          body.apple-archive #menu .m-main[data-nav-role="exhibitions"] + .m-desc + details:not(.svc),
          body.apple-archive #menu .m-main[data-nav-role="books"] + .m-desc + details:not(.svc){
            display:none!important;
          }'''
          new = '''/* Exhibitions remains a single navigation destination in every viewport.
             Books has no disclosure markup at all: it is a plain destination link. */
          body.apple-archive #menu .m-main[data-nav-role="exhibitions"] + .m-desc + details:not(.svc){
            display:none!important;
          }'''
          if old not in css:
              raise SystemExit('Expected legacy Exhibitions/Books CSS guard not found')
          css = css.replace(old, new)
          css_path.write_text(css, encoding='utf-8')

          test_path = root / 'tests/audit-books-menu-structure-stage120.mjs'
          test_path.write_text(r'''/* Stage 120: Books is a plain destination, never a disclosure, and menu titles outrank descriptions. */
          import { readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';

          const root = path.resolve(import.meta.dirname, '..');
          const skip = new Set(['.git', 'node_modules', '.github', 'data']);
          const files = [];
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              if (skip.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) await walk(full);
              else if (entry.name.endsWith('.html')) files.push(full);
            }
          }
          await walk(root);

          const failures = [];
          const counts = { en: 0, hu: 0, de: 0 };
          let menuPages = 0;
          for (const file of files) {
            const html = await readFile(file, 'utf8');
            if (!/id=["']menu["']/i.test(html)) continue;
            menuPages += 1;
            const lang = (html.match(/<html\b[^>]*lang=["']([^"']+)/i)?.[1] || 'en').toLowerCase();
            if (lang.startsWith('hu')) counts.hu += 1;
            else if (lang.startsWith('de')) counts.de += 1;
            else counts.en += 1;
            if (/<summary>(?:All books|Összes könyv|Alle Bücher)<\/summary>/i.test(html)) {
              failures.push(`${path.relative(root, file)} still contains a Books disclosure`);
            }
            if (!/<a class="m-main"[^>]*href="[^"]*#books"[^>]*>(?:Books|Könyvek|Bücher)<\/a><p class="m-desc">/i.test(html)) {
              failures.push(`${path.relative(root, file)} has no plain Books destination followed by its description`);
            }
          }
          if (menuPages < 87) failures.push(`Only ${menuPages} menu pages were audited; expected at least 87`);
          for (const [lang, count] of Object.entries(counts)) if (count < 20) failures.push(`${lang} menu coverage is unexpectedly low: ${count}`);

          const css = await readFile(path.join(root, 'assets/css/final-layout-fixes.css'), 'utf8');
          if (css.includes('data-nav-role="books"')) failures.push('CSS still contains a Books disclosure fallback selector');
          if (!/body\.apple-archive #menu \.m-main\{[\s\S]*?font-size:clamp\(1\.12rem,[\s\S]*?1\.48rem\)!important;/m.test(css)) failures.push('Global menu-title hierarchy guard is missing');
          if (!/body\.apple-archive #menu \.m-desc\{[\s\S]*?font-size:clamp\(\.76rem,[\s\S]*?\.86rem\)!important;/m.test(css)) failures.push('Global menu-description hierarchy guard is missing');

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Stage 120 Books menu audit passed: ${menuPages} EN/HU/DE menu pages use a plain Books destination with no disclosure; title/description hierarchy remains guarded.`);
          ''', encoding='utf-8')

          pkg_path = root / 'package.json'
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          gate = 'node tests/audit-books-menu-structure-stage120.mjs'
          if gate not in pkg['scripts']['test']:
              pkg['scripts']['test'] += ' && ' + gate
          pkg['scripts']['test:books-menu-structure'] = gate
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for data_path in [root/'data/design-release.json', root/'data/page-simplification-review.json']:
              data = json.loads(data_path.read_text(encoding='utf-8'))
              data['release'] = '20260811-menu-structure-v120'
              if data_path.name == 'design-release.json':
                  data['note'] = 'Stage 120 removes the legacy Books disclosure markup from every multilingual menu and permanently guards the title-over-description hierarchy.'
                  data['updated'] = '2026-08-11'
              data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'Removed {removals} legacy Books disclosures from {len(changed)} HTML files')
          PY

          old='20260811-menu-books-v119'
          new='20260811-menu-structure-v120'
          grep -rl --fixed-strings "$old" assets/css assets/js | xargs -r sed -i "s/$old/$new/g"
          npm run bump:release

          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const root = process.cwd();
          const hash = createHash('sha256');
          for (const name of (await readdir(path.join(root, 'assets/css'))).filter(f => f.endsWith('.css')).sort()) hash.update(await readFile(path.join(root, 'assets/css', name)));
          for (const name of (await readdir(path.join(root, 'assets/js'))).filter(f => f.endsWith('.js')).sort()) hash.update(await readFile(path.join(root, 'assets/js', name)));
          for (const name of (await readdir(path.join(root, 'assets/video'))).filter(f => f.endsWith('.mp4')).sort()) hash.update(await readFile(path.join(root, 'assets/video', name)));
          const digest = hash.digest('hex').slice(0, 16);
          const p = path.join(root, 'data/design-release.json');
          const config = JSON.parse(await readFile(p, 'utf8'));
          config.assetDigest = digest;
          await writeFile(p, JSON.stringify(config, null, 2) + '\n');
          console.log(`assetDigest=${digest}`);
          NODE

          # Commit locally before the full audit: Stage 47 inspects git diff and needs a clean tree.
          # The helper deletes itself in that local commit, so workflow-safety also sees only permanent read-only workflows.
          rm .github/workflows/structural-books-menu-cleanup-v120.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Books dropdown markup and lock menu hierarchy'

          # Nothing reaches the remote branch unless the complete audit succeeds.
          npm test
          git push origin HEAD:fix/nav-books-structural-cleanup-20260811
