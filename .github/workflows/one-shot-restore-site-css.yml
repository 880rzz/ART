name: One-shot restore ART site CSS authority

on:
  push:
    branches: [audit/final-10of10-hardening-20260814]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-10of10-hardening-20260814
          fetch-depth: 0
      - name: Build deterministic compatibility authority
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            assets/css/page-base.css
            assets/css/archive-system.css
            assets/css/presence-core.css
            assets/css/apple-editorial-system.css
            assets/css/design-refinements.css
            assets/css/responsive-header-system.css
            assets/css/footer-elegant.css
            assets/css/archive-content-flow.css
            assets/css/record-editorial-system.css
            assets/css/chronology-surface-authority.css
            assets/css/final-layout-fixes.css
            assets/css/museum-editorial.css
            assets/css/palette-blue-final.css
            assets/css/homepage-two-tone-authority.css
          )
          for file in "${modules[@]}"; do test -s "$file"; done
          {
            printf '/* BANHALMI ART compatibility CSS authority — generated from canonical source modules. */\n'
            for file in "${modules[@]}"; do
              printf '\n/* SOURCE: %s */\n' "$file"
              cat "$file"
              printf '\n'
            done
          } > assets/css/site.css
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/site.css')
          p.write_text('\n'.join(line.rstrip() for line in p.read_text().splitlines()) + '\n')
          PY
          test -s assets/css/site.css
      - name: Teach audit the compatibility authority
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/audit-clean-architecture.mjs')
          s=p.read_text()
          needle="const approvedCss = [\n"
          if "'assets/css/site.css'" not in s:
              s=s.replace(needle, needle+"  'assets/css/site.css',\n")
          p.write_text(s)
      - name: Validate source contract
        run: npm test
      - name: Commit verified result and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-restore-site-css.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore ART compatibility CSS authority'
          git push origin HEAD:audit/final-10of10-hardening-20260814
