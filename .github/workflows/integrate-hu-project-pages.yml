name: Integrate Hungarian project pages

on:
  push:
    branches:
      - feature/archive-origins-foundation
    paths:
      - 'data/archive/hu-project-page-overrides.json'
      - 'scripts/integrate-hu-project-pages.mjs'
      - '.github/workflows/integrate-hu-project-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-origins-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate Hungarian book and exhibition metadata
        run: node scripts/integrate-hu-project-pages.mjs
      - name: Verify audits
        run: npm test
      - name: Commit generated pages
        shell: bash
        run: |
          if git diff --quiet -- hu/books hu/exhibitions; then
            echo 'No generated project-page changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hu/books hu/exhibitions
          git commit -m 'Integrate Hungarian book and exhibition metadata'
          git push origin HEAD:feature/archive-origins-foundation
