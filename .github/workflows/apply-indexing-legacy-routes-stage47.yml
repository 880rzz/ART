name: Apply indexing legacy routes stage47
on:
  push:
    branches: [audit/seo-geo-llm-gdpr-fix-20260808]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seo-geo-llm-gdpr-fix-20260808
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/apply-indexing-legacy-routes-stage47.mjs
      - run: rm -f scripts/apply-indexing-legacy-routes-stage47.mjs
      - run: npm test
      - name: Commit audited result
        run: |
          git config user.name "BANHALMI CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/apply-indexing-legacy-routes-stage47.yml
          git add -A
          git commit -m "fix: index all live pages and repair legacy 404 routes" || exit 0
          git push origin HEAD:audit/seo-geo-llm-gdpr-fix-20260808
