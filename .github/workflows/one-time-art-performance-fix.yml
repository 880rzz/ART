name: One-time ART performance fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-art-performance-fix.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate responsive hero images
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          test -f assets/img/hero.webp
          convert assets/img/hero.webp -strip -resize '480x>'  -quality 82 assets/img/hero-480.webp
          convert assets/img/hero.webp -strip -resize '768x>'  -quality 82 assets/img/hero-768.webp
          convert assets/img/hero.webp -strip -resize '1280x>' -quality 84 assets/img/hero-1280.webp
          ls -lh assets/img/hero*.webp

      - name: Add responsive hero preload and CSS delivery hints
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const file of ['index.html','hu/index.html','de-at/index.html']) {
            let html = readFileSync(file,'utf8');
            html = html.replace(/\n<link rel="preload" as="image" href="\/assets\/img\/hero-(?:768|1280)\.webp"[^>]*>/g,'');
            html = html.replace(/\n<link rel="preload" as="image" href="\/assets\/img\/hero\.webp"[^>]*>/g,'');
            const hints = [
              '<link rel="preload" as="image" href="/assets/img/hero-768.webp" media="(max-width: 600px)" fetchpriority="high">',
              '<link rel="preload" as="image" href="/assets/img/hero-1280.webp" media="(min-width: 601px) and (max-width: 1199px)" fetchpriority="high">',
              '<link rel="preload" as="image" href="/assets/img/hero.webp" media="(min-width: 1200px)" fetchpriority="high">'
            ].join('\n');
            if (!html.includes('href="/site.webmanifest"')) throw new Error(`manifest anchor missing in ${file}`);
            html = html.replace('<link rel="manifest" href="/site.webmanifest">', `<link rel="manifest" href="/site.webmanifest">\n${hints}`);
            writeFileSync(file,html);
          }
          NODE

      - name: Refresh guarded design release and all cache-busted references
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const configPath='data/design-release.json';
          const config=JSON.parse(readFileSync(configPath,'utf8'));
          config.release='20260808-fullbleed-lighthouse-v57';
          config.note='Stage 47: full-bleed archive-page surfaces; higher-contrast photographic hero eyebrow; responsive hero delivery and explicit LCP preload discovery.';
          const hash=createHash('sha256');
          for (const name of readdirSync('assets/css').filter(f=>f.endsWith('.css')).sort()) hash.update(readFileSync(path.join('assets/css',name)));
          for (const name of readdirSync('assets/js').filter(f=>f.endsWith('.js')).sort()) hash.update(readFileSync(path.join('assets/js',name)));
          for (const name of readdirSync('assets/video').filter(f=>f.endsWith('.mp4')).sort()) hash.update(readFileSync(path.join('assets/video',name)));
          config.assetDigest=hash.digest('hex').slice(0,16);
          writeFileSync(configPath,JSON.stringify(config,null,2)+'\n');
          console.log(config);
          NODE
          npm run bump:release

      - name: Install audit dependencies
        run: npm ci

      - name: Verify deterministic audit before commit
        run: npm run audit

      - name: Commit generated production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/hero-480.webp assets/img/hero-768.webp assets/img/hero-1280.webp data/design-release.json '*.html' 'hu/**/*.html' 'de-at/**/*.html' || true
          git add -u
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'perf: ship responsive hero assets and refreshed cache release'
          git push origin HEAD:main
