name: One-time page review release aligner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-page-review-release-once.yml'

permissions:
  contents: write

jobs:
  align-review-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align page review release token
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const reviewPath = 'data/page-simplification-review.json';
          const release = JSON.parse(fs.readFileSync('data/design-release.json', 'utf8')).release;
          const review = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));
          review.release = release;
          fs.writeFileSync(reviewPath, JSON.stringify(review, null, 2) + '\n');
          NODE
      - name: Commit aligned review metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/page-simplification-review.json
          if git diff --cached --quiet; then
            echo 'Page review already matches the active release.'
            exit 0
          fi
          git commit -m 'Align page review with ART footer release'
          git push origin HEAD:main
