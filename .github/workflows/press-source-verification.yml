name: Read-only press source verification
on:
  push:
    branches: [audit/art-editorial-source-snapshot-20261006]
    paths: [.github/workflows/press-source-verification.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5703c535881d893eb566edefd34e91b3bede0182
          persist-credentials: false
      - name: Capture primary public sources and existing exact archive candidates
        run: |
          mkdir -p /tmp/press-verification
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, concurrent.futures, re, datetime
          from html.parser import HTMLParser
          out=pathlib.Path('/tmp/press-verification')
          registry=json.loads(pathlib.Path('press-source-registry.json').read_text())
          urls=[r['sourceUrl'] for r in registry['languages']['en']['records']]
          urls += [
            'https://vehir.hu/cikk/76376-mindenki-maskeppen-mas',
            'https://volksgruppen.orf.at/magyarok/stories/3259086/',
            'https://volksgruppen.orf.at/magyarok/stories/3228649/',
            'https://volksgruppen.orf.at/magyarok/stories/3295966/',
            'https://jazzy.hu/adasok/banhalmi-norbert-fotomuvesz',
            'https://www.youtube.com/watch?v=xmZXqdL82-U',
            'https://www.youtube.com/watch?v=5ylseh-rduo',
            'https://www.youtube.com/watch?v=Jv9G9URQXlI',
            'https://www.youtube.com/watch?v=RZQba2sYtW8',
            'https://www.youtube.com/watch?v=GALpXRLvtnA',
            'https://www.youtube.com/watch?v=i8v_7xEp_go',
            'https://www.youtube.com/watch?v=k4aVodT_ARk',
            'https://drkonkolyritacoach.hu/2017/11/17/ebredes-az-uj-kezdet-konyv-es-fotoalbum/',
            'https://www.veol.hu/galeria/konya-peter-kiallitasa-a-tihanyi-rege-galeriaban/1',
            'https://likebalaton.hu/telepules/tihany/hireink/szabo-sipos-barnabas-szinesz-kepeibol-nyilt-kiallitas-tihanyban-197333/',
            'https://kultura.hu/az-ember-lelke-visszarazodik-ahhoz-ami-tenyleg-fontos-kiallitas-a-traumafeldolgozasrol-tihanyban/',
            'https://zarido.hu/the-frame-digitalis-fotomuveszeti-kiallitas-tihanyban/',
            'https://rolunk.at/aktualis/a-fiataloknak-ma-mar-bizonyitek-kell-egy-becsi-kreativ-kozosseg-uj-generaciot-epit/'
          ]
          videos=[]
          for url in urls:
            p=urllib.parse.urlsplit(url)
            vid=p.path.strip('/') if p.netloc=='youtu.be' else urllib.parse.parse_qs(p.query).get('v',[None])[0] if 'youtube.com' in p.netloc else None
            if vid:videos.append('https://www.youtube.com/oembed?format=json&url='+urllib.parse.quote('https://www.youtube.com/watch?v='+vid,safe=''))
          for old in ['https://mindennapkonyv.hu/mindennapi/olvastuk/a-noi-let-kilenc-fordulopontja-banhalmi-norbert-a-no-vilaga','https://she.life.hu/herself/2018/05/a-retusalatlan-test-is-szep-portre-kotet-a-nokrol','https://konyv.guru/nyero-paros-nok-kepekben-szavakban/']:
            urls.append('https://archive.org/wayback/available?timestamp=20250101&url='+urllib.parse.quote(old,safe=''))
          urls=list(dict.fromkeys(urls+videos))
          class Reader(HTMLParser):
            def __init__(self):super().__init__(convert_charrefs=True);self.skip=0;self.text=[];self.title=False;self.title_text='';self.meta={};self.jsonld=[];self.script=None
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=='meta':self.meta[a.get('property') or a.get('name') or '']=a.get('content','')
              if t=='title':self.title=True
              if t in ('script','style','svg'):self.skip+=1
              if t=='script' and a.get('type')=='application/ld+json':self.script=''
              if not self.skip and t in ('p','li','div','section','article','br','h1','h2','h3','h4'):self.text.append('\n')
            def handle_endtag(self,t):
              if t=='title':self.title=False
              if t=='script' and self.script is not None:
                try:self.jsonld.append(json.loads(self.script))
                except ValueError:pass
                self.script=None
              if t in ('script','style','svg') and self.skip:self.skip-=1;return
              if not self.skip and t in ('p','li','div','h1','h2','h3','h4'):self.text.append('\n')
            def handle_data(self,d):
              if self.title:self.title_text+=d
              if self.script is not None:self.script+=d
              if not self.skip:self.text.append(d)
          def fetch(item):
            i,url=item;result={'url':url,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'semanticApproval':False}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BANHALMI-Source-Audit/1.0)'})
              with urllib.request.urlopen(req,timeout=25) as response:
                raw=response.read(7000000).decode('utf-8','replace'); result.update({'status':response.status,'finalUrl':response.url})
                try:result['json']=json.loads(raw)
                except ValueError:
                  r=Reader();r.feed(raw)
                  result.update({'title':r.title_text,'meta':r.meta,'structuredData':r.jsonld,'text':re.sub('\n{3,}','\n\n','\n'.join(re.sub('[ \t]+',' ',line).strip() for line in ''.join(r.text).splitlines()))})
                  # Record public page metadata, not the video transcript or an assertion that the whole video was watched.
                  result['videoPageDates']=re.findall(r'"(?:publishDate|uploadDate)":"([^"]+)"',raw)
                  result['videoPageTitles']=re.findall(r'"title":"([^"\\]*(?:\\.[^"\\]*)*)"',raw)[:5] if 'youtube.com' in url else []
            except Exception as e:result['error']=str(e)
            file=f'{i:03d}.json';(out/file).write_text(json.dumps(result,ensure_ascii=False,indent=2));return {'file':file,'url':url,'status':result.get('status'),'title':result.get('title'),'error':result.get('error'),'json':result.get('json')}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(fetch,enumerate(urls)))
          (out/'index.json').write_text(json.dumps({'baseline':'5703c535881d893eb566edefd34e91b3bede0182','sources':results},ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: press-primary-source-verification
          path: /tmp/press-verification
          if-no-files-found: error
          retention-days: 7
