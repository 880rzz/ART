name: Temporary local poster capture (delete after asset import)
on:
  push:
    branches:
      - fix/ebredes-local-youtube-cover-20261010
    paths:
      - .github/workflows/_temp-ebredes-cover.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original video thumbnail for first-party consent-safe rendering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img/video
          curl --fail --location --silent --show-error --retry 3 --max-time 30 "https://i.ytimg.com/vi/npJ6YeYxQ64/maxresdefault.jpg" -o assets/img/video/npJ6YeYxQ64.jpg
          test "$(file -b --mime-type assets/img/video/npJ6YeYxQ64.jpg)" = "image/jpeg"
          test "$(wc -c < assets/img/video/npJ6YeYxQ64.jpg)" -gt 10000
          python3 - <<'PY'
          from pathlib import Path
          f=Path('assets/img/video/npJ6YeYxQ64.jpg')
          data=f.read_bytes()
          assert data[:2]==b'\xff\xd8' and data[-2:]==b'\xff\xd9', 'Invalid JPEG poster'
          print('Original YouTube video thumbnail stored locally:', len(data), 'bytes')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/video/npJ6YeYxQ64.jpg
          git commit -m "asset(ebredes): store original YouTube cover for GDPR-safe first-party display"
          git push origin HEAD:fix/ebredes-local-youtube-cover-20261010
