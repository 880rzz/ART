name: Expand blog migration redirects once

on:
  push:
    branches:
      - fix/blog-legacy-redirects-20260809

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/blog-legacy-redirects-20260809
          fetch-depth: 0

      - name: Generate exact blog migration coverage
        run: node scripts/expand-blog-migration-redirects.mjs

      - name: Commit generated migration tree locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(redirects): preserve legacy Wix blog URLs on blog subdomain"

      - name: Remove one-off write tooling
        run: |
          rm -f .github/workflows/expand-blog-migration-redirects-temp.yml scripts/expand-blog-migration-redirects.mjs
          git add -A
          git commit -m "chore: remove temporary blog redirect generator"

      - name: Run complete ART audit on final tree
        run: npm test

      - name: Push only audited final tree
        run: git push origin HEAD:fix/blog-legacy-redirects-20260809
