name: Temporary ART v69 release propagation
on:
  push:
    branches:
      - fix/art-blue-subpage-surfaces-20260809
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/art-blue-subpage-surfaces-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Propagate v69 release token to HTML
        run: npm run bump:release
      - name: Commit propagated release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: propagate ART v69 release token'
          git push origin HEAD:fix/art-blue-subpage-surfaces-20260809
