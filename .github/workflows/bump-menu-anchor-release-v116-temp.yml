name: Temporary ART v116 release propagation

on:
  push:
    branches:
      - fix/art-menu-anchor-integrity-20260811

permissions:
  contents: write

jobs:
  propagate-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/art-menu-anchor-integrity-20260811
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align nested palette import and release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/footer-elegant.css')
          s=p.read_text()
          import re
          s=re.sub(r"palette-blue-final\.css\?v=[^')\"]+", "palette-blue-final.css?v=20260811-menu-anchor-v116", s, count=1)
          p.write_text(s)
          PY
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const hash = createHash('sha256');
          for (const name of (await readdir('assets/css')).filter(f => f.endsWith('.css')).sort()) hash.update(await readFile(`assets/css/${name}`));
          for (const name of (await readdir('assets/js')).filter(f => f.endsWith('.js')).sort()) hash.update(await readFile(`assets/js/${name}`));
          for (const name of (await readdir('assets/video')).filter(f => f.endsWith('.mp4')).sort()) hash.update(await readFile(`assets/video/${name}`));
          const digest = hash.digest('hex').slice(0, 16);
          const path = 'data/design-release.json';
          const data = JSON.parse(await readFile(path, 'utf8'));
          data.release = '20260811-menu-anchor-v116';
          data.note = 'Stage 116 removes the exhibition catalogue dropdown in every viewport, validates every internal fragment destination across EN/HU/DE, and propagates the cache key through nested palette imports and all HTML assets.';
          data.assetDigest = digest;
          data.updated = '2026-08-11';
          await writeFile(path, JSON.stringify(data, null, 2) + '\n');
          console.log(`Computed ART asset digest ${digest}`);
          NODE
      - name: Apply release cache key across all HTML
        run: npm run bump:release
      - name: Commit generated v116 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/footer-elegant.css data/design-release.json '*.html' 'hu/**/*.html' 'de-at/**/*.html' '**/*.html'
          git commit -m 'Propagate ART menu anchor v116 release' || exit 0
          git push origin HEAD:fix/art-menu-anchor-integrity-20260811
