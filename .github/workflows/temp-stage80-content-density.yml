name: Temporary Stage 80 content density
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-stage80-content-density.mjs
      - run: node scripts/bump-editorial-release-cache.mjs
      - run: rm .github/workflows/temp-stage80-content-density.yml scripts/apply-stage80-content-density.mjs
      - run: |
          git config user.name "ART Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: simplify content density across all ART page families"
      - run: npm test
      - run: git push
