name: Apply image semantics stage 27

on:
  push:
    branches:
      - agent/image-semantics-stage27

permissions:
  contents: write

concurrency:
  group: image-semantics-stage27
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/image-semantics-stage27
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the reviewed image-system foundation from Git
        shell: bash
        run: |
          set -euo pipefail
          source_ref="origin/agent/image-semantic-audit-20260803"
          files=(
            data/image-knowledge-graph.jsonld
            data/image-metadata.json
            data/image-metadata.schema.json
            docs/image-review-workflow.md
            docs/image-semantics-standard.md
            tests/audit-image-html-sync.mjs
            tests/audit-image-knowledge-graph.mjs
            tests/audit-image-metadata-registry.mjs
            tests/audit-image-system-runtime-isolation.mjs
            tools/audit-image-semantics.mjs
            tools/build-image-inventory.mjs
            tools/build-image-jsonld.mjs
            tools/sync-image-metadata-to-html.mjs
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "$source_ref:$file" > "$file"
            echo "RESTORED $file"
          done

      - name: Rebase the image system onto the current archive
        run: node scripts/_apply-image-semantics-stage27.mjs

      - name: Apply verified multilingual image metadata
        run: |
          npm run sync:image-metadata:write
          npm run build:image-knowledge-graph
          npm run inventory:images
          npm run audit:images:report

      - name: Remove one-time migration files before safety audits
        run: |
          rm .github/workflows/_image-semantics-stage27.yml
          rm scripts/_apply-image-semantics-stage27.mjs

      - name: Run complete archive audit
        run: npm test

      - name: Commit verified generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply verified trilingual image semantics" || exit 0
          git push origin HEAD:agent/image-semantics-stage27
