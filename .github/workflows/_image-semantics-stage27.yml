name: Apply image semantics stage 27

on:
  push:
    branches:
      - agent/image-semantics-stage27

permissions:
  contents: write

concurrency:
  group: image-semantics-stage27
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/image-semantics-stage27
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize reviewed image semantics system
        run: node scripts/_apply-image-semantics-stage27.mjs

      - name: Apply verified multilingual image metadata
        run: |
          npm run sync:image-metadata:write
          npm run build:image-knowledge-graph
          npm run inventory:images
          npm run audit:images:report

      - name: Run complete archive audit
        run: npm test

      - name: Remove one-time migration files and commit generated state
        run: |
          rm .github/workflows/_image-semantics-stage27.yml
          rm scripts/_apply-image-semantics-stage27.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply verified trilingual image semantics" || exit 0
          git push origin HEAD:agent/image-semantics-stage27
