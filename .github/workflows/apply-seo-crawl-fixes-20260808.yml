name: Apply ART crawl fixes

on:
  push:
    branches:
      - audit/seo-geo-llm-gdpr-fix-20260808

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seo-geo-llm-gdpr-fix-20260808
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: node scripts/apply-seo-crawl-fixes-20260808.mjs
      - name: Remove one-off applicator before audit
        run: |
          rm -f scripts/apply-seo-crawl-fixes-20260808.mjs
          rm -f .github/workflows/apply-seo-crawl-fixes-20260808.yml
      - name: Run full ART audit
        run: npm test
      - name: Commit audited result without workflow mutation
        run: |
          git config user.name "BANHALMI CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/apply-seo-crawl-fixes-20260808.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align crawl indexing and LLM evidence policy"
          git push origin HEAD:audit/seo-geo-llm-gdpr-fix-20260808
