name: One-shot ART Stage152 global blue palette
on:
  push:
    branches:
      - fix/final-curatorial-footer-menu-20260815
    paths:
      - 'tools/one-shot-stage152-global-blue-palette.mjs'
      - '.github/workflows/one-shot-stage152-global-blue-palette.yml'
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-curatorial-footer-menu-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/one-shot-stage152-global-blue-palette.mjs
      - run: npm test
      - name: Commit and self-clean
        run: |
          rm tools/one-shot-stage152-global-blue-palette.mjs
          rm .github/workflows/one-shot-stage152-global-blue-palette.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire legacy light blue across ART archive"
          git push origin HEAD:fix/final-curatorial-footer-menu-20260815
