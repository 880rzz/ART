name: Apply homepage CTA update

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-home-cta-update.mjs
      - .github/workflows/apply-home-cta-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply homepage updates
        run: node scripts/apply-home-cta-update.mjs
      - name: Validate expected links and button classes
        run: |
          grep -F 'https://www.norbertbanhalmi.com/#services' index.html
          grep -F 'https://www.norbertbanhalmi.com/hu/#services' hu/index.html
          grep -F 'https://www.norbertbanhalmi.com/de-at/#services' de-at/index.html
          grep -E '<button[^>]*id="galmore"[^>]*class="[^"]*btn|<button[^>]*class="[^"]*btn[^"]*"[^>]*id="galmore"' index.html
          grep -E '<button[^>]*id="galmore"[^>]*class="[^"]*btn|<button[^>]*class="[^"]*btn[^"]*"[^>]*id="galmore"' hu/index.html
          grep -E '<button[^>]*id="galmore"[^>]*class="[^"]*btn|<button[^>]*class="[^"]*btn[^"]*"[^>]*id="galmore"' de-at/index.html
      - name: Commit generated changes and remove migration files
        run: |
          rm -f scripts/apply-home-cta-update.mjs .github/workflows/apply-home-cta-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hu/index.html de-at/index.html scripts/apply-home-cta-update.mjs .github/workflows/apply-home-cta-update.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add services CTA and unify gallery button"
          git push
