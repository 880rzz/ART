name: Repair Stage93 ecosystem decision paths
on:
  push:
    branches:
      - fix/ecosystem-decision-paths-stage93-20260810
    paths:
      - .github/workflows/repair-stage93-ecosystem.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecosystem-decision-paths-stage93-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add localized rights and curator decision paths
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const pages = [
            {
              home: 'index.html', curator: 'curators.html',
              contact: 'https://www.norbertbanhalmi.com/contact/',
              gallery: 'Print, publication or exhibition use',
              curatorEyebrow: 'Curatorial requests',
              curatorTitle: 'High-resolution files, exhibition documentation and publication rights.',
              curatorBody: 'For curatorial research, press reproduction, exhibition proposals or catalogue use, contact the studio directly. The archive remains the source; licensing and delivery are handled through BANHALMI.',
              contactLabel: 'Contact the studio', emailLabel: 'Email directly'
            },
            {
              home: 'hu/index.html', curator: 'hu/curators.html',
              contact: 'https://www.norbertbanhalmi.com/hu/kapcsolat/',
              gallery: 'Print, publikáció vagy kiállítási felhasználás',
              curatorEyebrow: 'Kurátori megkeresések',
              curatorTitle: 'Nagy felbontású fájlok, kiállítási dokumentáció és publikációs felhasználás.',
              curatorBody: 'Kurátori kutatáshoz, sajtómegjelenéshez, kiállítási javaslathoz vagy katalógusfelhasználáshoz közvetlenül a stúdióval érdemes kapcsolatba lépni. Az archívum marad a forrás; a felhasználási engedélyt és az anyagátadást a BANHALMI kezeli.',
              contactLabel: 'Kapcsolat a stúdióval', emailLabel: 'Közvetlen e-mail'
            },
            {
              home: 'de-at/index.html', curator: 'de-at/curators.html',
              contact: 'https://www.norbertbanhalmi.com/de-at/kontakt/',
              gallery: 'Print, Publikation oder Ausstellungsnutzung',
              curatorEyebrow: 'Kuratorische Anfragen',
              curatorTitle: 'Hochauflösende Dateien, Ausstellungsdokumentation und Publikationsrechte.',
              curatorBody: 'Für kuratorische Recherche, Presse-Reproduktionen, Ausstellungsvorschläge oder Katalognutzung wenden Sie sich direkt an das Studio. Das Archiv bleibt die Quelle; Nutzungsrechte und Datenbereitstellung werden über BANHALMI abgewickelt.',
              contactLabel: 'Studio kontaktieren', emailLabel: 'Direkt per E-Mail'
            }
          ];

          for (const p of pages) {
            let home = await readFile(p.home, 'utf8');
            if (!home.includes('data-ecosystem-path="art-rights"')) {
              const re = /(<div class="gal-actions">[\s\S]*?<\/div>)(\s*<\/div><\/section>)/;
              if (!re.test(home)) throw new Error(`${p.home}: gallery action anchor not found`);
              const rights = `\n  <p class="meta gallery-use-path" data-ecosystem-path="art-rights"><a class="btn-link" href="${p.contact}" rel="me">${p.gallery} →</a></p>`;
              home = home.replace(re, `$1${rights}$2`);
              await writeFile(p.home, home);
            }

            let curator = await readFile(p.curator, 'utf8');
            if (!curator.includes('data-ecosystem-path="curatorial-rights"')) {
              const section = `\n<section class="tone-a" data-ecosystem-path="curatorial-rights"><div class="wrap narrow"><p class="label">${p.curatorEyebrow}</p><h2>${p.curatorTitle}</h2><p class="lead">${p.curatorBody}</p><div class="hero-actions"><a class="btn-link" href="${p.contact}" rel="me">${p.contactLabel} →</a><a class="btn-link" href="mailto:hello@norbertbanhalmi.com">${p.emailLabel} →</a></div></div></section>\n`;
              const pos = curator.lastIndexOf('</main>');
              if (pos < 0) throw new Error(`${p.curator}: </main> not found`);
              curator = curator.slice(0, pos) + section + curator.slice(pos);
              await writeFile(p.curator, curator);
            }
          }

          const pkgPath = 'package.json';
          const pkg = JSON.parse(await readFile(pkgPath, 'utf8'));
          const audit = 'node tests/audit-ecosystem-decision-paths-stage93.mjs';
          if (!pkg.scripts.test.includes(audit)) pkg.scripts.test += ' && ' + audit;
          pkg.scripts['test:ecosystem-decision-paths'] = audit;
          await writeFile(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Run Stage93 audit
        run: node tests/audit-ecosystem-decision-paths-stage93.mjs
      - name: Run complete archive audit
        run: npm test
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hu/index.html de-at/index.html curators.html hu/curators.html de-at/curators.html package.json
          git commit -m "feat: add ART curator and rights decision paths"
          git push origin HEAD:fix/ecosystem-decision-paths-stage93-20260810
