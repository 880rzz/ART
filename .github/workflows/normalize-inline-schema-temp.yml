name: Normalize ART inline schema once

on:
  push:
    branches:
      - fix/art-inline-schema-canonical-20260809

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out schema branch
        uses: actions/checkout@v4
        with:
          ref: fix/art-inline-schema-canonical-20260809
          fetch-depth: 0

      - name: Normalize inline JSON-LD
        run: node scripts/normalize-art-inline-schema.mjs

      - name: Commit normalized product tree locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(schema): align ART inline entities with canonical BANHALMI graph"

      - name: Remove one-off write tooling
        run: |
          rm -f .github/workflows/normalize-inline-schema-temp.yml scripts/normalize-art-inline-schema.mjs
          git add -A
          git commit -m "chore: remove temporary inline schema normalizer"

      - name: Run full ART audit on clean final tree
        run: npm test

      - name: Push only the audited final tree
        run: git push origin HEAD:fix/art-inline-schema-canonical-20260809
