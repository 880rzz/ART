name: PR design release bump

on:
  push:
    branches:
      - fix/apple-text-accent-system-20260810

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apple-text-accent-system-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply release token to generated pages
        run: npm run bump:release
      - name: Commit generated cache keys
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply ART v73 release cache key"
          git push origin HEAD:fix/apple-text-accent-system-20260810
