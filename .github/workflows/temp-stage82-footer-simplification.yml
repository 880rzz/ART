name: Temporary Stage 82 footer simplification
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-stage82-footer-simplification.mjs
      - run: node scripts/bump-editorial-release-cache.mjs
      - run: rm .github/workflows/temp-stage82-footer-simplification.yml scripts/apply-stage82-footer-simplification.mjs
      - run: |
          git config user.name "ART Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: simplify multilingual ART footers"
      - run: npm test
      - run: git push
