name: One-time stage37 release cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-stage37-release-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run bump:release
      - name: Commit release-token propagation
        run: |
          if git diff --quiet; then
            echo 'No HTML cache-token changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html'
          git commit -m 'fix(release): propagate design authority v50 cache token'
          git push
