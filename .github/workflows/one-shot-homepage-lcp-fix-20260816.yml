name: One-shot homepage LCP remediation 2026-08-16

on:
  push:
    branches:
      - agent/full-10-10-audit-20260816

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-10-10-audit-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare audited LCP source changes
        run: |
          python tools/remediate-homepage-lcp-20260816.py
          node --check scripts/optimize-pages-artifact.mjs
          python -m py_compile scripts/generate-responsive-gallery.py
      - name: Run source contracts
        run: npm test
      - name: Build production-like artifact
        run: |
          set -euo pipefail
          rm -rf _site artifacts/lighthouse
          mkdir -p _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.3.0'
          python scripts/generate-responsive-gallery.py _site
          node scripts/optimize-pages-artifact.mjs _site
      - name: Enforce mobile Lighthouse 100/100/100/100
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs
      - name: Commit only after exact 100 gate passes
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-homepage-lcp-fix-20260816.yml
          rm tools/remediate-homepage-lcp-20260816.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize responsive homepage LCP delivery'
          git push origin HEAD:agent/full-10-10-audit-20260816
