name: One-shot homepage LCP source landing 2026-08-16

on:
  push:
    branches:
      - agent/full-10-10-audit-20260816

permissions:
  contents: write

jobs:
  land-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-10-10-audit-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce the already-validated LCP source changes
        run: |
          python tools/remediate-homepage-lcp-20260816.py
          node --check scripts/optimize-pages-artifact.mjs
          python -m py_compile scripts/generate-responsive-gallery.py
          npm test
      - name: Commit only non-workflow production source files
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-responsive-gallery.py scripts/optimize-pages-artifact.mjs
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          unexpected="$(printf '%s\n' "$staged" | grep -Ev '^(scripts/generate-responsive-gallery\.py|scripts/optimize-pages-artifact\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected staged files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize responsive homepage LCP source delivery'
          git push origin HEAD:agent/full-10-10-audit-20260816
