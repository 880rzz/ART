name: PR147 push remediation
on:
  push:
    branches: [fix/home-hero-gallery-size-20260823]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch canonical CSS and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/site.css')
          css=p.read_text(encoding='utf-8')
          start='/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */'
          end='/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */'
          anchor='/* APPLE-RESPONSIVE-CONTRACT-V1:END */'
          if start not in css:
              if end in css or anchor not in css: raise SystemExit('invalid marker state')
              block='''/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:START */
/* Homepage-only desktop CTA geometry. Mobile <=640px remains governed by the existing two-column/narrow-viewport authority. */
@media (min-width:641px){
  html body.apple-archive[data-archive-page="index"] header.hero .hero-cta .btn{
    box-sizing:border-box!important;
    inline-size:10.5rem!important;
    min-inline-size:10.5rem!important;
    max-inline-size:10.5rem!important;
  }
}
/* STAGE154-HOME-HERO-CTA-SIZE-CONSISTENCY:END */
'''
              p.write_text(css.replace(anchor,block+'\n'+anchor,1),encoding='utf-8')
          PY
          rm -f .github/workflows/pr147-remediate-push.yml .github/pr147-gitdata-trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/css/site.css .github/workflows/pr147-remediate-push.yml .github/pr147-gitdata-trigger
          git commit -m 'Equalize homepage hero CTA desktop geometry'
          git push origin HEAD:fix/home-hero-gallery-size-20260823
