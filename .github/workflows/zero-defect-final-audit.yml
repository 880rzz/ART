name: Zero-defect ART final audit

on:
  push:
    branches:
      - agent/zero-defect-final-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-defect-final-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic remediation
        run: npm run fix:strict-live
      - name: Commit generated remediation
        run: |
          if git diff --quiet; then
            echo "No remediation changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply zero-defect ART remediation [skip ci]"
            git push
          fi
      - name: Run complete ART audit suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee zero-defect-art.log
          s1=${PIPESTATUS[0]}
          npm run test:archive-hu 2>&1 | tee -a zero-defect-art.log
          s2=${PIPESTATUS[0]}
          npm run test:copy 2>&1 | tee -a zero-defect-art.log
          s3=${PIPESTATUS[0]}
          npm run test:coverage 2>&1 | tee -a zero-defect-art.log
          s4=${PIPESTATUS[0]}
          printf '{"test":%s,"archive":%s,"copy":%s,"coverage":%s}\n' "$s1" "$s2" "$s3" "$s4" > zero-defect-art-status.json
          exit $((s1 || s2 || s3 || s4))
      - name: Verify remediation is idempotent
        run: |
          npm run fix:strict-live
          git diff --exit-code -- ':!zero-defect-art.log' ':!zero-defect-art-status.json'
      - name: Record diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zero-defect-art.log zero-defect-art-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record zero-defect ART diagnostics [skip ci]"
          git push
