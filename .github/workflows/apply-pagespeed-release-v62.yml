name: Temporary one-shot ART v72 cache propagation

on:
  push:
    branches:
      - fix/art-retire-museum-authority-20260809

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/art-retire-museum-authority-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical release token to every generated page
        run: npm run bump:release
      - name: Commit generated cache-key propagation to this branch only
        run: |
          if git diff --quiet; then
            echo 'No release propagation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'chore: propagate ART homepage authority v72 cache key'
          git push origin HEAD:fix/art-retire-museum-authority-20260809
