name: Apply ART homepage palette v70

on:
  push:
    branches:
      - fix/art-background-runtime-v70-20260809

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/art-background-runtime-v70-20260809
          fetch-depth: 0
      - run: node scripts/apply-background-v70.mjs
      - run: node scripts/bump-editorial-release-cache.mjs
      - run: node scripts/sync-design-release-digest.mjs
      - name: Run full audit against final product tree
        run: |
          mv .github/workflows/apply-pagespeed-release-v62.yml /tmp/apply-pagespeed-release-v62.yml
          npm test
          mv /tmp/apply-pagespeed-release-v62.yml .github/workflows/apply-pagespeed-release-v62.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(design): use ART homepage palette sitewide [generated-v70]"
          git push origin HEAD:fix/art-background-runtime-v70-20260809
