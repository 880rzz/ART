name: One-time stage42 blue palette
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-blue-palette-stage42.mjs'
      - '.github/workflows/one-time-stage42-blue-palette.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ART blue palette
        run: node tools/migrate-blue-palette-stage42.mjs
      - name: Propagate release cache key
        run: npm run bump:release
      - name: Guard palette
        run: |
          grep -q -- '--c-ground:#202530' assets/css/page-base.css
          grep -q -- '--c-raised:#29303F' assets/css/page-base.css
          grep -q -- '--c-panel:#2D3444' assets/css/page-base.css
          grep -q 'html body.apple-archive #menu' assets/css/museum-editorial.css
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(design): unify ART on deep blue palette'
          git push
