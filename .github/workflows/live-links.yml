name: Live external links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Audit every live external and critical URL
        env:
          LIVE_AUDIT: '1'
        run: node tests/audit-seo-network.mjs
      - name: Verify current main is exact-live on production
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'verify/exact-live-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/880rzz/ART/git/ref/heads/main' | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")"
          actual="$(curl -fsSL --max-time 30 'https://www.banhalmi.art/deployment-sha.txt')"
          printf 'EXPECTED_SHA=%s\nACTUAL_SHA=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

          check_fetch() {
            local url="$1"
            local out="$2"
            echo "FETCH $url"
            curl -fsSL --max-time 30 -o "$out" "$url"
          }

          check_fetch 'https://www.banhalmi.art/' /tmp/art-en.html
          check_fetch 'https://www.banhalmi.art/hu/' /tmp/art-hu.html
          check_fetch 'https://www.banhalmi.art/de-at/' /tmp/art-de.html
          grep -q 'Official Art Archive' /tmp/art-en.html
          grep -q 'BANHALMI ART' /tmp/art-hu.html
          grep -q 'BANHALMI ART' /tmp/art-de.html

          check_fetch 'https://www.banhalmi.art/llms.txt' /tmp/art-llms.txt
          grep -Fq '[AI reference](https://www.banhalmi.art/ai.txt)' /tmp/art-llms.txt
          grep -Fq 'https://www.norbertbanhalmi.com/' /tmp/art-llms.txt
          grep -Fq 'https://blog.banhalmi.art/' /tmp/art-llms.txt
          grep -Fq '[Books](https://www.banhalmi.art/#books)' /tmp/art-llms.txt

          bundle="$(grep -Eo '/assets/css/bundles/art-[a-f0-9]{16}\.css' /tmp/art-en.html | head -n1)"
          test -n "$bundle"
          check_fetch "https://www.banhalmi.art${bundle}" /tmp/art-bundle.css
          grep -Fq 'inline-size:10.5rem!important' /tmp/art-bundle.css
          grep -Fq 'min-inline-size:10.5rem!important' /tmp/art-bundle.css
          grep -Fq 'max-inline-size:10.5rem!important' /tmp/art-bundle.css
          grep -Fq 'width:calc(100% - 40px)!important' /tmp/art-bundle.css

          check_fetch 'https://www.banhalmi.art/exhibitions/fotokiallitas1.html' /tmp/art-exhibition.html
          grep -Fq 'data-exhibition-axis-contract="v1"' /tmp/art-exhibition.html
          grep -Fq 'width:calc(100% - 40px)!important' /tmp/art-exhibition.html

          for forbidden in '.github/workflows/pages.yml' 'package.json' 'package-lock.json' 'tools/audit-clean-architecture.mjs' 'scripts/apply-artifact-css-contracts.mjs'; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://www.banhalmi.art/$forbidden")"
            case "$code" in
              404|410) ;;
              *) echo "Repository-only production path leaked: $forbidden returned $code" >&2; exit 1 ;;
            esac
          done
      - name: Upload link audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-link-audit-${{ github.sha }}
          path: link-audit-results.json
          if-no-files-found: warn
          retention-days: 14
