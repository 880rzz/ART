name: Apply ART sitemap freshness stage 33

on:
  push:
    branches: [main]
    paths:
      - 'tools/sync-sitemap-lastmod.mjs'
      - '.github/workflows/apply-sitemap-freshness-stage33.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize sitemap lastmod from Git history
        run: node tools/sync-sitemap-lastmod.mjs
      - name: Commit synchronized sitemap and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-sitemap-freshness-stage33.yml
          git add sitemap.xml tools/sync-sitemap-lastmod.mjs
          git commit -m "fix(seo): synchronize ART sitemap lastmod with source history" || exit 0
          git push
