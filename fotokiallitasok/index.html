<!doctype html>
<html lang="hu-HU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://www.banhalmi.art/hu/">
<title>Az oldal új helyre költözött</title>
<script>
(() => {
  const legacy = new URLSearchParams(location.search);
  const language = (legacy.get('lang') || '').toLowerCase();
  let prefix = '/hu/';
  let recognized = true;
  if (/^en(?:-[a-z]{2})?$/.test(language)) prefix = '/';
  else if (/^de(?:-[a-z]{2})?$/.test(language)) prefix = '/de-at/';
  else if (!/^hu(?:-[a-z]{2})?$/.test(language)) recognized = false;
  const target = new URL(prefix + '#exhibitions', 'https://www.banhalmi.art');
  target.search = location.search;
  if (recognized) target.searchParams.delete('lang');
  window.location.replace(target.href);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://www.banhalmi.art/hu/#exhibitions"></noscript>
</head>
<body>
<p>A kiállítási archívum új helyre költözött.</p>
<p><a href="https://www.banhalmi.art/hu/#exhibitions" hreflang="hu">Kiállítások</a> · <a href="https://www.banhalmi.art/#exhibitions" lang="en" hreflang="en">Exhibitions</a> · <a href="https://www.banhalmi.art/de-at/#exhibitions" lang="de" hreflang="de-AT">Ausstellungen</a></p>
</body>
</html>
